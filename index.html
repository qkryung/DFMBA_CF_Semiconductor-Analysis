3–2027 전망"}, "side": {"stat": "×3.5", "title": "메모리 매출 전망, 2025 → 2026", "text": "WSTS 2026년 6월 전망: 전체 7,956억 → 1조 5,112억 달러. 메모리는 2,300억 → 8,039억 달러로 3.5배. 산업 성장의 대부분이 메모리 가격이다.", "small": "SIA: 2026년 9월 월매출 1,726억 달러(+147% YoY), 3분기 5,177억 달러(+24% QoQ, 3분기 연속 20%+). 1~9월 누적 이미 1조 달러 초과."}, "note": "2023~2025 실제치, 2026~2027은 WSTS Spring 2026 전망(2026-06-02). 2026-08-06 중간 집계는 2026년 1조 6,550억(+108%), 2027년 약 2.1조 달러로 상향. 가을 전망은 12월 초 발표.", "study": {"paragraphs": ["Part 2의 시대 지도에서 2001년 −32%가 사상 최악의 해였다면, 2026년은 사상 최대의 해입니다. WSTS가 2026년 6월에 낸 전망은 세계 반도체 매출이 2025년 7,956억 달러에서 2026년 1조 5,112억 달러로 89.9% 늘어난다는 것이었고, 8월 2분기 중간 집계에서는 상반기 매출 7,020억 달러(+102%)를 반영해 연간 1조 6,550억 달러(+108%)로 다시 올렸습니다. SIA 집계로 9월 한 달 매출이 1,726억 달러, 전년 대비 147% 증가입니다. 1986년부터 2025년까지 40년간 30배가 됐는데 2026년 한 해에 두 배가 되는 셈입니다.", "두 배의 내용을 뜯어 보면 메모리입니다. WSTS 전망에서 메모리 매출은 2025년 2,300억 달러에서 2026년 8,039억 달러로 3.5배(+250%)가 되고, 전체 증가분 7,156억 달러 중 5,739억 달러(80%)가 메모리입니다. 로직(GPU·ASIC)도 늘지만 메모리처럼 ‘같은 제품의 가격이 두세 배’가 된 것은 아닙니다. Part 2 규칙 ②(메모리는 가격이 순위와 이익을 흔든다)가 역사상 가장 큰 규모로 작동하고 있는 것입니다. 수요 쪽 원인은 하이퍼스케일러의 AI 데이터센터 투자(2026년 7,200억 달러+)이고, 공급 쪽 원인은 HBM이 DRAM 웨이퍼를 3배 쓰면서 범용 DRAM 공급이 줄어든 것입니다.", "발표에서는 막대 다섯 개 중 2025와 2026F 두 개만 가리키며 ‘1년 만에 두 배, 그 대부분이 메모리 가격’이라고 말합니다. 청중이 ‘물량이 두 배가 됐나’라고 물으면 ‘아니다, 가격이다’라고 답하고 다음 장표(가격 그래프)로 넘어가거나, 시간이 없으면 바로 한국 기업의 이익 장표로 갑니다. 전망치는 WSTS의 6월 숫자를 쓰고 8월 상향은 각주로 두었습니다. 발표일이 12월 이후라면 WSTS 가을 전망으로 갱신해야 합니다."], "script": "현재입니다. 세계 반도체 매출은 2025년 7,956억 달러에서 2026년 1조 5,000억 달러, 1년 만에 두 배가 될 전망입니다. 40년간 30배가 됐는데 올해 한 해에 두 배입니다. 내용을 보면 메모리가 3.5배입니다. 물량이 아니라 가격입니다. HBM이 웨이퍼를 세 배 쓰면서 범용 DRAM이 부족해졌고, 하이퍼스케일러는 올해만 7,200억 달러를 투자합니다.", "transition": "그 가격이 어떻게 움직였는지 보겠습니다.", "question": "2026년 두 배 성장은 2010년(+32%)이나 2017년(+22%)과 무엇이 다른가?", "answer": "규모와 원인이 다릅니다. 2010년은 금융위기 기저효과, 2017년은 서버 DRAM 가격이었고 둘 다 20~30%대였습니다. 2026년은 +90~108%로 역사상 유례가 없고, 메모리 가격 급등(3.5배)과 AI 가속기 물량 증가가 겹쳤습니다. 다만 원인의 성격은 2017년과 같습니다. 가격이 주도한 성장은 가격이 꺾일 때 같은 속도로 되돌아갑니다.", "extraQA": [{"q": "WSTS 전망은 믿을 만한가?", "a": "WSTS는 회원사(주요 반도체 기업)의 실제 판매 집계를 바탕으로 연 2회 전망을 내며 과거 전망의 오차는 사이클 전환점에서 컸습니다. 2026년은 상반기 실제치(+102%)가 이미 확인된 상태라 연간 전망의 불확실성은 하반기 가격에 한정됩니다. 2027년 전망(+27%)은 2027년 하반기 신규 공급과 수요자 투자에 따라 크게 달라질 수 있습니다."}], "sourceIds": ["WSTS", "WSTS_FORECAST", "wsts_q2_2026", "sia_sep2026", "trendforce_server_2027"]}, "coreTransition": "그 결과 한국 기업은 이런 숫자를 냈습니다."}, {"id": "p3-price", "part": "p3", "title": "DRAM 가격: 상승은 계속되지만 ‘변화율의 정점’은 지났다", "subtitle": "범용 DRAM 계약가격 전분기 대비 상승률(TrendForce 전망, 범위의 중간값)", "type": "chart", "kind": "svg", "core": false, "takeaway": "1분기 +90%에서 4분기 +10%로. 가격은 오르지만 상승률은 꺾였다. 메모리 주가가 6월에 고점을 찍은 이유다", "sources": ["trendforce_dram", "trendforce_server_2027", "trendforce_hbm", "ms_memory_2026"], "items": [{"label": "4Q25", "value": 47.5, "text": "+45~50%", "sub": "서버 +53~58%"}, {"label": "1Q26", "value": 92.5, "text": "+90~95%", "sub": "PC +105~110%", "highlight": true}, {"label": "2Q26", "value": 60.5, "text": "+58~63%", "sub": "2차 전재"}, {"label": "3Q26", "value": 15.5, "text": "+13~18%", "sub": "서버 +13~18%"}, {"label": "4Q26F", "value": 12.5, "text": "+10~15%", "sub": "HBM 포함 +15~20%", "dim": true}], "opts": {"width": 820, "height": 340, "max": 110, "unit": "%", "decimals": 0, "label": "범용 DRAM 계약가격 분기별 상승률"}, "side": {"stat": "9.5×", "title": "DDR4 8Gb 계약가, 2016년 6월 대비", "text": "10월 평균 $27.5. DDR5 16Gb 고정가는 6월 $40에서 10월 $50. 4분기 +15~20% 인상 제안은 고객 저항에 부딪혔고 11월 계약가는 10월보다 ‘소폭’ 높은 수준.", "small": "HBM4 계약가 mid-$500s vs HBM3E 12단 mid-$300s(+50%+). 2027 HBM 가격 전망 +50%(애널리스트)~+79%(UBS). 2027 서버 DRAM은 공급 부족 지속 전망(TrendForce)."}, "note": "TrendForce 분기 전망의 범위 중간값. 2Q26 수치는 2차 전재. 실제 3분기 ASP: 삼성 DRAM 약 +20%, SK하이닉스 20%대 후반(실적 발표).", "study": {"paragraphs": ["가격 그래프에서 볼 것은 높이가 아니라 기울기입니다. TrendForce 전망으로 범용 DRAM 계약가격은 2025년 4분기 +45~50%, 2026년 1분기 +90~95%(PC용은 +105~110%)로 정점을 찍은 뒤 2분기 +58~63%, 3분기 +13~18%, 4분기 +10~15%로 상승률이 둔화됐습니다. 가격 수준은 계속 오르고 있습니다. DDR4 8Gb 계약가는 10월 평균 $27.5로 2016년 6월의 9.5배, DDR5 16Gb 고정가는 6월 $40에서 10월 $50입니다. 그러나 4분기에 공급사가 제안한 +15~20%는 고객 저항에 부딪혔고 11월 계약가는 10월보다 소폭 높은 데 그쳤습니다. 모건스탠리가 7월에 ‘변화율의 정점’이라고 부른 것이 이것입니다.", "주가는 이 기울기를 따라갑니다. 삼성전자는 6월 19일 374,500원, SK하이닉스는 52주 고점 2,987,000원을 찍은 뒤 11월 5일 각각 201,500원(−46%), 1,264,000원(−58%)입니다. 분기 영업이익이 57조 → 89조 → 107조원(삼성), 38조 → 61조 → 83조원(SK하이닉스)으로 늘어나는 동안 주가는 반토막이 났습니다. Part 2 시기 7의 교훈 그대로입니다. 메모리 주가는 이익의 정점이 아니라 이익 증가율의 정점에서 꺾이고, 모건스탠리는 역사적으로 이익 고점 4~8개월 전에 주가가 고점을 찍었다고 지적합니다.", "다만 이번에는 다른 점이 있습니다. 2027년 서버 DRAM은 비트 공급이 15~20%만 늘어 부족이 이어진다는 전망(TrendForce 7월)이 있고, HBM4 계약가는 HBM3E보다 50% 이상 높으며, SK하이닉스는 2027~28년 생산능력의 절반 이상을 5년 장기계약으로 묶었습니다. 가격 상승률이 둔화되는 것과 가격이 하락하는 것은 다릅니다. ‘상승률 둔화 → 횡보 → 하락’ 중 어디까지 갈지가 2027년의 질문이고, 그 답은 수요자(빅테크)의 투자 지속 여부에 달려 있습니다. 이 장표는 선택 심화이며, 시간이 없으면 앞 장표에서 ‘가격 상승률은 1분기가 정점’이라는 한 문장으로 대신합니다."], "script": "가격을 보면 1분기 90% 상승이 정점이었고 4분기는 10%대입니다. 가격은 계속 오르지만 상승률은 꺾였습니다. 그래서 분기 이익이 57조, 89조, 107조로 늘어나는 동안 삼성 주가는 고점 대비 46%, 하이닉스는 58% 떨어졌습니다. 메모리 주가는 이익의 정점이 아니라 이익 증가율의 정점에서 꺾입니다. 2017년에 본 그대로입니다.", "transition": "그래도 올해 한국 기업의 이익은 역사적입니다.", "question": "가격이 아직 오르는데 왜 주가가 떨어지나?", "answer": "주가는 미래 이익의 변화를 반영하는데, 상승률 둔화는 ‘미래 이익이 지금보다 더 빨리 늘지는 않는다’는 신호이고 여기에 금리 상승(할인율)과 규제 위험이 겹쳤습니다. 2018년에도 삼성 영업이익은 사상 최대였지만 주가는 그 해에 떨어졌습니다. 경기순환 기업의 주가를 당기 PER로 보면 안 되는 이유입니다.", "sourceIds": ["trendforce_dram", "trendforce_server_2027", "trendforce_hbm", "ms_memory_2026", "kospi_1105"]}, "coreTransition": "그래도 올해 한국 기업의 이익은 역사적입니다."}, {"id": "p3-korea", "part": "p3", "title": "한국 메모리의 기록: 영업이익률 72%와 80%", "subtitle": "2026년 3분기 공시 · 삼성전자 DS 부문 · SK하이닉스 연결 · Micron FY2026(9월 결산) · 한국 10월 수출", "type": "cards", "core": true, "takeaway": "2023년 적자에서 3년 만에 영업이익률 70~80%. 반도체가 한국 수출의 절반이 됐다. 이익도, 위험도 한 곳에 집중됐다", "sources": ["C01", "C02", "micron_fy26", "korea_exports_oct2026", "kospi_1105"], "cards": [{"label": "삼성전자 DS · 2026 Q3", "title": "매출 147.1조 · 영업이익 106.5조", "stat": "72%", "text": "회사 전체 195.3조 / 107.4조<br>메모리 매출 140.7조(+427% YoY)", "detail": "2026 설비투자 84.4조(DS 76.8조). 2027 HBM ‘목표가에 완판’, HBM4가 HBM 매출의 60%. 주주환원 2026년 90~110조원", "accent": true}, {"label": "SK하이닉스 · 2026 Q3", "title": "매출 104.6조 · 영업이익 83.3조", "stat": "80%", "text": "순현금 98.7조(현금 114.5조 − 차입 15.8조)<br>2029년까지 DRAM·HBM 사실상 완판", "detail": "14개 고객과 5년 LTA(선수금), 2027~28 생산능력의 50%+ 계약. 2026 주주환원 약 100조원. 2023년에는 영업손실 7.7조", "accent": true}, {"label": "Micron · FY2026(9월 결산)", "title": "매출 $133.2bn · 매출총이익률 80.7%", "stat": "FCF $62.3bn", "text": "전년 매출 $37.4bn의 3.6배<br>FQ1'27 가이던스 $61.5bn", "detail": "FY27 생산의 75%+ 이미 계약, 2027 HBM 대부분 계약·가격 인상. 재고일수 129일(+9)은 주의 신호"}, {"label": "한국 수출 · 2026년 10월", "title": "반도체 $564억 (+259%)", "stat": "수출의 49%", "text": "1년 전 26.4% → 49.0%<br>메모리 $501억(+361%)", "detail": "삼성+SK하이닉스 = 코스피 시총의 51.7%. 11/5 코스피 −5.28%, 삼성 −7.57%, SK하이닉스 −9.46%: 집중의 대가"}], "study": {"paragraphs": ["숫자부터 정확히 합니다. 삼성전자의 2026년 3분기 연결 매출은 195.3조원, 영업이익 107.4조원이고, 그중 반도체(DS) 부문이 매출 147.1조원에 영업이익 106.5조원으로 영업이익률 72%입니다. 메모리 매출만 140.7조원으로 전년 대비 427% 늘었습니다. SK하이닉스는 매출 104.6조원, 영업이익 83.3조원, 영업이익률 80%이며 현금 114.5조원에서 차입 15.8조원을 뺀 순현금이 98.7조원입니다. 2023년 영업손실 7.7조원에서 3년 만의 일입니다. Micron은 9월 결산 FY2026 매출 1,332억 달러(전년 374억의 3.6배), 매출총이익률 80.7%, 잉여현금흐름 623억 달러를 기록했습니다.", "분기 영업이익의 궤적이 Part 2 규칙 ②의 교과서입니다. 삼성전자 2025년 1분기 6.7조 → 2026년 1분기 57.2조 → 2분기 89.5조 → 3분기 107.4조원, SK하이닉스 7.4조 → 37.6조 → 60.5조 → 83.3조원. 1년 반 사이 10배가 됐고, 그 대부분은 같은 제품의 가격입니다. 삼성 DRAM 3분기 ASP는 약 +20%(QoQ), SK하이닉스는 20%대 후반이었고 물량은 한 자릿수 증가였습니다. 이익이 가격에서 왔다는 것은 가격이 내리면 같은 속도로 사라진다는 뜻입니다. 2018년 58.9조원 → 2019년 27.8조원(삼성), 20.8조 → 2.7조원(SK하이닉스)이 그 전례입니다.", "구조적으로 달라진 점도 분명합니다. SK하이닉스는 14개 고객과 5년 장기공급계약(선수금 포함)을 맺어 2027~28년 생산능력의 절반 이상을 계약으로 묶었고 ‘2029년까지 사실상 완판’이라고 밝혔습니다. 삼성은 2027년 HBM이 ‘합의된 목표가에 완판’됐고 HBM4가 HBM 매출의 60%라고 밝혔으며, Micron은 FY2027 생산의 75% 이상이 계약됐다고 했습니다. 2017년에는 없던 계약 구조입니다. 다만 장기계약은 물량의 가시성을 높일 뿐 가격 재협상과 고객의 지불 능력 위험까지 없애지는 못합니다. 그래서 다음 장표부터 수요자(빅테크)의 재무를 봅니다.", "한국 경제 차원의 숫자도 알아 둡니다. 10월 수출 1,152.8억 달러 중 반도체가 564.4억 달러(+259%)로 49.0%를 차지했습니다. 1년 전에는 26.4%였습니다. 삼성전자와 SK하이닉스 두 종목이 코스피 시가총액의 51.7%입니다. 그래서 11월 5일 미국 선거 결과에 코스피가 5.28% 떨어졌습니다. 이익이 집중된 만큼 위험도 집중됐다는 것이 이 장표의 마지막 메시지입니다. 자본배분 관점에서는 삼성의 2026년 설비투자 84.4조원과 주주환원 90~110조원, SK하이닉스의 순현금 98.7조원과 환원 100조원·용인 투자가 ‘린니어의 질문’의 2026년판입니다."], "script": "그 결과 삼성 반도체 부문은 3분기 매출 147조원에 영업이익 106조원, 영업이익률 72%. SK하이닉스는 105조원에 83조원, 영업이익률 80%, 순현금 99조원입니다. 2023년 7.7조 적자에서 3년 만입니다. Micron도 매출총이익률 80%입니다. 한국 수출의 49%가 반도체이고 두 회사가 코스피의 절반입니다. 이익도 위험도 한 곳에 모였습니다.", "transition": "그런데 바로 이 가을, 환경이 바뀌었습니다.", "question": "영업이익률 80%는 지속 가능한가?", "answer": "역사적으로는 아닙니다. 메모리 영업이익률은 2018년 50%대에서 2019년 10%대, 2023년 적자로 갔습니다. 다만 이번에는 5년 장기계약, HBM의 기술 장벽, 2027년까지의 공급 부족 전망이 하락의 시점을 늦추고 폭을 줄일 수 있습니다. ‘80%가 유지된다’가 아니라 ‘하락이 언제 어떤 폭으로 오는가’가 올바른 질문이고, 그 답은 수요자의 투자 지속 여부에 달려 있습니다.", "extraQA": [{"q": "SK하이닉스 순현금 98.7조원은 어디에 쓰이나?", "a": "세 갈래입니다. 2026년 주주환원 약 100조원(배당 30조+, 자사주 60조+), 용인 1기 팹(2027년 2월 클린룸)·청주 M17·미국 인디애나 패키징 등 설비투자(2027년 ‘대폭 증가’), 그리고 불황 대비 보유. 린니어 케이스의 질문(배당·자사주·보유·투자)이 규모만 1,000배 커진 셈입니다."}, {"q": "왜 순이익이 영업이익보다 훨씬 작나(SK하이닉스 3분기 39.8조)?", "a": "법인세와 2분기 Kioxia 지분 관련 평가이익의 기저효과 때문입니다. 2분기 순이익 93.9조원에는 Kioxia 관련 이익이 포함됐고, 3분기에는 그것이 빠졌습니다. 영업이익률과 순이익률을 구분해서 말해야 합니다."}], "sourceIds": ["C01", "C02", "C04", "micron_fy26", "korea_exports_oct2026", "kospi_1105", "hynix_ir", "samsung_ir"]}, "coreTransition": "그런데 바로 이 가을, 환경이 바뀌었습니다."}, {"id": "p3-capex", "part": "p3", "title": "수요자의 장부: 투자는 늘고 현금은 마이너스", "subtitle": "하이퍼스케일러·네오클라우드 2026년 3분기 실적(달러) · 2026년 4사 설비투자 약 $720bn+, 2027년 $1조 전망", "type": "table", "core": false, "compact": true, "takeaway": "2017년의 고객은 자기 돈으로 샀다. 2026년의 고객은 빚으로 산다. 공급자의 이익은 수요자의 부채 위에 서 있다", "sources": ["msft_fy27q1", "googl_q3_2026", "amzn_q3_2026", "meta_q3_2026", "orcl_fy27", "crwv_q2_2026", "imf_gfsr_2026"], "headers": ["기업", "분기 설비투자", "FCF", "2026 투자 가이던스", "부채·신용", "수주잔고·성장"], "rows": [["Microsoft (FY27 Q1)", "$45.2B (리스 포함)", "+$18.6B", "역년 약 $170B ($175B에서 하향)", "—", "RPO $677B · Azure +48%"], ["Alphabet", "$51.4B", "−$9.1B", "$195~205B · 2027 ‘대폭 증가’", "장기부채 $125.1B (연초 $46.5B)", "클라우드 +103%"], ["Amazon", "$77.3B (TTM $215B)", "−$42.4B (TTM)", "현금 기준 약 $220B · 2027 ‘의미 있게 더’", "장기부채 $173.1B (연초 $65.6B)", "AWS 잔고 $578B · +39%"], ["Meta", "$34.9B", "−$2.1B", "$135~145B", "S&P 전망 ‘부정적’ · 지분 $95B 조달 계획", "—"], ["Oracle (FY27)", "—", "−$5B", "FY27 $90~95B", "부채 $125.3B · BBB− · CDS 292bp", "RPO $664B · 주가 YTD −33%"], ["CoreWeave (Q2)", "—", "순손실 $626M", "—", "부채 $35B · 주가 $87 → $48", "백로그 $104B · Q3 실적 11/10"]], "note": "각사 실적 발표·보도 기준. IMF GFSR(10/13): 순환거래 14건 ≈ 지분 $300B + 부채 $650B vs 매출 약정 $1.4조. 2026년 9월까지 AI 관련 채권 발행 약 $450B. 캔자스시티 연은: SPV 약 90% 차입, 네오클라우드 부채/자산 약 85%.", "study": {"paragraphs": ["이 표가 Part 3의 핵심 증거입니다. 메모리를 사는 쪽의 장부를 보면, Microsoft를 제외한 모두가 잉여현금흐름 적자입니다. Alphabet은 3분기 설비투자 514억 달러에 FCF −91억 달러, Amazon은 분기 773억 달러(연환산 2,152억)에 TTM FCF −424억 달러, Meta는 FCF −21억 달러입니다. 그런데 2026년 가이던스는 모두 상향됐습니다. Alphabet 1,950~2,050억, Amazon 약 2,200억, Meta 1,350~1,450억, Microsoft 약 1,700억 달러로 4사 합계 7,200억 달러를 넘고, 골드만삭스는 2027년 1조 달러를 넘는다고 봅니다. 투자가 영업현금을 넘어서니 부채가 늘었습니다. Alphabet 장기부채 465억 → 1,251억 달러, Amazon 656억 → 1,731억 달러. Meta는 S&P가 등급 전망을 ‘부정적’으로 바꿨고 950억 달러 지분 조달 계획을 냈습니다.", "2017년과의 차이가 여기에 있습니다. 2017년 서버 메모리를 산 클라우드 기업들은 영업현금 안에서 투자했습니다. 2026년에는 투자가 현금을 넘어 채권·지분·SPV로 조달됩니다. IMF가 10월 금융안정보고서에서 지적한 ‘순환거래’ 14건은 지분 3,000억 달러와 부채 6,500억 달러로 1조 4,000억 달러의 매출 약정을 떠받치는 구조이고, 캔자스시티 연은은 AI 기업의 투자등급 채권 발행이 2023년 2%에서 2026년 10%로 늘었으며 SPV는 약 90%가 차입이라고 분석했습니다. 네오클라우드는 더 취약합니다. CoreWeave는 분기 순손실 6억 2,600만 달러에 부채 350억 달러, 주가는 87달러에서 48달러로 떨어졌고, Oracle은 신용등급 BBB−에 CDS 292bp로 투기등급 직전입니다.", "그래도 투자가 계속되는 이유가 표의 마지막 열입니다. Microsoft RPO 6,770억, Oracle 6,640억, AWS 잔고 5,780억 달러. 고객(AI 랩·기업)이 이미 계약한 미래 매출입니다. 클라우드 매출 성장률도 Azure +48%, Google Cloud +103%, AWS +39%로 가속 중입니다. 즉 ‘투자 대비 매출이 돌아오고 있는가’라는 질문에 아직은 ‘그렇다’이고, 문제는 그 매출 약정의 상당 부분이 OpenAI(2030년까지 컴퓨트 약 6,000억 달러 약정, 연 매출 run-rate 약 500억) 같은 적자 기업에 의존한다는 점입니다. 공급자(메모리)의 80% 이익률은 이 수요자들의 차입 위에 서 있습니다. 발표에서는 Amazon 행과 Alphabet 행만 읽고 ‘공급자는 현금을 쌓고 수요자는 빚을 쌓는다’는 한 문장으로 요약합니다."], "script": "메모리를 사는 쪽의 장부입니다. Microsoft만 현금이 남고, Alphabet, Amazon, Meta는 잉여현금이 마이너스입니다. Amazon은 1년간 424억 달러 적자입니다. 그런데 내년 투자는 더 늘립니다. 그래서 Alphabet 부채는 465억에서 1,251억 달러, Amazon은 656억에서 1,731억 달러가 됐습니다. 2017년의 고객은 자기 돈으로 샀고, 2026년의 고객은 빚으로 삽니다. 공급자의 이익은 수요자의 부채 위에 서 있습니다.", "transition": "그 부채의 비용, 금리가 올해 가을에 올랐습니다.", "question": "빅테크의 FCF 적자는 위험 신호인가?", "answer": "일시적이면 정상입니다. 1990년대 통신사도, 2010년대 셰일 기업도 성장 투자기에 FCF 적자를 냈습니다. 위험은 세 가지가 겹칠 때입니다. 적자가 2년 이상 지속되고, 투자 대비 매출 성장률이 둔화되며, 금리 상승으로 차환 비용이 오를 때입니다. 지금은 첫째만 시작됐고 둘째는 아직 반대(가속)이며 셋째가 진행 중입니다. 그래서 ‘지표로 판단’이라는 결론이 됩니다.", "extraQA": [{"q": "순환거래(circular deals)란?", "a": "NVIDIA가 OpenAI에 투자하고 OpenAI가 그 돈으로 NVIDIA 칩을 사거나, 클라우드가 AI 랩에 지분 투자를 하고 AI 랩이 그 클라우드의 컴퓨트를 약정하는 식으로 공급자·고객·투자자가 겹치는 거래입니다. 매출이 실제 외부 수요인지, 자기 자본이 돌아온 것인지 구분이 어려워지고, 한 고리가 끊기면 연쇄로 영향을 받습니다. 1990년대 통신장비 업체의 벤더 파이낸싱과 같은 구조입니다."}], "sourceIds": ["msft_fy27q1", "googl_q3_2026", "amzn_q3_2026", "meta_q3_2026", "orcl_fy27", "crwv_q2_2026", "imf_gfsr_2026", "kcfed_ai", "anthropic_espionage"]}, "coreTransition": "그 부채의 비용, 금리가 올해 가을에 올랐습니다."}, {"id": "p3-reversal", "part": "p3", "title": "2026년 가을의 반전: 유가 → 금리 → 선거 → 속도 조절론", "subtitle": "수요자의 자본비용이 오르고, 정치가 전력과 부지를 조이기 시작했다", "type": "timeline", "core": true, "takeaway": "공급자의 기록 이익과 수요자의 FCF 적자가 같은 분기에 있다. 시장은 11월 4일 ‘투자 속도 조절’을 수요자에게는 호재, 공급자에게는 악재로 읽었다", "sources": ["oil_iran_2026", "fed_2026", "cnbc_midterm", "cnbc_ballot", "markets_1104", "kospi_1105", "ai_pacing_2026"], "events": [{"year": "2026.02–03", "title": "이란 전쟁 · 유가", "text": "브렌트 $72 → $120(3/9)<br>호르무즈 봉쇄, 4/7 휴전<br>9월 CPI 3.7%, 에너지 +20%"}, {"year": "2026.09.16", "title": "Fed 첫 인상", "text": "3.75–4.00%, 12–0<br>2023년 이후 첫 인상<br>10년물 4.7~4.9%"}, {"year": "2026.10.28–30", "title": "동결 · 빅테크 실적", "text": "동결 10–2(2명 인상 주장)<br>투자 가이던스 상향<br>Alphabet FCF −$9.1B"}, {"year": "2026.11.03", "title": "중간선거", "text": "민주당 상·하원 장악<br>주민투표 41건 중 40건 DC 반대<br>TX·OH 주지사 모라토리엄", "accent": true}, {"year": "2026.11.04", "title": "뉴욕", "text": "NVDA −3.2% · MU −7.0%<br>VRT −13.8% · CRWV −9.9%<br>MSFT +6.7% · AMZN +6.1%"}, {"year": "2026.11.05", "title": "서울", "text": "코스피 −5.28%<br>삼성 −7.57% · SK하이닉스 −9.46%<br>외국인 5일 연속 순매도", "accent": true}], "note": "속도 조절의 증거: MSFT 역년 투자 $175B→$170B(네오클라우드 지연)·Nscale 영국 철수, Stargate Abilene 축소, Data Center Watch 2Q26 45건·$68B 지연, Heatmap 1Q26 20건·$41.7B 취소, 가스터빈 백로그 122GW(GE Vernova). 반대 증거: 가이던스 상향, RPO $677B·$664B, 12월 Fed 인상 확률 79%는 수요가 아직 강하다는 뜻.", "study": {"paragraphs": ["반전은 네 단계로 왔습니다. 첫째, 2월 28일 이란 전쟁으로 브렌트유가 72달러에서 3월 9일 120달러까지 올랐고 호르무즈 해협이 봉쇄됐다가 4월 7일 휴전했지만, 9월 소비자물가는 3.7%(에너지 +20%)로 다시 올랐습니다. 둘째, 연준은 9월 16일 2023년 이후 처음으로 금리를 올려 3.75~4.00%를 만들었고 10월 28일 동결했지만 두 명이 추가 인상을 주장했으며 12월 인상 확률은 79%로 읽힙니다. 10년물 국채는 4.7~4.9%대입니다. 2024~25년의 인하 기대가 2026년에 재인상으로 뒤집힌 것입니다. 할인율이 오르면 먼 미래의 현금(AI 투자의 회수)이 가장 크게 깎입니다. Part 2 시기 8의 2022년(0 → 5.5%, SOX −35%)과 같은 메커니즘입니다.", "셋째, 11월 3일 중간선거에서 민주당이 상원(54석+)과 하원(258석+, 33년 만의 최대 격차)을 모두 장악했습니다. 데이터센터는 이번 선거의 지역 쟁점이었습니다. 10개 주 41건의 데이터센터 관련 주민투표 중 40건이 반대로 결론 났고(오하이오 21건), CNBC 출구 여론에서 56%가 데이터센터를 투표의 주요 요인으로 꼽았습니다. 텍사스 주지사 당선자(Hinojosa)는 데이터센터 전면 모라토리엄을, 오하이오(Acton)는 조건부 모라토리엄을 공약했습니다. 연방에서는 전기요금 전가를 막는 Ratepayer Protection Act가 하원을 417 대 3으로 통과했고(상원 cloture 57–43 부결), 샌더스·AOC의 전국 모라토리엄 법안이 있습니다. 뉴욕은 7월 행정명령으로 50MW 이상 신규 데이터센터를 임시 중단했고, 텍사스는 474GW에 달하는 전력 연결 대기열(90%가 데이터센터)을 감사하며 9월 환경 허가를 중단했습니다.", "넷째, 시장의 해석입니다. 11월 4일 뉴욕에서 NVIDIA −3.2%, Micron −7.0%, Vertiv(전력·냉각) −13.8%, CoreWeave −9.9%가 떨어지는 동안 Microsoft +6.7%, Amazon +6.1%가 올랐습니다. 투자 속도가 늦춰지면 수요자의 FCF는 좋아지고 공급자의 매출은 둔화된다는 해석입니다. 11월 5일 코스피는 5.28% 떨어졌고 삼성전자 −7.57%, SK하이닉스 −9.46%, 외국인은 5일 연속 순매도였습니다. 골드만삭스는 규제 영향을 받는 주가 계획 용량의 약 45%라면서도 중단은 ‘일시적’이라고 했고, UBS는 2028년 증설의 약 30%가 위험하다고 봤습니다.", "속도 조절론의 증거와 반대 증거를 같이 말해야 공정합니다. 증거: Microsoft가 네오클라우드 지연을 이유로 역년 투자를 50억 달러 줄였고, Stargate Abilene이 축소됐으며, Data Center Watch 집계로 2분기에 45건·680억 달러가 지연, Heatmap 집계로 1분기에 20건·417억 달러가 취소됐고, 가스터빈 백로그(GE Vernova 122GW, 2031년까지 예약)와 PJM 용량 경매 상한이 전력 병목을 보여줍니다. 반대 증거: 2026·2027년 가이던스가 상향됐고, RPO와 백로그가 늘었으며, Anthropic–Google의 멀티GW TPU 계약 같은 장기 약정이 이어지고, 금리 인상 전망 자체가 수요가 강하다는 뜻입니다. 우리 조의 판단은 ‘속도 조절은 시작됐지만 사이클을 꺾은 것은 아직 아니다’이며 그 근거는 뒤의 전망 장표에서 말합니다."], "script": "그런데 이 가을에 환경이 바뀌었습니다. 이란 전쟁으로 유가가 올랐고, 물가가 다시 3.7%가 되자 연준이 9월에 2023년 이후 처음으로 금리를 올렸습니다. 10년물은 4.9%입니다. 그리고 이번 주 화요일 중간선거에서 민주당이 압승했습니다. 데이터센터 주민투표 41건 중 40건이 반대였고 텍사스 주지사 당선자는 모라토리엄을 공약했습니다. 어제 뉴욕에서 Micron이 7%, 오늘 코스피가 5%, 하이닉스가 9% 떨어졌습니다. 재미있는 건 Microsoft와 Amazon은 올랐다는 겁니다. 투자 속도가 늦춰지면 사는 쪽은 좋고 파는 쪽은 나쁘다는 해석입니다.", "transition": "그렇다면 이번 사이클은 2017년의 반복인가, 아니면 다른가. 표로 비교하겠습니다.", "question": "민주당 의회가 데이터센터를 실제로 막을 수 있나?", "answer": "완전히는 어렵습니다. 연방 입법은 상원 60표가 필요하고(Ratepayer Protection Act는 57표로 부결), 데이터센터 허가는 주·지방 권한이며, 공화당 주와 전력이 남는 주는 유치를 계속할 것입니다. 현실적 영향은 세 가지입니다. 전기요금 전가 규제로 데이터센터의 전력 비용 상승, 특정 주(TX·OH·NY)의 허가 지연, 그리고 연방 보조·세제 혜택의 축소 가능성입니다. 총량을 막기보다 입지와 비용을 바꾸고 시점을 늦추는 효과입니다.", "extraQA": [{"q": "금리 인상이 반도체 산업에 미치는 경로는?", "a": "세 가지입니다. 첫째 할인율 상승으로 성장주 멀티플 하락(주가), 둘째 수요자의 차입 비용 상승으로 투자 가이던스 하향 위험(매출), 셋째 네오클라우드·Oracle처럼 차입 의존도가 높은 고객의 차환 위험(고객 신용). 2022년에는 첫째가, 2026년에는 둘째·셋째가 더 중요합니다. 빅테크가 자기 현금으로 투자했다면 금리는 주가 문제로 끝나지만, 빚으로 투자하면 매출 문제가 됩니다."}, {"q": "한국은행과 환율은?", "a": "한국은행은 7월 2.75%, 8월 27일 3.00%로 올렸고 10월 22일 동결했으며 다음 회의는 11월 26일입니다. 원/달러는 1,341원 수준입니다. 금리 인상은 반도체 수출 호황에 따른 물가·자산 가격 압력 때문이고, 환율은 외국인 순매도에도 수출 흑자(10월 425억 달러)가 받치고 있습니다."}], "sourceIds": ["oil_iran_2026", "fed_2026", "cnbc_midterm", "cnbc_ballot", "dc_policy_2026", "dcmap", "markets_1104", "kospi_1105", "ai_pacing_2026"]}, "coreTransition": "그렇다면 이번 사이클은 2017년의 반복인가, 아니면 다른가. 표로 비교하겠습니다."}, {"id": "p3-policy", "part": "p3", "title": "데이터센터 규제의 지도: 연방·주·지방·당선자", "subtitle": "2026년 11월 5일 기준 · 민간 트래커 dcmap.us: 주법 14건, 행정명령 7건, 지역 모라토리엄 33건", "type": "cards", "core": false, "takeaway": "규제는 총량을 막기보다 입지·비용·시점을 바꾼다. 골드만삭스는 영향 주가 계획 용량의 45%라면서도 ‘일시적’이라 본다", "sources": ["dc_policy_2026", "dcmap", "cnbc_ballot", "cnbc_midterm", "ai_pacing_2026"], "cards": [{"label": "연방 의회", "title": "전기요금 전가 금지, 모라토리엄 법안", "stat": "417–3 / 57–43", "text": "Ratepayer Protection Act 하원 통과,<br>상원 cloture 부결 · 샌더스/AOC 전국 모라토리엄 · GRID Act", "detail": "민주당 다수 의회에서 재추진 가능. 다만 상원 60표 벽과 2027년 1월 개원까지의 시차"}, {"label": "주 정부", "title": "뉴욕·텍사스·버지니아", "stat": "474 GW", "text": "NY EO 62: 50MW+ 임시 중단(7/14)<br>TX: 전력 대기열 감사·TCEQ 허가 중단(9/21)<br>VA: 데이터센터세 $0.011/kWh", "detail": "텍사스 대기열의 90%가 데이터센터. BNEF: 약 50GW 위험. ERCOT 신규 연결 일시 중단", "accent": true}, {"label": "지방 주민투표", "title": "41건 중 40건 반대", "stat": "56%", "text": "10개 주 · 오하이오 21건<br>CNBC 출구 여론: 데이터센터가<br>투표의 주요 요인이라는 응답", "detail": "전기요금·물·소음이 쟁점. 지역 허가가 입지를 결정하므로 공화당 주에서도 반대 가능"}, {"label": "당선자", "title": "텍사스 · 오하이오 주지사", "stat": "2027.01 취임", "text": "Hinojosa(TX): 전면 모라토리엄 공약<br>Acton(OH): 조건부 모라토리엄<br>GA·IA·NV·AK도 교체", "detail": "골드만: 영향 주 = 계획 용량 45%, 중단은 ‘일시적’. UBS: 2028 증설의 30% 위험. 전력 남는 주(인디애나·루이지애나 등)로 이동 가능"}], "study": {"paragraphs": ["규제를 네 층으로 나눠 봅니다. 연방 의회에서는 데이터센터의 전력 비용을 일반 소비자 요금에 전가하지 못하게 하는 Ratepayer Protection Act가 하원을 417 대 3으로 통과했으나 상원에서 토론 종결(cloture) 표결이 57 대 43으로 부결됐습니다. 60표가 필요합니다. 샌더스 상원의원과 오카시오코르테스 하원의원의 전국 모라토리엄 법안, 하인리히 상원의원의 GRID Act(송전망)도 있습니다. 민주당이 상·하원 다수가 된 2027년 1월 이후 재추진될 수 있지만 상원 60표의 벽은 남습니다. 주 정부 층에서는 뉴욕이 7월 14일 행정명령 62호로 50MW 이상 신규 데이터센터를 임시 중단했고, 텍사스는 8월 3일 474GW에 달하는 전력 연결 대기열(약 90%가 데이터센터)을 감사하기 시작해 ERCOT 신규 연결을 멈추고 9월 21일 환경 허가(TCEQ)를 중단했습니다. BNEF는 텍사스에서 약 50GW가 위험하다고 봤습니다. 버지니아는 kWh당 1.1센트의 데이터센터세를 도입했습니다.", "지방 층이 이번 선거의 특징입니다. 10개 주 41건의 데이터센터 관련 주민투표 중 40건이 반대로 결론 났고 오하이오에서만 21건이었습니다. 전기요금, 물 사용, 소음, 세금 감면이 쟁점이었고 CNBC 출구 여론에서 56%가 데이터센터를 투표의 주요 요인으로 꼽았습니다. 데이터센터 허가는 결국 지방정부의 토지 이용 권한이므로, 공화당 주에서도 지역 반대로 지연될 수 있습니다. 당선자 층에서는 텍사스 주지사 당선자 Hinojosa가 전면 모라토리엄을, 오하이오 Acton이 조건부 모라토리엄을 공약했고 조지아·아이오와·네바다·알래스카 주지사도 교체됐습니다. 취임은 2027년 1월입니다.", "투자 영향의 추정치는 엇갈립니다. 골드만삭스는 규제 영향을 받는 주가 미국 계획 용량의 약 45%라고 보면서도 중단은 ‘일시적’이며 전력이 남는 주로 이동한다고 봅니다. UBS는 2028년 증설분의 약 30%가 위험하다고 봅니다. 데이터센터가 늦춰지면 GPU·HBM 주문도 늦춰지지만 취소되는 것은 아니라는 것이 공급사들의 입장이고(SK하이닉스 ‘2029년까지 완판’), 시장은 11월 4~5일 그 ‘지연’ 가능성을 공급자 주가에 반영했습니다. 이 장표는 선택 심화이며, 발표에서는 앞 장표의 ‘41건 중 40건’과 ‘골드만 45%·일시적’만 말해도 됩니다."], "script": "규제를 네 층으로 보면, 연방은 전기요금 전가 금지법이 하원을 통과했지만 상원 60표에 막혔고, 주는 뉴욕과 텍사스가 신규 데이터센터를 멈췄으며, 지방 주민투표는 41건 중 40건이 반대였고, 텍사스·오하이오 주지사 당선자는 모라토리엄을 공약했습니다. 골드만삭스는 영향 주가 계획 용량의 45%지만 일시적이라고 봅니다. 규제는 총량을 막기보다 입지와 비용과 시점을 바꿉니다.", "transition": "이제 2017년과 2026년을 한 표로 비교하겠습니다.", "question": "데이터센터가 전력이 남는 주로 옮기면 반도체 수요는 그대로인가?", "answer": "총량은 비슷하지만 시점이 늦춰집니다. 새 입지에서 전력 계약·허가·건설에 2~3년이 걸리고, 가스터빈 백로그(122GW, 2031년까지 예약)와 변압기 부족이 겹쳐 있습니다. 메모리 입장에서 ‘취소’와 ‘2년 지연’은 다르지만, 2027년 하반기 신규 공급과 지연된 수요가 만나면 2019년형 재고 조정이 올 수 있습니다. 그래서 전력 지표(가스터빈 수주, 원전 재가동, 송전 허가)도 반도체 지표입니다.", "sourceIds": ["dc_policy_2026", "dcmap", "cnbc_ballot", "cnbc_midterm", "ai_pacing_2026", "iea_energy_ai"]}, "coreTransition": "이제 2017년과 2026년을 한 표로 비교하겠습니다."}, {"id": "p3-test", "part": "p3", "title": "시험대: 반복되는 사이클인가, 이번에는 다른가", "subtitle": "2017–19 메모리 슈퍼사이클과 2025–26 AI 사이클의 같은 점과 다른 점", "type": "table", "core": true, "compact": true, "takeaway": "다른 것: 수요 주체, 계약 구조, 수요자의 부채. 같은 것: 가격 변화율의 정점, 2027년 신규 공급, 금리. 결론은 ‘지표로 판단’", "sources": ["gartner2017", "gartner2019", "trendforce_dram", "C02", "micron_fy26", "googl_q3_2026", "amzn_q3_2026", "fed_2026", "ms_memory_2026", "bull_memory_2026"], "headers": ["항목", "2017–19 슈퍼사이클", "2025–26 AI 사이클", "반복인가, 다른가"], "rows": [["수요 주체", "클라우드 서버용 범용 DRAM", "AI 가속기 + HBM + 서버 DRAM·eSSD<br>하이퍼스케일러 5곳·네오클라우드·AI 랩", "다르다: 고객이 집중됐고 투자 규모는 10배"], ["계약 구조", "분기 계약 · 고객 재고 조정에 취약", "5년 LTA·선수금(SK하이닉스 14개사, 2027–28 용량 50%+)<br>Micron FY27 생산 75%+ 계약", "다르다: 물량 가시성은 높지만 가격·고객 신용 위험은 남는다"], ["가격", "2017 메모리 +62% → 2019 −31%", "DRAM 계약가 1Q26 +90~95% → 4Q26 +10~15%<br>2026 메모리 매출 +250% 전망", "반복: 변화율의 정점은 이미 지났다"], ["공급", "2018 증설 → 2019 과잉", "2027 하반기~2028 신규 팹(삼성 P5·SK M15X·용인·Micron ID1)<br>HBM이 DRAM 웨이퍼의 20 → 30% 흡수", "반복: 신규 공급은 2027 하반기부터, 그 전까지 부족"], ["수요자 재무", "빅테크 FCF 흑자, 영업현금 내 투자", "Alphabet·Amazon·Meta FCF 적자<br>AI 채권 $450bn, SPV 90% 차입, 순환거래", "다르다(악화): 투자가 차입에 의존"], ["금리", "2.25–2.50%(2018 인상기) · 4Q18 SOX −20%", "3.75–4.00%(2026.9 재인상) · 10년물 4.9%", "반복: 할인율이 실적보다 먼저 주가를 때린다"], ["정치", "미중 관세 · 화웨이 제재(공급 측)", "미중 수출통제 + 데이터센터 규제(수요 측)", "다르다: 전력·부지라는 수요 측 변수가 추가"], ["주가", "2018 실적 정점 전에 하락 시작", "2026.6 고점 대비 삼성 −46%, SK하이닉스 −58%<br>MS: 메모리 주가는 이익 고점 4~8개월 전 정점", "반복: 주가는 이익 증가율을 따라간다"]], "note": "강세론(골드만·UBS·BofA): 2028년까지 부족, LTA가 가격을 고정, ‘30년 만의 사이클’. 약세론(모건스탠리·JPM·CLSA): ‘슈퍼사이클은 실재하나 사이클성은 사라지지 않았다’, 낮은 PER는 밸류에이션 함정, 2027년 하반기 신규 공급. BofA 스스로의 단서: ‘대부분의 구조 변화 서사는 사이클로의 회귀로 끝난다.’", "study": {"paragraphs": ["표를 세로로 읽으면 ‘다르다’가 네 줄, ‘반복’이 네 줄입니다. 다른 점은 수요 주체(범용 DRAM을 사는 클라우드 → AI 가속기·HBM·서버 메모리를 사는 하이퍼스케일러·네오클라우드·AI 랩, 투자 규모 10배), 계약 구조(분기 계약 → 5년 장기계약과 선수금, SK하이닉스 14개사·2027~28년 용량 50%+, Micron FY2027 생산 75%+), 수요자의 재무(자기 현금 → 차입·SPV·순환거래), 그리고 정치가 공급(수출통제)뿐 아니라 수요(전력·부지 규제)까지 건드린다는 점입니다. 반복되는 점은 가격 변화율의 정점이 지났다는 것, 신규 공급이 2027년 하반기부터 나온다는 것, 금리가 실적보다 먼저 주가를 때린다는 것, 그리고 주가가 이익 증가율을 따라간다는 것입니다.", "강세론과 약세론을 공정하게 소개합니다. 골드만삭스(6월)는 2028년까지 공급 부족이 이어지고 2027년 DRAM 수급이 −5.9%라며 삼성 48만원·SK하이닉스 350만원을 제시했고, UBS(4월)는 ‘30년 만의 사이클’, BofA(6월)는 장기계약이 가격을 고정하는 ‘구조적 이익 성장’이라고 했습니다. 반면 모건스탠리(10월)는 ‘슈퍼사이클은 실재하지만 사이클성은 사라지지 않았다’며 2027년 하반기 신규 공급과 ‘낮은 PER는 밸류에이션 함정’을 지적했고, JPMorgan·CLSA는 가장 낮은 목표가(SK하이닉스 125~160만원)를 냈습니다. 흥미로운 것은 BofA의 단서입니다. ‘대부분의 구조 변화 서사는 사이클로의 회귀로 끝난다.’ 강세론자도 사이클을 부정하지는 않습니다.", "우리 조의 결론은 ‘둘 다 맞다’입니다. 수요의 성격과 계약 구조는 구조적으로 바뀌었고 그래서 하락의 시점이 늦춰지고 폭이 줄 수 있습니다. 그러나 메모리의 가격 메커니즘, 신규 공급의 시차, 금리의 할인율 효과는 그대로이고 여기에 수요자의 부채라는 새 위험이 추가됐습니다. 따라서 ‘구조 변화다’ 또는 ‘반복이다’라고 선언하는 대신, 어느 쪽으로 가는지를 알려 줄 지표를 정해 놓고 분기마다 확인하는 것이 기업재무의 답입니다. 다음 장표가 그 지표입니다. 발표에서는 표의 마지막 열만 위에서 아래로 읽어도 메시지가 전달됩니다."], "script": "2017년과 비교하면 다른 점이 넷, 같은 점이 넷입니다. 다른 것은 수요 주체와 투자 규모, 5년 장기계약, 그리고 수요자가 빚으로 산다는 것. 같은 것은 가격 상승률의 정점이 지났다는 것, 신규 공급이 2027년 하반기에 나온다는 것, 금리가 주가를 먼저 때린다는 것. 강세론과 약세론이 갈리지만, 강세론자인 BofA조차 ‘대부분의 구조 변화 서사는 사이클로 끝난다’고 단서를 달았습니다. 그래서 우리 결론은 선언이 아니라 지표입니다.", "transition": "무엇을 보고 판단할 것인가. 투자하는 쪽의 지표입니다.", "question": "장기계약(LTA)이 있으면 2019년 같은 급락은 없지 않나?", "answer": "급락의 폭은 줄일 수 있지만 없애지는 못합니다. 장기계약은 물량을 보장하지만 가격 조항은 대개 분기·반기 재협상이고, 고객이 재무적으로 어려워지면 계약 자체가 재조정됩니다(2001년 통신장비, 2009년 태양광의 선례). 또 계약된 50%를 제외한 나머지 물량은 스팟·단기 가격을 따릅니다. 장기계약은 ‘사이클 완화 장치’이지 ‘사이클 제거 장치’가 아닙니다.", "extraQA": [{"q": "PER 2.5배(선행)는 역사상 가장 싼 것 아닌가?", "a": "분모가 사이클 정점의 이익이면 싼 것이 아닙니다. 2018년 메모리 주식도 PER 5~6배였고 이듬해 이익이 반 토막 나자 배수는 두 배가 됐습니다. 모건스탠리가 ‘밸류에이션 함정’이라고 부르는 이유입니다. 경기순환 기업은 PBR·정상화 이익·사이클 평균 ROE로 봐야 하며, 삼성 PBR 약 2.2~2.6배, SK하이닉스 약 3.5배는 과거 사이클 고점(2018년 삼성 약 1.5배)보다 높습니다."}], "sourceIds": ["gartner2017", "gartner2019", "trendforce_dram", "trendforce_server_2027", "C02", "micron_fy26", "googl_q3_2026", "amzn_q3_2026", "fed_2026", "ms_memory_2026", "bull_memory_2026", "kospi_1105"]}, "coreTransition": "무엇을 보고 판단할 것인가. 투자하는 쪽의 지표입니다."}, {"id": "p3-metrics", "part": "p3", "title": "무엇을 볼 것인가: 공급자의 이익률이 아니라 수요자의 현금", "subtitle": "AI 투자 사이클의 수명을 결정하는 재무 지표 체크리스트 · 2026년 3분기 현재값과 경고 신호", "type": "table", "core": true, "compact": true, "takeaway": "2012년 Elpida의 교훈을 고객에게 적용하라. 매출 성장 · 이익률 · FCF · 이자보상배율 · 부채비율 · 수주잔고 · 재고, 일곱 개면 충분하다", "sources": ["msft_fy27q1", "googl_q3_2026", "amzn_q3_2026", "meta_q3_2026", "orcl_fy27", "crwv_q2_2026", "kcfed_ai", "micron_fy26", "apple_inventory", "trendforce_dram"], "headers": ["지표", "무엇을 보나", "2026년 3분기 현재", "경고 신호"], "rows": [["① 매출 성장 (클라우드·AI)", "투자가 매출로 돌아오는가", "Azure +48% · Google Cloud +103% · AWS +39%<br>NVIDIA 데이터센터 +117%, AMD +97%", "클라우드 성장률 < 설비투자 증가율이 2분기 이상"], ["② 순이익 · 영업이익률", "감가상각이 이익을 잠식하는가", "빅테크 흑자 유지 · 감가상각 급증 시작<br>CoreWeave 분기 순손실 $626M", "영업이익 증가율 < 매출 증가율"], ["③ FCF", "투자 뒤에 현금이 남는가", "MSFT +$18.6B · Alphabet −$9.1B<br>Amazon TTM −$42.4B · Meta −$2.1B · Oracle −$5B", "2년 연속 적자 + 빚으로 주주환원"], ["④ 이자보상배율", "영업이익으로 이자를 갚는가", "빅테크 수십 배 · Oracle BBB−, CDS 292bp<br>네오클라우드 부채/자산 약 85%", "3배 이하 · 네오클라우드 차환 실패"], ["⑤ 부채비율 · 순부채/EBITDA", "투자가 빚으로 바뀌는가", "Alphabet 장기부채 $46.5B → $125.1B<br>Amazon $65.6B → $173.1B · AI 채권 $450B", "등급 하향(Meta 전망 ‘부정적’) · 순부채/EBITDA 3배"], ["⑥ 수주잔고 · RPO", "미래 매출이 계약됐는가", "MSFT RPO $677B · Oracle $664B · AWS $578B<br>SK하이닉스 LTA 14개사", "취소·연기 증가 · 적자 AI 랩 의존도"], ["⑦ 재고 · 가격 (공급 측)", "고객이 미리 사 두었는가", "Micron 재고일수 129일(+9) · Apple 재고 +154%<br>4Q DRAM +15~20% 제안에 고객 저항", "스팟 < 계약가 · 계약가 하락 전환"]], "note": "최종 기준은 ROIC > WACC. 10년물 4.9%에서 빅테크 WACC는 10% 안팎(교육용 가정), 2026~27년 1.7조 달러 투자의 연 감가상각은 2,000억 달러 수준. ①이 유지되는 한 ③~⑤의 악화는 ‘성장 투자’이고, ①이 꺾이면 같은 숫자가 ‘과잉 투자’가 된다.", "study": {"paragraphs": ["Part 2 시기 5의 교훈은 ‘기술이 있어도 만기를 못 맞추면 무너진다’였고, 그때 무너진 쪽은 공급자(Elpida)였습니다. 2026년에는 같은 질문을 수요자에게 던져야 합니다. 메모리 공급자는 순현금 98.7조원(SK하이닉스)을 쌓고 있으므로 공급자의 재무는 문제가 아닙니다. 문제는 그 이익을 만들어 주는 고객이 투자를 계속할 수 있는가이고, 그것은 고객의 재무제표에 있습니다. 일곱 지표를 순서대로 봅니다. ① 매출 성장: 투자가 매출로 돌아오는가. 현재 Azure +48%, Google Cloud +103%, AWS +39%로 가속 중이며 이것이 유지되는 한 나머지 지표의 악화는 ‘성장 투자’로 읽힙니다. ② 이익률: 1조 달러 넘는 투자의 감가상각(서버 5~6년 기준 연 2,000억 달러 수준)이 이익을 잠식하기 시작하는 시점을 봅니다. ③ FCF: Microsoft만 흑자이고 Alphabet·Amazon·Meta·Oracle은 적자입니다. 2년 연속 적자이면서 빚으로 자사주를 사면 경고입니다.", "④ 이자보상배율(영업이익 ÷ 이자비용)은 빅테크는 수십 배로 안전하지만 Oracle(BBB−, CDS 292bp)과 네오클라우드(부채/자산 약 85%, CoreWeave 분기 손실 6억 달러)는 3배 아래로 떨어질 수 있는 구간이고, 금리가 오르면 차환이 어려워집니다. 2012년 Elpida가 무너진 경로가 정확히 이것입니다. ⑤ 부채비율·순부채/EBITDA: Alphabet 장기부채 465억 → 1,251억 달러, Amazon 656억 → 1,731억 달러로 1년 만에 2.7배가 됐습니다. 아직 EBITDA 대비 1배 안팎이지만 등급 전망 하향(Meta)이 시작됐습니다. ⑥ 수주잔고: Microsoft RPO 6,770억, Oracle 6,640억, AWS 5,780억 달러는 투자의 근거이지만, 그 상당 부분이 적자 AI 랩(OpenAI 연 매출 약 500억 vs 2030년까지 컴퓨트 약정 6,000억 달러)에 의존합니다. 잔고의 취소·연기가 늘면 경고입니다.", "⑦은 공급 측 지표입니다. 고객이 미리 사 두면(Apple 재고 +154%, Micron 재고일수 129일) 다음 분기 주문이 줄고, 4분기 계약가 인상 제안에 고객이 저항하기 시작했으며, 스팟 가격이 계약가 아래로 내려가면 계약가 하락이 뒤따릅니다. 2019년과 2023년의 재고 조정이 이렇게 시작됐습니다. 일곱 지표를 분기마다 체크해 ①이 유지되고 ③~⑤가 악화되면 ‘성장 투자 지속’, ①이 꺾이면서 ③~⑤가 악화되면 ‘과잉 투자’, ⑦이 먼저 움직이면 ‘재고 조정 임박’으로 읽습니다. 최종 기준은 ROIC > WACC입니다. 10년물 4.9%에서 빅테크의 WACC는 10% 안팎(교육용 가정)이고, AI 투자가 그 이상의 수익을 내는지는 2027~28년에 판명됩니다. 발표에서는 ③ FCF와 ④ 이자보상배율 두 행만 읽고 ‘공급자가 아니라 수요자를 보라’고 말합니다."], "script": "무엇을 봐야 할까요. 메모리 회사의 이익률이 아닙니다. 그 이익을 만들어 주는 고객의 현금입니다. 일곱 가지입니다. 클라우드 매출 성장률, 이익률, 잉여현금흐름, 이자보상배율, 부채비율, 수주잔고, 그리고 고객 재고. 지금은 매출 성장이 유지되고 있으니 FCF 적자와 부채 증가는 성장 투자입니다. 하지만 매출 성장이 꺾이는 순간 같은 숫자가 과잉 투자가 됩니다. 2012년 Elpida가 만기에 무너졌듯, 이번에 만기를 봐야 할 쪽은 네오클라우드와 Oracle입니다.", "transition": "그렇다면 빅테크는 이 치킨게임을 계속해야 할까요.", "question": "일곱 지표 중 하나만 고른다면?", "answer": "③ FCF와 ① 매출 성장의 조합입니다. 정확히는 ‘클라우드 매출 증가율 − 설비투자 증가율’. 이 값이 플러스면 투자가 회수되는 중이고, 마이너스가 2분기 이상 이어지면 과잉 투자의 시작입니다. 2026년 3분기 기준 Azure +48%, Google Cloud +103%에 설비투자 증가율은 60~80%대라 경계선에 있습니다.", "extraQA": [{"q": "이자보상배율은 어떻게 계산하고 몇 배가 안전한가?", "a": "영업이익(또는 EBIT) ÷ 이자비용입니다. 일반적으로 3배 이상이면 양호, 1.5배 이하이면 위험으로 봅니다. 빅테크는 영업이익 수백억 달러에 이자 수십억이라 수십 배이고 문제가 없습니다. Oracle은 부채 1,253억 달러에 금리가 오르면 이자가 늘고 FCF가 적자라 배율이 빠르게 떨어질 수 있으며, CoreWeave는 영업이익 자체가 마이너스라 계산이 안 됩니다. 이 두 곳이 사이클의 약한 고리입니다."}, {"q": "감가상각 연 2,000억 달러는 어떻게 나온 숫자인가?", "a": "교육용 추정입니다. 2026년 약 7,200억 + 2027년 약 1조 달러 투자 중 서버·장비(5~6년 상각)와 건물(20년+) 비중을 감안해 연 2,000억 달러 안팎으로 어림한 것입니다. 실제 수치는 각사 10-K의 감가상각 항목을 따라야 하며, 핵심은 ‘투자액의 15~20%가 매년 비용으로 돌아온다’는 구조입니다."}], "sourceIds": ["msft_fy27q1", "googl_q3_2026", "amzn_q3_2026", "meta_q3_2026", "orcl_fy27", "crwv_q2_2026", "kcfed_ai", "imf_gfsr_2026", "micron_fy26", "apple_inventory", "trendforce_dram", "elpida_failure"]}, "coreTransition": "이 지표로 세 갈래 전망을 보겠습니다."}, {"id": "p3-chicken", "part": "p3", "title": "빅테크는 치킨게임을 계속해야 하나", "subtitle": "2008년 DRAM 치킨게임의 규칙을 2026년 AI 투자 경쟁에 적용하면", "type": "cards", "core": false, "takeaway": "멈추면 점유율을 잃고 계속하면 자본을 잃는다. 승자는 가장 똑똑한 쪽이 아니라 가장 오래 버틸 수 있는 쪽이고, 탈락은 차입이 많은 쪽부터다", "sources": ["elpida_failure", "msft_fy27q1", "googl_q3_2026", "amzn_q3_2026", "orcl_fy27", "crwv_q2_2026", "ai_pacing_2026"], "cards": [{"label": "계속할 이유", "title": "멈추는 쪽이 진다", "stat": "RPO $677B", "text": "모델 역량·고객·전력·GPU를 먼저 확보한 쪽이 다음 10년의 플랫폼<br>계약한 매출(RPO)을 이행할 설비 의무", "detail": "죄수의 딜레마: 모두가 줄이면 모두 이익이지만, 혼자 줄이면 점유율을 잃는다. 2008년 삼성이 적자에도 증설한 논리", "tone": "good"}, {"label": "멈출 이유", "title": "ROIC가 WACC 아래로", "stat": "WACC ≈ 10%", "text": "10년물 4.9% → 자본비용 상승<br>$1조 투자의 연 감가상각 $2,000억<br>FCF 적자 → 차입 의존", "detail": "투자 수익이 자본비용에 못 미치면 투자할수록 가치가 줄어든다. 1999~2001년 통신 광케이블 과잉의 선례", "tone": "warn"}, {"label": "2008년의 규칙", "title": "탈락은 차입이 많은 쪽부터", "stat": "Elpida 2012", "text": "자본력: MSFT·Alphabet(현금) ><br>Amazon·Meta(차입 증가) ><br>Oracle(BBB−) · 네오클라우드(부채/자산 85%)", "detail": "치킨게임은 자본력이 강한 쪽에 유리. 약한 쪽이 탈락하면 남은 쪽의 투자는 회수된다. 메모리 3강이 그렇게 만들어졌다", "tone": "bad"}, {"label": "판단 기준", "title": "세 가지 부등식", "stat": "분기마다", "text": "클라우드 매출 증가율 > 설비투자 증가율<br>이자보상배율 > 5배<br>부채 증가 < 영업현금 증가", "detail": "셋 다 성립하면 계속, 둘이 깨지면 속도 조절, 셋 다 깨지면 중단. 2026년 3분기: 빅테크는 첫째 경계선·둘째 양호·셋째 깨짐", "accent": true}], "study": {"paragraphs": ["기업재무 관점에서 빅테크의 AI 투자 경쟁은 2007~2012년 DRAM 치킨게임과 같은 구조입니다. 각자의 합리적 선택(먼저 투자해 점유율을 확보)이 전체로는 과잉 투자를 만들고, 그래도 멈추는 쪽이 지므로 아무도 멈추지 못합니다. 계속할 이유는 분명합니다. AI 모델 역량, 고객, 전력, GPU를 먼저 확보한 쪽이 다음 10년의 플랫폼이 되고, 이미 계약한 매출(Microsoft RPO 6,770억 달러)을 이행하려면 설비가 필요합니다. 2008년 삼성이 적자에도 증설한 논리가 그대로 적용됩니다. 멈출 이유도 분명합니다. 10년물 4.9%에서 자본비용(WACC)은 10% 안팎(교육용 가정)인데, 1조 달러 넘는 투자의 감가상각이 연 2,000억 달러 수준으로 돌아오고 FCF가 적자라 차입에 의존합니다. 투자 수익(ROIC)이 자본비용에 못 미치면 투자할수록 가치가 줄어듭니다. 1999~2001년 통신사들이 광케이블을 과잉 투자하고 무너진 선례가 있습니다.", "2008년 치킨게임의 규칙은 ‘탈락은 기술이 약한 쪽이 아니라 차입이 많은 쪽부터’였습니다. Elpida는 기술이 있었지만 만기에 무너졌고, 삼성은 그룹 현금으로, 하이닉스는 SK 자본으로 버텼으며, 그 결과 메모리 3강이 만들어지고 남은 쪽의 투자는 회수됐습니다. 2026년의 자본력 순서는 Microsoft·Alphabet(현금 풍부, FCF 흑자 또는 소폭 적자) > Amazon·Meta(FCF 적자, 차입 급증) > Oracle(BBB−, FCF 적자) > 네오클라우드(부채/자산 85%, 영업 적자)입니다. 속도 조절이 오면 탈락은 뒤에서부터이고, Microsoft가 네오클라우드 지연을 이유로 투자를 줄인 것이 그 첫 신호입니다. 약한 쪽이 탈락하면 남은 쪽의 투자는 회수되므로, 빅테크 입장에서는 ‘계속하되 약한 고리가 떨어지기를 기다리는’ 전략이 합리적입니다.", "판단 기준을 세 부등식으로 제안합니다. 첫째 클라우드 매출 증가율 > 설비투자 증가율, 둘째 이자보상배율 > 5배, 셋째 부채 증가 < 영업현금 증가. 셋 다 성립하면 계속, 둘이 깨지면 속도 조절, 셋 다 깨지면 중단입니다. 2026년 3분기 기준 빅테크는 첫째가 경계선(Azure +48% vs 투자 증가율 60~80%대), 둘째는 양호, 셋째는 깨졌습니다(Alphabet·Amazon 부채 2.7배). 즉 ‘속도 조절’ 신호가 하나 켜진 상태이고, 시장이 11월 4일 Microsoft·Amazon 주가를 올린 것은 속도 조절을 주주가 원한다는 뜻입니다. 이 장표는 선택 심화이며, 발표에서는 넷째 카드의 세 부등식만 말해도 됩니다."], "script": "빅테크는 이 치킨게임을 계속해야 할까요. 계속할 이유는 멈추면 플랫폼을 잃고, 이미 계약한 매출을 이행할 설비가 필요하다는 것. 멈출 이유는 금리 4.9%에서 자본비용이 10%인데 투자 수익이 그에 못 미칠 수 있다는 것. 2008년의 규칙은 탈락이 기술이 아니라 빚이 많은 쪽부터라는 것이었습니다. 지금 그 순서는 네오클라우드, Oracle, 그다음이 Amazon과 Meta입니다. 판단 기준은 세 부등식입니다. 매출 증가율이 투자 증가율보다 크고, 이자보상배율이 5배를 넘고, 부채가 영업현금보다 느리게 늘면 계속해도 됩니다. 지금은 셋 중 하나가 깨졌습니다.", "transition": "이 게임에서 미국이 속도를 늦추면 생기는 다른 위험이 있습니다. 중국입니다.", "question": "주주는 빅테크의 투자 축소를 원하나?", "answer": "11월 4일의 주가가 답입니다. 투자 속도 조절 기대에 Microsoft +6.7%, Amazon +6.1%가 올랐습니다. 주주는 FCF를 원하고, 경영진은 플랫폼을 원합니다. 린니어 케이스의 질문(현금을 쌓을까, 돌려줄까, 투자할까)이 1,000배 규모로 반복되고 있고, 이번에는 ‘투자’ 쪽의 비용(차입·금리)이 커지면서 주주의 목소리가 세지고 있습니다.", "sourceIds": ["elpida_failure", "msft_fy27q1", "googl_q3_2026", "amzn_q3_2026", "orcl_fy27", "crwv_q2_2026", "ai_pacing_2026", "markets_1104"]}, "coreTransition": "이 게임에서 미국이 속도를 늦추면 생기는 다른 위험이 있습니다. 중국입니다."}, {"id": "p3-china", "part": "p3", "title": "미국의 속도 조절은 미국의 위험이다: 중국 변수", "subtitle": "수출통제는 강화됐지만 중국은 국가 주도로 짓고 있고, 모델 격차는 8개월, 사용 점유율은 역전됐다", "type": "cards", "core": false, "takeaway": "민주당이 데이터센터를 늦추면 그만큼 중국과의 AI 격차가 좁혀진다. 그래서 미국의 투자 사이클은 정치적으로도 완전히 꺾이기 어렵다", "sources": ["nvidia_china", "bigfund3", "epoch_huawei", "nist_caisi", "cxmt_ipo", "china_power_ai", "bis_2022"], "cards": [{"label": "미국의 수출통제", "title": "조이고, 열고, 다시 조이고", "stat": "중국 DC 매출 0", "text": "2025.4 H20 차단($4.5B 손실) → 12월 H200 허용(25% 상납)<br>2026.1 건별 심사 → 5.31 역외 구멍 차단", "detail": "NVIDIA Q1 FY27 중국+홍콩 매출 $4.55B(전년 $9.66B). Q3 가이던스 $108B는 중국 데이터센터 매출 0 가정. 밀수 기소 SMCI ~$510M"}, {"label": "중국의 대응", "title": "국가가 짓는다", "stat": "3,440억 위안", "text": "빅펀드 3기 · Huawei Ascend 950→970 로드맵(자체 HBM)<br>CXMT DRAM 점유율 9.5%(2Q26) · YMTC NAND 3위", "detail": "국가 자금 데이터센터는 국산 칩 의무. CXMT 상장 첫날 +466%, 2027 42만 wpm. SMIC N+3은 TSMC N3P 대비 밀도 절반", "accent": true}, {"label": "격차", "title": "칩은 멀고, 모델은 가깝다", "stat": "8개월", "text": "NIST CAISI: DeepSeek V4 Pro는 미국 최전선 대비 8개월<br>Epoch: Huawei 2026 150만 개 vs NVIDIA 590만, HBM 73배 격차", "detail": "중국 오픈모델의 전 세계 사용 비중 61% → 80%+(OpenRouter). 칩에서는 멀지만 모델과 확산에서는 가깝다"}, {"label": "전력", "title": "중국은 전력이 남는다", "stat": "+315 GW", "text": "2025 태양광 +315GW, 풍력 +119GW<br>데이터센터 32GW → 60GW(2030)<br>미국: 가스터빈 백로그 122GW", "detail": "미국의 병목은 칩이 아니라 전력·허가. 데이터센터 규제는 그 병목을 더 조인다. 그래서 속도 조절은 전략적 비용을 치른다"}], "study": {"paragraphs": ["Part 3의 전망에서 ‘미국의 투자 사이클은 완전히 꺾이기 어렵다’고 판단하는 첫째 근거가 중국입니다. 수출통제의 역사는 조이고 열고 다시 조이는 지그재그였습니다. 2025년 4월 H20 수출이 막혀 NVIDIA가 45억 달러를 손실 처리했고, 8월 15% 상납 조건으로 재개됐다가, 12월 H200이 25% 조건으로 허용됐고, 2026년 1월 건별 심사(50% 상한)로 바뀐 뒤 5월 31일 역외 우회 통로가 막혔습니다. 그 결과 NVIDIA의 중국·홍콩 매출은 분기 96.6억에서 45.5억 달러로 줄었고, 3분기 가이던스 1,080억 달러는 중국 데이터센터 매출을 0으로 가정합니다. 밀수 기소(SMCI 약 5.1억 달러)가 이어지는 것은 중국의 수요가 그만큼 강하다는 뜻입니다.", "중국은 국가가 짓습니다. 빅펀드 3기 3,440억 위안(2024년 5월), Huawei Ascend 950PR(2026년 1분기)·950DT(4분기, 자체 HBM)·960(2027)·970(2028) 로드맵, 베이징의 ‘국가 자금 데이터센터는 국산 칩’ 의무. 메모리에서는 CXMT가 2026년 2분기 DRAM 매출 점유율 9.5%로 4위에 올랐고 상하이 상장 첫날 466% 올랐으며 2027년 월 42만 장으로 증설 중이고, YMTC는 NAND 3위(16.5%)입니다. 그러나 격차는 분명합니다. Epoch AI 추정으로 Huawei의 2026년 AI 칩 생산은 약 150만 개로 NVIDIA 590만 개의 H100 환산 4% 미만이고 HBM 공급은 73배 차이이며, SMIC의 N+3 공정은 TSMC N3P의 밀도 절반입니다. 칩에서는 멀지만 모델에서는 가깝습니다. NIST CAISI는 5월 DeepSeek V4 Pro가 미국 최전선 모델 대비 약 8개월 격차라고 평가했고, 중국 오픈모델의 전 세계 사용 비중(OpenRouter)은 61%에서 80% 이상으로 올라 이미 역전됐습니다.", "전력에서는 중국이 앞섭니다. 2025년 태양광 315GW, 풍력 119GW를 추가했고 데이터센터 용량을 2030년까지 32GW에서 60GW로 늘립니다. 미국의 병목은 칩이 아니라 전력과 허가입니다. 가스터빈 백로그는 122GW(2031년까지 예약), 송전망 연결 대기열은 수백 GW, 원전 재가동(Crane 2027)은 느립니다. 데이터센터 규제는 그 병목을 더 조입니다. 그래서 민주당 의회가 데이터센터를 늦추면 그만큼 중국과의 격차가 좁혀지고, 이것은 미국 안보 정책과 충돌합니다. 2022년 CHIPS Act와 수출통제가 초당적이었듯, 데이터센터도 ‘전기요금’과 ‘안보’ 사이에서 타협이 이루어질 가능성이 큽니다. 투자 속도 조절은 있어도 사이클이 꺾이지 않는다는 판단의 근거입니다. 한국 메모리에는 양면입니다. 미국 수요는 유지되지만 CXMT·YMTC의 추격과 중국 시장 접근 제한이 동시에 옵니다."], "script": "미국이 속도를 늦추면 생기는 위험이 있습니다. 중국입니다. 수출통제로 NVIDIA의 중국 데이터센터 매출은 0이 됐지만, 중국은 빅펀드 3기와 Huawei의 자체 칩, CXMT의 DRAM으로 국가가 짓고 있습니다. 칩에서는 멀지만, 모델은 8개월 격차이고 중국 오픈모델의 세계 사용 비중은 80%를 넘었습니다. 전력은 중국이 남고 미국은 가스터빈 백로그가 122GW입니다. 그래서 민주당이 데이터센터를 늦추면 그만큼 격차가 좁혀지고, 이것이 미국 투자 사이클이 완전히 꺾이기 어려운 정치적 이유입니다.", "transition": "둘째 근거는 AI 수요의 폭입니다.", "question": "중국의 추격은 한국 메모리에 위협인가?", "answer": "범용 DRAM과 NAND에서는 이미 위협입니다. CXMT 점유율 9.5%, YMTC NAND 3위이고 가격 경쟁력이 있습니다. HBM에서는 아직 아닙니다. Huawei의 자체 HBM은 세대가 뒤지고, 73배의 공급 격차가 있습니다. 한국의 전략적 질문은 범용 제품의 가격 경쟁을 피해 HBM·고부가로 얼마나 빨리 이동하느냐이고, 그것이 1990년대 일본이 한국에 밀렸을 때 못 했던 일입니다.", "sourceIds": ["nvidia_china", "bigfund3", "epoch_huawei", "nist_caisi", "cxmt_ipo", "china_power_ai", "bis_2022", "iea_energy_ai"]}, "coreTransition": "둘째 근거는 AI 수요의 폭입니다."}, {"id": "p3-diffusion", "part": "p3", "title": "AI의 수요는 데이터센터 한 곳이 아니다: 산업별 확산", "subtitle": "2026년에 확인된 사실 · 코딩을 넘어 제약·자동차·휴머노이드·우주·양자·보안으로", "type": "rows", "core": false, "takeaway": "수요의 폭이 넓어지면 사이클은 예상보다 길어진다. 1990년대 PC가 그랬다. 다만 수요의 ‘폭’이 당장의 ‘양’은 아니다", "sources": ["ai_pharma_2026", "ai_auto_robot_2026", "ai_space_quantum_2026", "anthropic_espionage", "iea_energy_ai"], "headers": ["산업", "2026년에 확인된 사실", "반도체 수요에 주는 함의"], "rows": [["코딩 · 소프트웨어", "Google 신규 코드 30%+ AI 생성 · Anthropic 연 매출 run-rate $65B(7월), S-1 제출(10/26) · OpenAI $122B 조달, 기업가치 $852B", "현재 수요의 중심. AI 랩의 매출이 빅테크 수주잔고의 근거이자 위험"], ["제약 · 바이오", "Insilico 렌토서팁 3상 개시(9/9) · Lilly–Insilico $2.75B · Isomorphic Labs $2.1B 조달(기업가치 $50B 협의) · AZ–Insitro $1.86B", "학습보다 추론·시뮬레이션 수요. 데이터센터 가동률을 높이는 ‘두 번째 고객’"], ["자동차 · 자율주행", "Waymo 주 50만 회+ 유료 탑승, 목표 100만 · Tesla Cybercab 오스틴 무인 운행(9/3~) · Baidu Apollo Go 누적 2,300만 회", "차량당 추론 칩 + 학습용 데이터센터. 한국 차량용 메모리(LPDDR·eSSD) 수요"], ["휴머노이드 · 로봇", "Tesla Optimus 프리몬트 양산 개시 · Figure 기업가치 $39B · Unitree IPO 약 $9B(2025년 5,500대) · 1X NEO $20,000", "대수는 아직 적지만 대당 연산·메모리는 스마트폰의 수십 배. 2030년대 수요"], ["우주 · 통신", "Starship 14차 비행 첫 궤도 진입(9/28) · Starlink 1,360만 가입 · SpaceX IPO(6/11) · Google Suncatcher 궤도 데이터센터 시험위성(10/1)", "위성·지상국 칩 수요. 궤도 데이터센터는 전력 병목 우회 시도(초기)"], ["양자", "Google Quantum Echoes(2025.10) · Quantinuum IPO 약 $17.6B(6/4) · 상업적 양자 우위는 미입증", "단기 수요 영향 없음. 제어·극저온 전자 등 틈새. 과장 주의"], ["보안", "Anthropic: AI가 80~90%를 자율 수행한 첫 사이버 스파이 작전 차단(2025.11.13)", "방어 측 AI 수요 증가. 국가·기업 보안 예산이 데이터센터 수요로"]], "note": "전력: IEA 기준 데이터센터 전력 415TWh(2024) → 945TWh(2030). 한국 용인 클러스터 2041년까지 14GW+, 1GW LNG 3기(2032). 각 항목은 보도 기준이며 금액·일정은 발표 전 재확인.", "study": {"paragraphs": ["‘미국 투자 사이클이 완전히 꺾이기 어렵다’는 둘째 근거는 수요의 폭입니다. 2024~25년의 AI 수요는 사실상 한 가지, 대형 언어모델의 학습과 코딩·채팅 서비스였습니다. 2026년에는 그 수요가 산업별로 번지고 있다는 증거가 쌓였습니다. 제약에서는 Insilico의 AI 설계 신약 렌토서팁이 9월 9일 3상에 들어갔고 Lilly–Insilico 27.5억 달러, Isomorphic Labs 21억 달러 조달(기업가치 500억 달러 협의) 같은 거래가 이어집니다. 자동차에서는 Waymo가 주 50만 회 넘는 유료 탑승을 하고 Tesla Cybercab이 오스틴에서 무인 운행 중이며 Baidu Apollo Go는 누적 2,300만 회입니다. 휴머노이드는 Tesla Optimus가 프리몬트에서 양산을 시작했고 Figure(390억 달러)·Unitree(IPO 약 90억 달러)·1X(NEO 2만 달러)가 뒤따릅니다. 우주에서는 Starship이 9월 28일 첫 궤도 진입에 성공했고 Google이 궤도 데이터센터 시험위성을 띄웠으며, 보안에서는 Anthropic이 AI가 80~90%를 자율 수행한 첫 사이버 스파이 작전을 차단했다고 보고했습니다.", "반도체 수요에 주는 함의는 산업마다 다릅니다. 제약·보안은 학습보다 추론·시뮬레이션 수요라 데이터센터 가동률을 높이는 ‘두 번째 고객’이 되고, 자동차·로봇은 기기당 연산·메모리(LPDDR·eSSD)가 스마트폰의 수십 배라 2030년대 물량 수요가 되며, 우주는 전력 병목을 우회하려는 초기 시도이고, 양자는 상업적 우위가 미입증이라 단기 수요 영향이 없습니다. 중요한 것은 ‘폭’과 ‘양’을 구분하는 것입니다. 폭이 넓어지면 특정 고객(AI 랩)에 대한 의존이 줄고 사이클이 길어지지만, 당장의 양은 여전히 빅테크의 데이터센터가 압도적입니다. 1990년대 PC 수요가 사무용에서 가정·인터넷으로 번지면서 Intel의 사이클이 25년이 됐던 것처럼, AI 수요의 확산은 이번 사이클을 2017~19년(3년)보다 길게 만들 수 있다는 것이 우리 조의 해석입니다.", "전력이 공통 제약입니다. IEA는 데이터센터 전력을 2024년 415TWh에서 2030년 945TWh로 전망하고, 한국은 용인 클러스터에 2041년까지 14GW 이상(1GW LNG 3기 포함)을 공급하는 협약을 맺었습니다. 수요가 아무리 넓어져도 전력과 허가가 따라오지 않으면 실현되지 않으므로, 전력 지표는 반도체 지표입니다. 이 장표는 선택 심화이며 발표에서는 ‘제약·자동차·로봇·우주·보안으로 수요가 번지고 있고, 그래서 사이클이 예상보다 길어질 수 있다’는 두 문장으로 대신할 수 있습니다. 표의 금액과 일정은 보도 기준이므로 발표 전 재확인이 필요합니다."], "script": "둘째 근거는 수요의 폭입니다. 2025년의 AI 수요는 코딩과 채팅이었습니다. 2026년에는 AI가 설계한 신약이 3상에 들어갔고, Waymo가 주 50만 회 유료 운행을 하고, Tesla가 휴머노이드 양산을 시작했고, Starship이 궤도에 올랐고, AI가 수행한 스파이 작전을 AI가 막았습니다. 수요가 산업별로 번지면 특정 고객 의존이 줄고 사이클이 길어집니다. 1990년대 PC가 그랬습니다. 다만 폭이 넓어진 것이지 당장의 양은 아직 데이터센터입니다.", "transition": "이제 세 갈래 전망입니다.", "question": "AI 확산이 반도체 수요로 이어지는 데 얼마나 걸리나?", "answer": "산업마다 다릅니다. 추론 수요(제약·보안·코딩)는 이미 데이터센터 가동률로 나타나고 있고, 자동차는 2027~28년 자율주행 차량 증가와 함께, 로봇은 2030년대입니다. 즉 2027년 데이터센터 투자가 둔화되더라도 2028년 이후 새 수요가 이어받을 수 있다는 것이 ‘사이클이 길어진다’는 주장의 구조이고, 그 사이 1~2년의 공백이 2019년형 조정이 될 수 있다는 것이 반론입니다.", "sourceIds": ["ai_pharma_2026", "ai_auto_robot_2026", "ai_space_quantum_2026", "anthropic_espionage", "iea_energy_ai", "semicon_act_kr"]}, "coreTransition": "이제 세 갈래 전망입니다."}, {"id": "p3-hbm", "part": "p3", "title": "HBM: 왜 메모리가 AI의 병목이 됐나", "subtitle": "DRAM을 쌓아 GPU 옆에 붙인 구조 · 웨이퍼를 3배 쓰고 GPU와 함께 팔린다", "type": "hbm", "core": false, "takeaway": "HBM은 DRAM 웨이퍼를 3배 쓴다. 그래서 범용 DRAM 공급이 줄어 가격이 올랐고, 그래서 HBM 점유율이 곧 이익이다", "sources": ["hbm_definition", "hbm_history", "trendforce_hbm", "trendforce_server_2027", "micron_hbm", "C02"], "study": {"paragraphs": ["GPU가 아무리 빨라도 데이터가 제때 도착하지 않으면 연산 능력을 쓰지 못합니다. 용량(얼마나 저장하나)과 대역폭(초당 얼마나 옮기나)은 다른 문제이고, AI 학습·추론은 대역폭에 묶입니다. HBM은 DRAM 다이를 8~16층 쌓고 층을 관통하는 수직 연결(TSV)로 묶어 GPU 바로 옆에 인터포저 위에 배치한 메모리입니다. 2013년 SK하이닉스가 AMD와 함께 1세대를 만들었고, 2022년 6월 HBM3를 NVIDIA H100용으로 양산했으며, 2024년 3월 HBM3E, 2025년 9월 HBM4 개발 완료·양산 준비, 2026년 2분기부터 HBM4 대량 출하를 시작했습니다. 삼성은 2026년 2월 NVIDIA HBM4 인증을 통과해 출하를 시작했고 3분기에는 HBM4가 HBM 매출의 60%가 됐으며, Micron은 2024년 2월 HBM3E 양산을 시작했습니다. 2026년 6월 NVIDIA는 세 회사 모두 Vera Rubin용으로 인증됐다고 밝혔습니다.", "재무적으로 중요한 사실은 두 가지입니다. 첫째, HBM은 같은 비트를 만드는 데 범용 DRAM보다 약 3배의 웨이퍼를 씁니다(삼성). HBM이 DRAM 웨이퍼 생산능력의 약 20%에서 2027년 약 30%를 흡수하면서 범용 DRAM 공급이 줄었고, 그것이 2026년 범용 DRAM 가격 급등의 공급 측 원인입니다. 즉 AI 수요는 HBM을 통해 직접, 범용 DRAM 가격을 통해 간접으로 메모리 이익을 두 번 올렸습니다. 둘째, HBM은 GPU와 함께 설계·인증·판매되므로 점유율이 곧 이익입니다. 2025년 HBM 비트 점유율은 SK하이닉스 59%, 삼성 20%, Micron 약 21%(TrendForce)이고 2026년 전망은 50/28/22로 삼성이 추격 중입니다. Gartner 기준 2025년 HBM 시장은 300억 달러 이상으로 DRAM의 23%이며, HBM4 계약가(mid-$500s)는 HBM3E 12단(mid-$300s)보다 50% 이상 높습니다. 2027년 HBM 가격 전망은 +50%(애널리스트)에서 +79%(UBS)까지입니다.", "이 장표는 질의응답용입니다. ‘HBM이 뭐냐’는 질문이 나오면 도식을 띄우고 ‘DRAM을 쌓아 GPU 옆에 붙인 것, 웨이퍼를 3배 쓰고 GPU와 함께 팔린다’는 두 문장으로 답합니다. 비유 장표(Part 2)의 표현으로는 ‘GPU 공장 바로 옆에 창고를 고층으로 쌓고 도로를 넓힌 것’입니다."], "script": "HBM은 DRAM을 쌓아 GPU 바로 옆에 붙인 메모리입니다. 용량이 아니라 대역폭, 즉 데이터가 얼마나 빨리 도착하느냐의 문제를 풉니다. 재무적으로 중요한 건 두 가지입니다. HBM은 웨이퍼를 3배 써서 범용 DRAM 공급을 줄였고, 그래서 범용 가격까지 올랐습니다. 그리고 GPU와 함께 팔리니 점유율이 곧 이익입니다. SK하이닉스 59%, 삼성 20%, Micron 21%였고 삼성이 추격 중입니다.", "transition": "이제 세 갈래 전망입니다.", "question": "삼성이 HBM에서 뒤처진 이유와 추격 상황은?", "answer": "SK하이닉스가 2013년부터 10년간 HBM에 투자해 NVIDIA와의 공동 설계·인증 경험을 쌓은 반면 삼성은 2019년경 HBM 팀을 축소했다는 것이 업계의 설명입니다. 2025년 하반기 HBM3E 12단 인증, 2026년 2월 HBM4 인증을 통과하면서 추격이 시작됐고, 3분기 HBM4가 HBM 매출의 60%, 2027년 HBM은 목표가에 완판됐다고 밝혔습니다. 점유율 전망은 2025년 20%에서 2026년 28%입니다. 다만 수율(8월 약 80%)과 HBM4E 양산(1H27) 일정은 보도 기준입니다.", "sourceIds": ["hbm_definition", "hbm_history", "trendforce_hbm", "trendforce_server_2027", "micron_hbm", "C01", "C02"]}, "coreTransition": "이제 세 갈래 전망입니다."}, {"id": "p3-valuation", "part": "p3", "title": "금리와 기대가 함께 움직이면: 가치의 민감도", "subtitle": "5년 뒤 현금 100을 할인율 8%로 할인한 교육용 모형 · 슬라이더로 직접 바꿔 보세요", "type": "valuation", "core": false, "takeaway": "현금 기대 −20%와 할인율 8→12%가 겹치면 가치는 −33%. 2026년 6월 이후 메모리 주가 −46~58%는 이 두 힘이 겹친 결과다", "sources": ["VALUATION", "fed_2026", "kospi_1105", "ms_memory_2026"], "study": {"paragraphs": ["교육용 모형입니다. 5년 뒤 한 번 받는 현금 100을 할인율 8%로 할인하면 현재가치는 68.1입니다. 할인율만 12%로 올리면 56.7(−17%), 현금 기대만 80으로 낮추면 54.5(−20%), 둘이 겹치면 45.4(−33%)입니다. 금리 상승은 할인율을 올리고, 투자 속도 조절·규제는 미래 현금 기대를 낮춥니다. 2026년 가을에는 이 둘이 동시에 왔습니다. 연준이 9월 금리를 올려 10년물이 4.9%가 됐고, 11월 선거로 데이터센터 투자의 기대가 깎였습니다. 삼성전자 6월 고점 대비 −46%, SK하이닉스 −58%는 분기 이익이 늘어나는 동안 일어난 일이고, 이 모형이 그 이유를 설명합니다.", "실무에서는 두 가지를 더합니다. 첫째, 경기순환 기업의 ‘5년 뒤 현금’은 사이클 평균(정상화 이익)으로 잡아야 하며 2026년 3분기 같은 정점 이익을 영구화하면 안 됩니다. 둘째, 할인율은 무위험이자율(국채)에 위험 프리미엄을 더한 것이므로, 금리가 같아도 수요자의 신용 위험(Oracle BBB−, 네오클라우드)이 커지면 할인율이 오릅니다. 슬라이더를 움직이며 ‘현금 −20%’와 ‘할인율 +4%p’ 중 어느 쪽이 더 큰 영향을 주는지 확인해 보면, 이 모형에서는 현금 기대 쪽이 조금 더 큽니다. 시장이 11월 4~5일에 반응한 것도 금리보다 ‘투자 속도’였습니다.", "이 장표는 선택 심화이며 질의응답에서 ‘실적이 좋은데 왜 주가가 떨어지나’라는 질문이 나오면 띄우면 됩니다. 발표 흐름에서는 생략해도 됩니다."], "script": "교육용 모형입니다. 5년 뒤 현금 100을 8%로 할인하면 68입니다. 할인율을 12%로 올리면 57, 현금 기대를 20% 낮추면 55, 둘이 겹치면 45, 3분의 1이 사라집니다. 올해 가을 금리가 오르고 투자 기대가 깎이면서 이 둘이 동시에 왔고, 그래서 이익이 늘어나는 동안 주가가 반토막 났습니다.", "transition": "이제 세 갈래 전망입니다.", "question": "메모리 주가는 지금 싼가?", "answer": "선행 PER 2.5배, PBR 2~4배는 ‘정점 이익 기준으로 싸고, 자산 기준으로 비싸다’는 뜻입니다. 2027년 이익이 2026년과 비슷하거나 더 크면 싸고, 2019년처럼 반 토막 나면 비쌉니다. 그 답은 이 모형의 ‘5년 뒤 현금’ 가정, 즉 앞 장표의 일곱 지표에 달려 있습니다. 가격이 싼지가 아니라 가정이 맞는지를 묻는 것이 기업재무의 질문입니다.", "sourceIds": ["VALUATION", "fed_2026", "kospi_1105", "ms_memory_2026"]}, "coreTransition": "이제 세 갈래 전망입니다."}, {"id": "p3-outlook", "part": "p3", "title": "전망: 세 갈래 길과 우리 조의 판단", "subtitle": "내년까지의 실적은 계약으로 대부분 정해졌다. 그 이후가 시험대다", "type": "scenarios", "core": true, "takeaway": "기본은 ‘속도 조절’이지만 완전히 꺾이기는 어렵다. 미국의 감속은 중국과의 격차라는 비용을 치르고, AI 수요는 산업별로 넓어지고 있다. 다만 판단은 선언이 아니라 지표로", "sources": ["C02", "micron_fy26", "trendforce_server_2027", "bull_memory_2026", "ms_memory_2026", "dc_policy_2026", "epoch_huawei", "ai_pharma_2026", "imf_gfsr_2026"], "paths": [{"label": "길 ① 연장", "title": "사이클이 예상보다 길어진다", "tone": "good", "condition": "AI 수요가 코딩을 넘어 제약·자동차·로봇으로 확산 · 가스터빈·원전 재가동으로 전력 병목 완화 · 금리 4%대 안정 · 데이터센터 규제가 입지 이동에 그침", "effect": "2027 빅테크 투자 $1조+ 실현 · 서버 DRAM 부족 2027년 내내 지속 · HBM4E 가격 프리미엄 · 삼성·SK하이닉스 2027 기록 갱신, 2028 신규 팹 가동 시점에 수요가 받쳐줌", "signal": "클라우드 매출 증가율 ≥ 설비투자 증가율 · RPO 증가 지속 · 2027 HBM 계약가 +50% 이상 확정 · 전력 지표(가스터빈 수주·송전 허가) 개선"}, {"label": "길 ② 속도 조절 (기본)", "title": "투자는 계속되지만 증가율이 꺾인다", "tone": "warn", "condition": "민주당 의회의 전기요금·허가 규제로 일부 주 2~3년 지연 · Fed 12월 추가 인상 · 네오클라우드 차환 어려움으로 약한 고리 탈락 · 빅테크 주주의 FCF 요구", "effect": "2027 투자 증가율 둔화(절대액은 증가) · 범용 DRAM 계약가 2027 하반기 횡보~하락, HBM은 계약으로 유지 · 메모리 이익 2027 고점 후 2028 조정 · 주가는 이미 상당 부분 반영(−46~58%)", "signal": "2028 증설 계획 취소·연기 · DRAM 계약가 제안에 고객 저항 지속 · Oracle·CoreWeave CDS 상승 · 빅테크 가이던스 ‘증가율 둔화’ 문구"}, {"label": "길 ③ 2019년의 반복", "title": "투자가 회수되지 않고 꺾인다", "tone": "bad", "condition": "AI 랩 매출이 약정(OpenAI 2030년까지 $600B)에 크게 못 미침 · 순환거래의 한 고리 붕괴 · 금리 5%대 · 데이터센터 모라토리엄 연방 입법", "effect": "2027 투자 가이던스 하향 · 재고 조정과 치킨게임 · 메모리 2019·2023형 급락(영업이익률 80% → 10%대) · 자본력 약한 수요자·공급자 탈락 · 장기계약 재협상", "signal": "클라우드 매출 성장률 급락 · 빅테크 FCF 2년 연속 적자 + 등급 하향 · 수주잔고 취소 · 스팟 DRAM 가격 계약가 하회 · 이자보상배율 3배 이하 기업 증가"}], "note": "우리 조의 판단: 기본 경로는 ②이지만 ①의 힘이 ③보다 크다. 근거는 (1) 미국의 감속은 중국과의 AI 격차 축소라는 안보 비용을 치르므로 정치적으로 완전히 꺾기 어렵고, (2) 수요가 산업별로 넓어지고 있으며, (3) 2027년까지의 물량은 장기계약으로 대부분 정해졌기 때문이다. 결과는 내년까지 좋고 그 이후는 일곱 지표로 분기마다 판단한다. 이것은 조사한 사실 위에 세운 해석이다.", "study": {"paragraphs": ["전망을 세 갈래로 나눕니다. 길 ①(연장)은 AI 수요가 코딩을 넘어 제약·자동차·로봇으로 확산되고, 가스터빈과 원전 재가동으로 전력 병목이 완화되며, 금리가 4%대에서 안정되고, 데이터센터 규제가 입지 이동에 그치는 경우입니다. 그러면 2027년 빅테크 투자 1조 달러가 실현되고 서버 DRAM 부족이 2027년 내내 이어지며 삼성·SK하이닉스는 2027년에 기록을 다시 쓰고, 2028년 신규 팹이 가동될 때 수요가 받쳐 줍니다. 길 ②(속도 조절)는 민주당 의회의 전기요금·허가 규제로 일부 주가 2~3년 지연되고, 연준이 12월 추가 인상하며, 네오클라우드의 차환이 어려워져 약한 고리가 탈락하고, 빅테크 주주가 FCF를 요구하는 경우입니다. 투자는 계속되지만 증가율이 꺾이고, 범용 DRAM 계약가는 2027년 하반기 횡보~하락하되 HBM은 계약으로 유지되며, 메모리 이익은 2027년 고점 후 2028년 조정을 받습니다. 주가는 이미 상당 부분 반영됐습니다. 길 ③(2019년의 반복)은 AI 랩 매출이 약정에 크게 못 미치고 순환거래의 한 고리가 무너지며 금리가 5%대로 가고 연방 모라토리엄이 입법되는 경우로, 2027년 투자 가이던스 하향, 재고 조정, 메모리 영업이익률 80%에서 10%대로의 급락, 장기계약 재협상이 옵니다.", "우리 조의 판단은 ‘기본 경로는 ②, 그러나 ①의 힘이 ③보다 크다’입니다. 근거는 세 가지입니다. 첫째, 미국의 감속은 중국과의 AI 격차 축소라는 안보 비용을 치릅니다. 모델 격차 8개월, 중국 오픈모델 사용 점유율 80%, 중국의 전력 잉여를 아는 의회가 데이터센터를 전면적으로 막기는 어렵고, 2022년 CHIPS Act처럼 ‘전기요금’과 ‘안보’ 사이의 타협으로 갈 가능성이 큽니다. 둘째, AI 수요가 제약·자동차·로봇·우주·보안으로 넓어지고 있어 특정 고객 의존이 줄고 사이클이 길어집니다. 셋째, 2027년까지의 물량은 장기계약으로 대부분 정해졌습니다(SK하이닉스 2027~28년 50%+, Micron FY2027 75%+, 삼성 2027 HBM 완판). 따라서 ‘결과는 내년까지 좋고, 그 이후는 불확실하다’가 정직한 요약이고, 그 불확실성을 선언이 아니라 일곱 지표로 분기마다 판단하자는 것이 결론입니다.", "발표에서 사실과 해석을 구분해 말해야 합니다. 세 갈래의 조건·효과·신호는 조사한 사실(실적, 계약, 정책, 전망치)을 조합한 것이고, ‘②가 기본이지만 ①의 힘이 크다’는 우리의 해석입니다. 청중이 ‘왜 ③이 아니냐’고 물으면 세 근거를 말하고, ‘왜 ①이 아니냐’고 물으면 변화율의 정점, 2027년 하반기 신규 공급, 수요자의 부채를 말합니다. 어느 쪽이든 ‘지표로 확인하겠다’로 끝내면 됩니다. 신호 칸이 그 지표입니다."], "script": "전망은 세 갈래입니다. 첫째, 사이클이 길어지는 길. AI 수요가 산업별로 번지고 전력 병목이 풀리면 2027년 1조 달러 투자가 실현됩니다. 둘째, 속도 조절. 규제와 금리로 투자 증가율이 꺾이고 범용 DRAM 가격이 내년 하반기 횡보하지만 HBM은 계약으로 유지됩니다. 셋째, 2019년의 반복. AI 매출이 약정에 못 미쳐 투자가 꺾이고 메모리 이익이 급락합니다. 우리 조의 판단은 둘째가 기본이지만 첫째의 힘이 셋째보다 크다는 것입니다. 미국이 속도를 늦추면 중국과의 격차가 좁혀지므로 완전히 꺾기 어렵고, 수요는 넓어지고 있고, 내년 물량은 계약으로 정해졌습니다. 내년까지는 좋고, 그 이후는 지표로 판단합니다.", "transition": "마지막으로 린니어의 질문으로 돌아갑니다.", "question": "세 갈래 중 확률을 매긴다면?", "answer": "정량적 확률은 제시하지 않는 것이 정직합니다. 다만 순서는 ② > ① > ③이고, ①과 ②의 차이는 ‘증가율’의 문제이지 방향의 문제가 아니므로 둘을 합치면 ‘투자는 계속된다’가 다수 시나리오입니다. ③은 순환거래의 한 고리(OpenAI 자금 조달, 네오클라우드 차환)가 무너질 때 현실화되며, 그 신호는 수주잔고 취소와 CDS입니다. 발표 뒤 분기마다 신호를 다시 확인하겠다고 답하면 됩니다.", "extraQA": [{"q": "한국 메모리 기업은 지금 무엇을 해야 하나?", "a": "Part 2 규칙 ③입니다. 불황을 버틸 자본을 지키면서 다음 호황의 점유율(HBM4E·용인)에 투자해야 합니다. SK하이닉스의 순현금 98.7조원과 5년 장기계약은 그 준비이고, 삼성의 84.4조원 투자와 90~110조원 환원도 같은 선택입니다. 위험은 2008년처럼 ‘모두가 증설’하는 것이며, CXMT의 추격이 그 압력을 키웁니다. 환원과 투자의 균형, 즉 린니어의 질문이 2026년에 다시 던져진 것입니다."}], "sourceIds": ["C02", "C01", "micron_fy26", "trendforce_server_2027", "bull_memory_2026", "ms_memory_2026", "dc_policy_2026", "epoch_huawei", "nist_caisi", "ai_pharma_2026", "imf_gfsr_2026"]}, "coreTransition": "마지막으로 린니어의 질문으로 돌아갑니다."}, {"id": "p3-close", "part": "p3", "title": "결론: 린니어의 질문은 지금도 유효하다", "type": "closing", "core": true, "takeaway": "기술이 기회를 만들고, 자본배분이 결과를 결정한다. 2003년 린니어의 질문이 2026년에는 1,000배 규모로 빅테크와 한국 메모리에 던져져 있다", "sources": ["CASE", "C02", "amzn_q3_2026", "ranking_history"], "statement": "2003년 린니어는 <b>현금을 어디에 쓸까<\/b>를 물었고, 시대가 바뀌자 회사가 사라졌다.<br>45년 동안 1위는 일곱 번 바뀌었고, 승자를 가른 것은 <b>불황을 버틸 자본<\/b>이었다.<br>2026년, 같은 질문이 1,000배 규모로 다시 던져졌다.<br><b>투자할 것인가, 돌려줄 것인가, 버틸 것인가.<\/b>", "formula": "기술이 기회를 만들고 · 자본배분이 결과를 결정한다 · 산업의 흐름이 그 둘을 연결한다", "study": {"paragraphs": ["발표를 린니어로 닫습니다. 2003년 린니어는 쌓인 현금 15억 달러를 어디에 쓸지 물었고, 배당 인상과 2007년 차입 자사주 매입으로 답했으며, 끝까지 잘 벌었지만 성장의 중심이 이동하고 돈이 싸지고 산업이 통합되자 2016년 ADI에 팔렸습니다. 45년 동안 반도체 1위는 NEC에서 Intel, 삼성, Intel, 삼성, Intel, NVIDIA로 일곱 번 바뀌었고, 매번 수요의 중심 이동이 1위를 바꿨으며 승자를 가른 것은 불황을 버틸 자본이었습니다. 2026년에는 같은 질문이 1,000배 규모로 던져져 있습니다. SK하이닉스는 순현금 98.7조원을 두고 100조원 환원과 용인 투자를 저울질하고, 삼성은 84.4조원 투자와 90~110조원 환원을 동시에 집행하며, Amazon은 1년에 424억 달러 현금 적자를 내며 2,200억 달러를 투자하고, 주주는 11월 4일 ‘속도를 줄이라’고 답했습니다.", "마지막 문장은 세 개입니다. 기술이 기회를 만들고, 자본배분이 결과를 결정하며, 산업의 흐름이 그 둘을 연결한다. 기업재무 수업에서 배우는 배당·자사주·차입·M&A·투자 결정은 모두 이 세 번째 고리, 즉 흐름을 읽은 뒤에 내려지는 것입니다. 린니어는 흐름을 잘못 읽어서가 아니라 흐름이 바뀌어서 사라졌고, 그것은 실패가 아닙니다. 지금 메모리와 빅테크에 던져진 질문도 마찬가지로 정답이 없고, 다만 흐름을 읽는 네 규칙과 일곱 지표가 있을 뿐입니다.", "발표가 끝나면 질의응답입니다. 예상 질문과 답은 각 장표의 학습 노트에 있고, 부록의 FAQ와 숫자 검증표를 미리 읽어 두세요. 숫자를 물으면 ‘조사 기준 2026년 11월 5일, 확인·2차·미확인 구분’을 먼저 말하고 답하면 됩니다."], "script": "정리하겠습니다. 2003년 린니어는 현금을 어디에 쓸지 물었고, 시대가 바뀌자 회사가 사라졌습니다. 실패가 아닙니다. 45년 동안 1위는 일곱 번 바뀌었고, 승자를 가른 것은 불황을 버틸 자본이었습니다. 2026년, 같은 질문이 1,000배 규모로 던져져 있습니다. SK하이닉스의 99조원, 삼성의 84조원, Amazon의 2,200억 달러. 투자할 것인가, 돌려줄 것인가, 버틸 것인가. 기술이 기회를 만들고, 자본배분이 결과를 결정하고, 산업의 흐름이 그 둘을 연결합니다. 감사합니다.", "transition": "질문 받겠습니다.", "question": "그래서 2003년 린니어는 배당을 올렸어야 했나?", "answer": "네, 그리고 실제로 올렸습니다. 당시 조건(투자처 부족, 안정적 현금흐름, 낮은 재투자 필요)에서 환원은 합리적이었습니다. 우리 발표의 메시지는 그 결정의 옳고 그름이 아니라, 옳은 결정을 해도 산업의 흐름이 바뀌면 독립 기업으로 남지 못할 수 있고, 따라서 재무 결정은 흐름 위에서 읽어야 한다는 것입니다. 2026년의 SK하이닉스와 빅테크에도 같은 틀이 적용됩니다.", "sourceIds": ["CASE", "C01", "C02", "amzn_q3_2026", "ranking_history", "linear_defm14a"]}}]};const DATA={"asOf": "2026-11-05", "sources": {"ranking_history": {"title": "Kamakura (2022), From globalising to regionalising to reshoring value chains? The case of Japan’s semiconductor industry, Table 1", "publisher": "Cambridge Journal of Regions, Economy and Society / Oxford Academic", "published": "2022-05-13", "url": "https://academic.oup.com/cjres/article/15/2/261/6585222", "table_url": "https://academic.oup.com/view-large/362108178", "source_attribution": "Gartner, Inc.", "note": "표가 파운드리 제외를 명시. 1990/2000/2010/2020 대표 연도. 원 Gartner 연도별 발행 버전은 표에 미기재.", "short": "Gartner/OUP"}, "ranking_2017": {"title": "Gartner Says Worldwide Semiconductor Revenue Grew 21.6 Percent in 2017 as Samsung Takes Over No. 1 Position", "publisher": "Gartner press release republished by Design & Reuse", "published": "2018-04-23", "url": "https://www.design-reuse.com/news/4806-gartner-says-worldwide-semiconductor-revenue-grew-21-6-percent-in-2017-as-samsung-takes-over-no-1-position/", "status": "final", "short": "Gartner 2017"}, "ranking_2020": {"title": "Gartner Says Worldwide Semiconductor Revenue Grew 10.4% in 2020", "publisher": "Gartner press release republished by Design & Reuse", "published": "2021-04-12", "url": "https://www.design-reuse-embedded.com/news/202104063", "status": "final", "short": "Gartner 2020"}, "ranking_2024": {"title": "Gartner Says Worldwide Semiconductor Revenue Grew 21% in 2024", "publisher": "Gartner", "published": "2025-04-10", "url": "https://www.gartner.com/en/newsroom/press-releases/2025-04-10-gartner-says-worldwide-semiconductor-revenue-grew-21-percent-in-2024", "status": "final", "short": "Gartner 2024"}, "ranking_202 function chart(s){const body=s.kind==='svg'?svgBarChart(s.items,s.opts||{}):barChart(s.items.map(i=>i.value),s.items.map(i=>i.label),s.max||Math.max(...s.items.map(i=>i.value))*1.15,s.height||245,s.unit||'');return `<div class="split"><div>${body}<p class="chart-note">${s.note||''}</p></div><div class="chart-side">${s.side.stat?`<strong>${s.side.stat}</strong>`:''}<h3>${s.side.title}</h3><p>${s.side.text}</p>${s.side.small?`<p class="small">${s.side.small}</p>`:''}</div></div>`}

function linearChart(s){const d=DATA.linear.series;const W=900,H=400,padL=60,padR=70,padT=40,padB=50;const maxRev=Math.max(...d.map(x=>x.revenue))*1.15,maxDps=Math.max(...d.map(x=>x.dps))*1.15;const bw=(W-padL-padR)/d.length;const y1=v=>H-padB-(v/maxRev)*(H-padT-padB),y2=v=>H-padB-(v/maxDps)*(H-padT-padB);const line=d.map((x,i)=>`${i?'L':'M'}${padL+i*bw+bw/2} ${y2(x.dps)}`).join(' ');return `<div class="split"><div><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Linear Technology 회계연도별 매출과 주당 배당금"><line x1="${padL}" x2="${W-padR}" y1="${H-padB}" y2="${H-padB}" stroke="#4b6a85"/>${d.map((x,i)=>`<rect x="${padL+i*bw+bw*0.18}" y="${y1(x.revenue)}" width="${bw*0.64}" height="${H-padB-y1(x.revenue)}" rx="3" fill="${x.flag?'#ffb15e':'#2a7fc9'}" opacity=".9"/><text x="${padL+i*bw+bw/2}" y="${H-padB+20}" text-anchor="middle" font-size="13" fill="#9fb6c9">${String(x.fy).slice(2)}</text>`).join('')}<path d="${line}" fill="none" stroke="#39e2b0" stroke-width="3"/>${d.map((x,i)=>`<circle cx="${padL+i*bw+bw/2}" cy="${y2(x.dps)}" r="4" fill="#39e2b0"/>`).join('')}${d.filter(x=>x.note).map((x,_,arr)=>{const i=d.indexOf(x);return `<text x="${padL+i*bw+bw/2}" y="${y1(x.revenue)-10}" text-anchor="middle" font-size="12" fill="#ffd79a">${x.note}</text>`}).join('')}<text x="${padL}" y="${padT-14}" font-size="13" fill="#7fb3d5">■ 매출 ($M, 좌)</text><text x="${padL+150}" y="${padT-14}" font-size="13" fill="#39e2b0">― 연간 주당배당 ($, 우)</text><text x="${W-padR+8}" y="${y2(d.at(-1).dps)+4}" font-size="13" fill="#39e2b0">$${fmt(d.at(-1).dps,2)}</text><text x="${W-padR+8}" y="${y2(d[0].dps)+4}" font-size="13" fill="#39e2b0">$${fmt(d[0].dps,2)}</text></svg><p class="chart-note">${s.note||''}</p></div><div class="chart-side">${s.side.stat?`<strong>${s.side.stat}</strong>`:''}<h3>${s.side.title}</h3><p>${s.side.text}</p>${s.side.small?`<p class="small">${s.side.small}</p>`:''}</div></div>`}

function eraMap(s){const w=DATA.wsts.filter(x=>x.full_year&&x.year>=1986);const eras=DATA.eras;const W=1310,H=430,padL=46,padB=60,padT=86;const max=Math.max(...w.map(x=>x.usd_billion))*1.08;const bw=(W-padL-10)/w.length;const y=v=>H-padB-(v/max)*(H-padT-padB);const xOf=yr=>padL+(yr-1986)*bw;return `<div class="eramap"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="1986년 이후 세계 반도체 매출과 9개 시기 구분">${eras.map((e,i)=>{const x1=xOf(Math.max(e.start,1986)),x2=xOf(Math.min(e.end,2025)+1);return `<g class="eraband" data-goto="${e.slide}" tabindex="0" role="button" aria-label="${escapeHTML(e.period+' '+e.name)}"><rect x="${x1}" y="${padT-56}" width="${x2-x1}" height="${H-padB-padT+56}" fill="${i%2?'#0f2a3f':'#0b2033'}" stroke="#1e4260" stroke-width="1"/><text x="${(x1+x2)/2}" y="${padT-36}" text-anchor="middle" font-size="13" fill="${partColor.p2}" font-weight="700">${e.num}</text><text x="${(x1+x2)/2}" y="${padT-18}" text-anchor="middle" font-size="12.5" fill="#dfeefb">${e.name}</text><text x="${(x1+x2)/2}" y="${H-padB+48}" text-anchor="middle" font-size="12" fill="#ffb15e">${e.leader}</text></g>`}).join('')}${w.map((x,i)=>`<rect x="${xOf(x.year)+bw*0.15}" y="${y(x.usd_billion)}" width="${bw*0.7}" height="${H-padB-y(x.usd_billion)}" rx="2" fill="${x.usd_billion<(w[i-1]?.usd_billion??0)?'#ff8298':'#37ccff'}" opacity=".95"/>`).join('')}${w.filter(x=>x.year%5===0||x.year===2025).map(x=>`<text x="${xOf(x.year)+bw/2}" y="${H-padB+18}" text-anchor="middle" font-size="12" fill="#9fb6c9">${x.year}</text>`).join('')}${[1,2,3,4,5,6,7,8].map(k=>{const v=k*100;return v<max?`<text x="${padL-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#6f8aa0">${v}</text>`:''}).join('')}<text x="${padL}" y="${H-6}" font-size="12" fill="#7f97ab">십억 US달러 · WSTS 연간 실제치 · 빨간 막대 = 전년 대비 감소 · 띠를 누르면 해당 시기로 이동</text></svg></div>`}

function sparkline(hl){const w=DATA.wsts.filter(x=>x.full_year&&x.year>=1986);const W=360,H=90,p=6;const max=Math.max(...w.map(x=>x.usd_billion));const bw=(W-p*2)/w.length;return `<svg viewBox="0 0 ${W} ${H}" width="100%" class="spark" aria-hidden="true">${w.map((x,i)=>{const h=(x.usd_billion/max)*(H-22);const inside=x.year>=hl[0]&&x.year<=hl[1];return `<rect x="${p+i*bw}" y="${H-16-h}" width="${bw*0.8}" height="${Math.max(h,1)}" fill="${inside?'#37ccff':'#1f3a50'}"/>`}).join('')}<text x="${p}" y="${H-3}" font-size="10" fill="#6f8aa0">1986</text><text x="${W-p}" y="${H-3}" font-size="10" fill="#6f8aa0" text-anchor="end">2025</text></svg>`}
function rankMini(year,n=5){const sn=DATA.ranking.snapshots.find(x=>x.year===year);if(!sn)return '';const max=sn.rows[0].revenue;return `<div class="rankmini"><div class="rankmini-head">${year} 반도체 매출 Top${n}<small>${sn.year===2025?'잠정':'Gartner'} · $bn</small></div>${sn.rows.slice(0,n).map((r,i)=>`<div class="rankmini-row"><span>${i+1}. ${shortNames[r.name]||r.name}</span><i style="width:${r.revenue/max*100}%;background:${companyColors[r.name]||'#628ca6'}"></i><b>${fmt(r.revenue,1)}</b></div>`).join('')}</div>`}
function era(s){const q=s.quad;const box=(k,t,items)=>`<div class="quad quad-${k}"><h3>${t}</h3><ul>${items.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;return `<div class="era-layout"><div class="quads">${box('macro','거시 배경 · 경제·금리·정치',q.macro)}${box('tech','산업·기술의 변화',q.tech)}${box('lead','주도한 기업',q.leaders)}${box('fin','재무적 특징',q.finance)}</div><aside class="era-side"><div class="era-period">${s.period}</div>${s.keyStat?`<div class="era-stat"><strong>${s.keyStat.value}</strong><span>${s.keyStat.label}</span></div>`:''}${s.rankYear?rankMini(s.rankYear,s.rankN||5):''}${sparkline(s.highlight)}<p class="small muted">${s.sideNote||''}</p></aside></div>`}

function ranking(){return `<div class="rank-layout"><div><div class="rank-controls"><button id="raceplay" aria-label="순위 스냅샷 재생">▶ 재생</button>${DATA.ranking.years.map((y,i)=>`<button data-rank="${i}" class="${i===rankIndex?'active':''}">${y}</button>`).join('')}</div><div class="rank-chart" aria-label="반도체 공급업체 Top10 매출 막대 차트"></div><p class="chart-note"><span id="rankaxis">십억 US달러 · 해당 연도별 축 최대값 변경 · 0부터 시작</span><br>대표 연도 스냅샷 · 중간 연도 미표시 · 파운드리·장비 제외</p></div><div class="rank-info"><div class="rank-year"></div><h3 id="ranktitle"></h3><p id="rankdesc"></p><p class="small muted" id="rankstatus"></p></div></div>`}
function drawRanks(){let sn=DATA.ranking.snapshots[rankIndex],max=Math.ceil(sn.rows[0].revenue/10)*10;if(max<10)max=5;const chart=$('.rank-chart');if(!chart)return;chart.querySelectorAll('.rank-row').forEach(e=>{if(!sn.rows.some(r=>r.name===e.dataset.name)){e.style.opacity=0;clearTimeout(e._remove);e._remove=setTimeout(()=>e.remove(),650)}});sn.rows.forEach((r,i)=>{let e=[...chart.children].find(x=>x.dataset.name===r.name);if(!e){e=document.createElement('div');e.className='rank-row';e.dataset.name=r.name;e.innerHTML='<span class="name"></span><span class="bar"></span><span class="value"></span>';chart.append(e)}clearTimeout(e._remove);e.style.top=(i*29)+'px';e.style.opacity=1;e.querySelector('.name').textContent=`${i+1}. ${shortNames[r.name]||r.name}`;e.querySelector('.bar').style.width=(r.revenue/max*400)+'px';e.querySelector('.bar').style.background=companyColors[r.name]||'#628ca6';e.querySelector('.value').textContent=r.revenue.toFixed(1);e.setAttribute('aria-label',`${i+1}위 ${r.name}, ${r.revenue.toFixed(3)} 십억 달러`)});$('.rank-year').textContent=sn.year;$('#rankaxis').textContent=`십억 US달러 · 현재 막대 축 0–${max} · 연도별 축 최대값 변경`;const cap=DATA.ranking.captions[sn.year]||['',''];$('#ranktitle').textContent=cap[0];$('#rankdesc').textContent=cap[1];$('#rankstatus').textContent=sn.status==='preliminary_as_published_2026_01_12'?'2025 잠정 / 2026.01.12 발표':(sn.note||'역사 스냅샷 / 출처에서 집계 버전 확인');document.querySelectorAll('[data-rank]').forEach(b=>b.classList.toggle('active',Number(b.dataset.rank)===rankIndex));}

function hbm(){return `<div class="split"><div><svg viewBox="0 0 770 390" width="100%" height="360" role="img" aria-label="여러 DRAM을 TSV로 적층해 GPU 옆에 배치한 HBM 개념도"><path d="M25 312H735" stroke="#37ccff" stroke-width="15"/><text x="380" y="360" class="diagram-label" text-anchor="middle">인터포저·첨단 패키징: 가까이 연결하는 기반</text><rect x="270" y="105" width="230" height="180" rx="15" fill="#123e64" stroke="#37ccff" stroke-width="2"/><text x="385" y="185" font-size="48" fill="#ecfaff" text-anchor="middle">GPU</text><text x="385" y="231" class="diagram-label" text-anchor="middle">연산</text>${[70,560].map(x=>Array.from({length:6},(_,i)=>`<rect x="${x}" y="${263-i*30}" width="130" height="25" rx="4" fill="${i===5?'#218bb1':'#154e6b'}" stroke="#43d4ff"/>`).join('')+`<path d="M${x+30} 120V282M${x+65} 120V282M${x+100} 120V282" stroke="#5fffd5" stroke-dasharray="4 4"/><text x="${x+65}" y="70" class="diagram-label" text-anchor="middle">HBM · DRAM 적층</text>`).join('')}<path d="M205 255h60m240 0h50" stroke="#39e2b0" stroke-width="6"/></svg><p class="chart-note">구조를 설명하는 단순 도식 · 실제 개수·비율·제품 규격을 나타내지 않음</p></div><div class="chart-side"><h3>용량 ≠ 대역폭</h3><p><b class="cyan">용량</b>은 저장할 데이터의 양.<br><b class="green">대역폭</b>은 초당 옮길 데이터의 양.</p><p>GPU가 빨라져도 데이터가 늦게 도착하면 연산 능력을 충분히 쓰지 못한다.</p><p class="small">TSV: 칩을 관통하는 수직 연결<br>HBM은 DRAM의 한 종류</p></div></div>`}
function valuation(){return `<div class="grid two"><div class="panel"><h3>미래 현금과 할인율을 바꿔보세요</h3><div class="formula">현재가치 = FCF ÷ (1+r)⁵<small>5년 뒤 한 번 받는 현금만 할인하는 교육용 모형</small></div><div class="sliders"><div><label for="cashslider">5년 뒤 현금 <output id="cashval">100</output></label><input id="cashslider" type="range" min="50" max="150" value="100" step="5"></div><div><label for="rateslider">할인율 <output id="rateval">8%</output></label><input id="rateslider" type="range" min="6" max="16" value="8" step="0.5"></div></div></div><div class="panel accent"><span class="label">현재가치 · 가상 단위</span><div class="valuation" id="pv">68.1</div><div class="delta" id="pvdelta">기준 대비 0.0%</div><p style="margin-top:25px">미래 현금 기대가 낮아지거나<br>할인율이 오르면 가치가 하락한다.</p><button id="stress" style="margin-top:20px">현금 −20% · 할인율 12%</button><p class="detail">교육용 가정 · 기준: 현금 100, 할인율 8%, 5년</p></div></div>`}
function analogy(s){return `<div class="analogy">${s.items.map(x=>`<div class="analogy-item"><div class="analogy-icon" aria-hidden="true">${x.icon}</div><h3>${x.term}</h3><p class="analogy-as">${x.as}</p><p>${x.text}</p></div>`).join('')}</div>${s.note?`<p class="chart-note">${s.note}</p>`:''}`}
function scenarios(s){return `<div class="scenarios">${s.paths.map(p=>`<div class="scenario ${p.tone||''}"><div class="eyebrow">${p.label}</div><h3>${p.title}</h3><p class="scenario-cond"><b>성립 조건</b> ${p.condition}</p><p class="scenario-effect"><b>반도체에 미치는 영향</b> ${p.effect}</p><p class="scenario-signal"><b>확인할 신호</b> ${p.signal}</p></div>`).join('')}</div>${s.note?`<p class="chart-note">${s.note}</p>`:''}`}

function content(s){switch(s.type){case'cover':return `<div class="cover"><div><div class="eyebrow">KAIST DFMBA · CORPORATE FINANCE · TEAM 12</div><div class="title">${CONTENT.coverTitle}</div><div class="desc">${CONTENT.coverDesc}</div><div class="meta">${CONTENT.coverMeta}</div></div><div>${chipArt()}</div></div>`;case'agenda':return agenda();case'divider':return divider(s);case'cards':return cards(s);case'rows':return rows(s);case'table':return table(s);case'flow':return flow(s);case'timeline':return timeline(s);case'watch':return watch(s);case'chart':return chart(s);case'linear_chart':return linearChart(s);case'era_map':return eraMap(s);case'era':return era(s);case'ranking':return ranking();case'hbm':return hbm();case'valuation':return valuation();case'analogy':return analogy(s);case'scenarios':return scenarios(s);case'closing':return `<div class="bigstatement">${s.statement}</div>${s.formula?`<div class="formula" style="margin-top:25px;font-size:25px">${s.formula}</div>`:''}`;default:return cards(s)}}
function slideHTML(s,i){const p=partOf(s);const bare=s.type==='cover'||s.type==='divider';return `<section class="slide ${s.type==='divider'?'is-divider':''}" data-id="${s.id}" data-part="${s.part}" aria-label="${i+1}. ${escapeHTML(s.title)}">${bare?'':`<header class="slidehead"><div class="eyebrow" style="color:${partColor[s.part]}">PART ${p.num} · ${p.short}${s.core?'':'<span class="optional">선택 심화</span>'}</div><h1>${s.title}</h1><p class="subtitle">${s.subtitle||''}</p></header>`}<div class="slidebody">${content(s)}</div>${bare||!s.takeaway?'':`<div class="takeaway">${s.takeaway}</div>`}<div class="foot"><button class="source-button" title="이 장표의 근거 보기">${(s.sources||[]).map(x=>DATA.sources[x]?.short||x).join(' · ')||'교육용 분석'}</button><span>12조 · ${String(i+1).padStart(2,'0')} / ${slides.length}</span></div></section>`}

/* ---------- deck engine ---------- */
function setRoute(mode){route=slides.map((_,i)=>i).filter(i=>mode!=='core'||slides[i].core);if(!route.includes(index))index=route.find(i=>i>index)??route[0];render();}
function go(delta){let p=route.indexOf(index);index=route[Math.max(0,Math.min(route.length-1,p+delta))];render()}
function gotoId(id){const i=slides.findIndex(s=>s.id===id);if(i<0)return;index=i;if(!route.includes(i)){$('#route').value='all';route=slides.map((_,j)=>j)}render()}
function render(){stopRace();$('#stage').innerHTML=slideHTML(slides[index],index);window.location.hash=slides[index].id;$('#position').textContent=`${route.indexOf(index)+1} / ${route.length}`;$('#progress').style.width=(route.indexOf(index)+1)/route.length*100+'%';$('#prev').disabled=index===route[0];$('#next').disabled=index===route.at(-1);$('.source-button').onclick=()=>overlay('sources');document.querySelectorAll('.chapters span').forEach(x=>x.classList.toggle('active',slides[index].part===x.dataset.part));bindInteractive();window.deckState={index,seconds,mode:$('#route').value};publishState();if(currentOverlay)overlay(currentOverlay,true);scale();}
function scale(){const box=$('.deckviewport');if(!box)return;$('#stage').style.transform=`scale(${Math.min(box.clientWidth/1440,box.clientHeight/810)})`}
function stopRace(){if(raceTimer){clearInterval(raceTimer);raceTimer=null}if($('#raceplay'))$('#raceplay').textContent='▶ 재생'}
function bindInteractive(){document.querySelectorAll('[data-goto]').forEach(b=>{b.onclick=()=>gotoId(b.dataset.goto);b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();gotoId(b.dataset.goto)}}});const s=slides[index];if(s.type==='ranking'){drawRanks();document.querySelectorAll('[data-rank]').forEach(b=>b.onclick=()=>{stopRace();rankIndex=Number(b.dataset.rank);drawRanks()});$('#raceplay').onclick=()=>{if(raceTimer){stopRace();return}if(rankIndex===DATA.ranking.years.length-1)rankIndex=0;drawRanks();$('#raceplay').textContent='Ⅱ 일시정지';raceTimer=setInterval(()=>{rankIndex++;drawRanks();if(rankIndex>=DATA.ranking.years.length-1)stopRace()},2600)}}if(s.type==='valuation'){const update=()=>{let cash=Number($('#cashslider').value),rate=Number($('#rateslider').value),base=100/1.08**5,pv=cash/(1+rate/100)**5;$('#cashval').textContent=cash;$('#rateval').textContent=rate+'%';$('#pv').textContent=pv.toFixed(1);let change=(pv/base-1)*100;$('#pvdelta').textContent=`기준 대비 ${change>0?'+':''}${change.toFixed(1)}%`};$('#cashslider').oninput=update;$('#rateslider').oninput=update;$('#stress').onclick=()=>{$('#cashslider').value=80;$('#rateslider').value=12;update()};update()}}
function sourcesHTML(ids){return [...new Set(ids)].map(id=>{let s=DATA.sources[id];if(!s)return `<p>출처 ${id}</p>`;return `<div class="source-item">${s.url?`<a href="${s.url}" target="_blank" rel="noopener">${escapeHTML(s.title)} ↗</a>`:`<strong>${escapeHTML(s.title)}</strong>`}<p>${escapeHTML(s.publisher||'')} · ${escapeHTML(s.published||s.date||'날짜는 원문 참조')}<br>${escapeHTML(s.note||s.scope||'')}</p></div>`}).join('')}
function overlay(kind,force=false){const el=$('#overlay');if(currentOverlay===kind&&!force){closeOverlay();return}currentOverlay=kind;el.hidden=false;let s=slides[index],study=s.study||{};el.innerHTML='<button class="close" aria-label="닫기">닫기 ×</button>';if(kind==='notes')el.innerHTML+=`<div class="eyebrow">${index+1} · 발표자 메모</div><h2>${s.title}</h2><p>${study.script||s.takeaway||''}</p><p class="transition">다음 연결: ${$('#route').value==='core'?(s.coreTransition||study.transition||''):(study.transition||'')}</p><h3>핵심 질문</h3><p>${study.question||''}</p><p>${study.answer||''}</p><p class="muted">이 메모는 현재 화면에 표시됩니다. 청중과 화면을 공유할 때는 발표자 창(P)을 별도 모니터에 배치하세요.</p>`;else if(kind==='sources')el.innerHTML+=`<h2>이 장표의 출처</h2>${sourcesHTML(s.sources||[])}<p class="small muted">조사 기준 ${CONTENT.asOf} · 실제치·회사 전망·교육용 가정을 구분합니다. 공부용 자료에서 더 자세히 확인할 수 있습니다.</p>`;else el.innerHTML+=`<h2>전체 ${slides.length}장 · ${slides.filter(s=>s.core).length}장 핵심 경로</h2><p class="muted">핵심 경로 약 15분, 전체 설명 약 30~40분. 장표를 눌러 이동하세요.</p><div class="toc-grid">${slides.map((s,i)=>`<button data-slide="${i}" class="${i===index?'active':''}"><span>${String(i+1).padStart(2,'0')} · ${s.core?'핵심':'선택 심화'} · PART ${partOf(s).num}</span>${s.title}</button>`).join('')}</div>`;el.querySelector('.close').onclick=closeOverlay;el.querySelectorAll('[data-slide]').forEach(b=>b.onclick=()=>{index=Number(b.dataset.slide);if(!route.includes(index)){$('#route').value='all';route=slides.map((_,i)=>i)}closeOverlay();render()});el.querySelector('.close').focus();}
function closeOverlay(){currentOverlay=null;$('#overlay').hidden=true;$('#notes').focus()}
function fullscreen(){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.().catch(()=>{})}
function blackout(){const old=$('.blackout');if(old){old.remove();return}const b=document.createElement('div');b.className='blackout';b.tabIndex=0;b.setAttribute('aria-label','화면 가림. 클릭하거나 B 또는 Escape로 해제');b.onclick=()=>b.remove();document.body.append(b);b.focus()}
function presenter(){presenterWindow=window.open(location.pathname+'?presenter=1#'+slides[index].id,'semiconductor-presenter','width=1000,height=800')}
function publishState(){if(presenterWindow&&!presenterWindow.closed)presenterWindow.postMessage({kind:'deck-state',state:window.deckState},'*')}
function timeLabel(n){return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}
function startDeck(){window.addEventListener('message',e=>{if(e.source!==presenterWindow)return;if(e.data?.kind==='deck-ready')publishState();if(e.data?.kind==='deck-navigate')go(e.data.delta===-1?-1:1)});let hash=decodeURIComponent(location.hash.slice(1));index=Math.max(0,slides.findIndex(s=>s.id===hash));$('#prev').onclick=()=>go(-1);$('#next').onclick=()=>go(1);$('#notes').onclick=()=>overlay('notes');$('#sources').onclick=()=>overlay('sources');$('#toc').onclick=()=>overlay('toc');$('#full').onclick=fullscreen;$('#presenter').onclick=presenter;$('#route').onchange=e=>setRoute(e.target.value);document.querySelectorAll('.chapters span').forEach(x=>x.onclick=()=>{const p=parts.find(q=>q.id===x.dataset.part);if(p)gotoId(p.first)});$('#timer').onclick=()=>{if(timer){clearInterval(timer);timer=null;$('#timer').textContent='타이머 계속'}else{timer=setInterval(()=>{seconds++;$('#clock').textContent=timeLabel(seconds);if(window.deckState)window.deckState.seconds=seconds;publishState()},1000);$('#timer').textContent='타이머 정지'}};$('#resettime').onclick=()=>{seconds=0;$('#clock').textContent='00:00'};window.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))return;if(e.key==='Escape'){if($('.blackout'))$('.blackout').remove();else closeOverlay();return}if(e.key.toLowerCase()==='b'){blackout();return}if(currentOverlay)return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(-1)}if(e.key==='Home'){index=route[0];render()}if(e.key==='End'){index=route.at(-1);render()}let act={n:()=>overlay('notes'),s:()=>overlay('sources'),t:()=>overlay('toc'),f:fullscreen,p:presenter};act[e.key.toLowerCase()]?.()});window.addEventListener('resize',scale);window.addEventListener('hashchange',()=>{let i=slides.findIndex(s=>s.id===location.hash.slice(1));if(i>=0&&i!==index){index=i;if(!route.includes(i)){$('#route').value='all';route=slides.map((_,j)=>j)}render()}});window.addEventListener('beforeprint',()=>{stopRace();$('#stage').innerHTML=slides.map(slideHTML).join('');drawRanks();});window.addEventListener('afterprint',render);render();}
function startPresenter(){document.body.innerHTML='<main class="presenter"><div class="eyebrow">발표자 화면 · 별도 모니터에 배치</div><div id="present-content"><p>발표 화면과 연결 중입니다.</p></div><button id="pprev">← 이전</button> <button id="pnext">다음 →</button></main>';let last=-1;window.addEventListener('message',e=>{if(e.source!==window.opener||e.data?.kind!=='deck-state')return;const state=e.data.state;if(state.index!==last){last=state.index;let s=slides[last];$('#present-content').innerHTML=`<h1>${last+1}. ${s.title}</h1><p>${s.study?.script||s.takeaway||''}</p><p class="cyan">${state.mode==='core'?(s.coreTransition||s.study?.transition||''):(s.study?.transition||'')}</p><div class="next">다음: ${slides[state.mode==='core'?slides.findIndex((x,i)=>i>last&&x.core):last+1]?.title||'마지막 장표'}</div><p id="presenttime"></p>`}$('#presenttime').textContent='발표 경과 '+timeLabel(state.seconds)});$('#pprev').onclick=()=>window.opener?.postMessage({kind:'deck-navigate',delta:-1},'*');$('#pnext').onclick=()=>window.opener?.postMessage({kind:'deck-navigate',delta:1},'*');window.opener?.postMessage({kind:'deck-ready'},'*')}

/* ---------- study page ---------- */
function startStudy(){const query=$('#study-search');query.oninput=()=>{let q=query.value.trim().toLowerCase(),num=0;document.querySelectorAll('.study-section').forEach(e=>{let show=e.textContent.toLowerCase().includes(q);e.hidden=!show;if(show)num++});$('#empty').hidden=num>0;$('#search-count').textContent=q?`${num}개 항목 검색됨`:''};$('#theme').onclick=()=>{document.body.classList.toggle('light');$('#theme').textContent=document.body.classList.contains('light')?'어둡게':'밝게'};$('#expand').onclick=()=>{let all=[...document.querySelectorAll('details')],open=all.some(e=>!e.open);all.forEach(e=>e.open=open);$('#expand').textContent=open?'질문 접기':'질문 펼치기'};$('#print').onclick=()=>{document.querySelectorAll('details').forEach(e=>e.open=true);window.print()};const ob=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting){document.querySelectorAll('.study-toc a').forEach(a=>a.classList.toggle('active',a.hash==='#'+e.target.id))}})},{rootMargin:'-10% 0px -75% 0px'});document.querySelectorAll('.study-section').forEach(e=>ob.observe(e));document.querySelectorAll('.study-era-map').forEach(el=>{el.innerHTML=eraMap({});el.querySelectorAll('[data-goto]').forEach(b=>{b.onclick=()=>{location.hash='#'+b.dataset.goto}})});document.querySelectorAll('.study-linear-chart').forEach(el=>{el.innerHTML=linearChart({side:{title:'',text:''},note:''}).replace(/<div class="chart-side">.*$/s,'</div>')});}
if(new URLSearchParams(location.search).has('presenter'))startPresenter();else if(document.body.classList.contains('study-body'))startStudy();else startDeck();
</script></body></html>
