</style></head><body class=""><header class="topbar"><div class="brand"><b>12</b> SEMICONDUCTOR / 1980→2026</div><nav class="chapters" aria-label="발표 흐름"><span data-part="p1">01 린니어</span><span data-part="p2">02 반도체 45년</span><span data-part="p3">03 현재와 전망</span></nav><label class="sr-only" for="route" style="position:absolute;left:-9999px">발표 경로</label><select id="route"><option value="all">전체 43장</option><option value="core">15분 핵심 28장</option></select><a href="study.html" target="_blank">공부용 해설 ↗</a></header><main class="deckviewport"><div class="stage" id="stage"></div></main><footer class="controlbar"><button id="prev" aria-label="이전 장표">←</button><span class="position" id="position"></span><button id="next" aria-label="다음 장표">→</button><div class="progress" aria-hidden="true"><i id="progress"></i></div><button id="toc" title="T">목차 T</button><button id="notes" title="N">메모 N</button><button id="sources" title="S">출처 S</button><button id="presenter" class="hide-small" title="P">발표자 P</button><span class="time hide-small" id="clock">00:00</span><button id="timer" class="hide-small">타이머 시작</button><button id="resettime" class="hide-small" aria-label="타이머 초기화">↺</button><button id="full" title="F">전체화면 F</button></footer><aside class="overlay" id="overlay" hidden role="dialog" aria-modal="true" aria-label="발표 보조 패널"></aside><script>const CONTENT={"title": "린니어는 왜 사라졌나: 반도체 45년과 AI의 시험대", "coverTitle": "린니어는 왜<br>사라졌나", "coverDesc": "케이스 이후의 Linear Technology ·<br>1980년 이후 반도체 산업의 변천 ·<br>AI 시대, 사이클인가 구조 변화인가", "coverMeta": "KAIST DFMBA 기업재무 · 12조 · 조사 기준 2026.11.05 · 15분 핵심 경로 / 전체 심화 경로", "asOf": "2026-11-05", "agendaFoot": "케이스의 주인공이 사라진 이유에서 출발해, 산업 전체의 45년을 거쳐, 지금 반도체가 서 있는 시험대까지 갑니다. 각 파트의 카드를 누르면 바로 이동합니다.", "parts": [{"id": "p0", "num": "00", "short": "서론", "title": "서론", "desc": "", "minutes": 1, "first": "cover"}, {"id": "p1", "num": "01", "short": "린니어", "title": "케이스 이후의 린니어", "desc": "2003년 현금이 넘치던 회사는 13년 뒤 사라졌다. 사업이 망해서가 아니다. 시대 배경을 바탕으로 왜 팔렸는지 본다.", "minutes": 3, "studyIntro": ["다른 조가 케이스의 질문(2003년 4월 배당을 올릴 것인가)에 답한다면, 우리 조는 그 다음 이야기에서 출발합니다. Linear Technology는 2017년 3월 10일 Analog Devices에 인수되어 상장폐지됐고, 지금은 독립 회사로 존재하지 않습니다. 이 파트의 목적은 ‘돈을 잘 벌던 회사가 왜 사라졌는가’를 사실관계와 시대 배경으로 설명하는 것입니다.", "핵심 메시지는 세 가지입니다. 첫째, 린니어는 실패하지 않았다(인수 직전까지 업계 최고 수준의 이익률과 13년 연속 배당 인상). 둘째, 그럼에도 팔린 이유는 산업의 무게중심 이동과 2015~2016년의 금융 환경(초저금리, 성장 둔화, 규모의 경제)에 있다. 셋째, 인수한 ADI는 망하지 않았고 지금도 대형 아날로그 기업으로 영업 중이다. 이 세 가지를 정확히 말해야 Part 2로 자연스럽게 넘어갈 수 있습니다."], "first": "p1-div"}, {"id": "p2", "num": "02", "short": "반도체 45년", "title": "1980년 이후 글로벌 반도체 산업의 변화", "desc": "린니어의 소멸은 산업의 무게중심이 움직인 결과다. 반도체의 시작을 비유로 이해하고, 9개 시기로 나눠 거시 배경·기술·주도 기업·재무 특징을 본다.", "minutes": 7, "studyIntro": ["이 파트는 발표의 중심입니다. 개별 기업의 재무 결정도 중요하지만, 어떤 산업 흐름 위에서 그 결정이 내려졌는지 이해하는 것이 더 중요하다는 것이 우리 조의 관점입니다. 반도체의 기초를 비유로 짧게 설명한 뒤, 1980년 이후를 9개 시기로 나누고 각 시기마다 같은 네 칸(거시 배경 / 산업·기술 / 주도 기업 / 재무적 특징)으로 읽습니다.", "시기 구분은 교수님이 공유한 영상(역대 글로벌 반도체 기업 매출 순위 Top12, 1987~2026)의 흐름과 Gartner 연간 공급업체 매출 1위 교체(NEC 1985~91 → Intel 1992~2016 → Samsung 2017~18 → Intel 2019~20 → Samsung 2021~22 → Intel 2023 → NVIDIA 2024~)를 기준으로 잡았습니다. 순위는 회사 전체 매출이나 시가총액이 아니라 반도체 매출이며, 파운드리(TSMC)와 장비사는 포함되지 않습니다.", "각 시기의 ‘재무적 특징’ 칸이 기업재무 수업과의 연결 고리입니다. 누가 투자를 감당했는지(자본 조달), 누가 불황을 버텼는지(재무구조), 어떤 금리·세제·보조금이 투자 결정을 바꿨는지(자본비용)를 반복해서 묻습니다."], "first": "p2-div"}, {"id": "p3", "num": "03", "short": "현재와 전망", "title": "이후 반도체 산업의 변화: 현재와 전망", "desc": "AI 수요 폭발로 메모리 가격이 급등하고 한국 기업이 기록적 이익을 냈다. 그런데 금리·선거·투자 속도 조절론이 등장했다. 사이클인가, 구조 변화인가.", "minutes": 4, "studyIntro": ["Part 2의 마지막 시기가 현재로 이어집니다. 이 파트는 2025~2026년의 상황을 정리하고(수요 폭발, 가격 급등, 한국 기업의 이익), 최근의 반전(금리 상승, 2026년 미국 중간선거 이후 데이터센터 규제 논의, 빅테크·네오클라우드의 투자 부담, 속도 조절론)을 짚은 뒤, ‘반복되는 사이클인가, 이번에는 다른가’라는 시험대를 재무 지표로 어떻게 판단할지 제시합니다.", "마지막으로 향후 전망을 제시합니다. 우리 조의 판단은 ‘당장은 속도 조절이 있어도 투자 사이클을 완전히 꺾기는 어렵다’입니다. 미국이 속도를 늦추면 중국과의 AI 격차가 좁혀지는 위험이 돌아오고, AI의 파급력이 코딩을 넘어 제약·자동차·휴머노이드·우주·양자·보안 등 산업 전반으로 번지면서 수요의 폭이 넓어지기 때문입니다. 이것은 조사한 사실 위에 세운 우리의 해석이므로, 발표에서는 사실과 해석을 구분해서 말해야 합니다."], "first": "p3-div"}], "slides": [{"id": "cover", "part": "p0", "title": "린니어는 왜 사라졌나", "type": "cover", "core": true, "sources": ["CASE", "linear_close", "WSTS"], "study": {"paragraphs": ["표지에서 청중에게 던질 한 문장은 ‘케이스의 주인공은 지금 없다’입니다. 2003년 4월 배당을 올릴지 고민하던 Linear Technology는 2017년 3월 10일 Analog Devices에 인수되어 상장폐지됐습니다. 다른 조가 배당의 정답을 논의한다면, 우리 조는 그 회사가 사라진 이유를 산업 전체의 45년 흐름에서 찾습니다.", "세 파트의 구조를 미리 말해 두면 청중이 따라오기 쉽습니다. Part 1은 린니어의 13년과 2016년 매각, Part 2는 1980년 이후 반도체 산업을 9개 시기로 나눈 역사, Part 3은 AI 시대의 현재와 전망입니다. 끝에서 다시 린니어의 질문(현금을 어디에 배분할 것인가)으로 돌아옵니다."], "script": "안녕하십니까, 12조입니다. 우리가 읽은 케이스의 회사, Linear Technology는 지금 존재하지 않습니다. 2017년에 경쟁사에 인수됐습니다. 돈을 잘 벌던 회사가 왜 사라졌는지, 그리고 그 뒤에서 반도체 산업이 어떻게 움직였는지, 세 파트로 말씀드리겠습니다.", "transition": "발표의 순서를 먼저 보여드리겠습니다."}, "coreTransition": "발표의 순서를 먼저 보여드리겠습니다."}, {"id": "agenda", "part": "p0", "title": "세 가지 질문", "subtitle": "케이스 이후의 린니어 → 1980년 이후 반도체 45년 → AI 시대의 현재와 전망", "type": "agenda", "core": true, "takeaway": "개별 기업의 재무 결정은 산업의 흐름 위에서 내려진다. 흐름을 먼저 읽어야 결정이 보인다", "sources": ["CASE", "VIDEO"], "study": {"paragraphs": ["아젠다 장표는 화면의 세 카드를 누르면 각 파트의 첫 장표로 이동합니다. 발표에서는 한 문장씩만 소개합니다. Part 1 ‘린니어는 실패하지 않았다, 시대가 바뀌었다’, Part 2 ‘수요의 중심이 이동할 때마다 1위가 바뀌었다’, Part 3 ‘이번 AI 사이클은 반복인가 구조 변화인가’.", "우리 조의 관점을 분명히 합니다. 기업재무 수업이지만 개별 기업의 배당·자사주·차입 결정만 보면 린니어의 결말을 설명할 수 없습니다. 어떤 산업 흐름 위에서 결정이 내려졌는지가 더 중요합니다. 그래서 Part 2가 발표의 중심이고 시간도 가장 많이 배정했습니다."], "script": "첫째, 케이스 이후의 린니어. 둘째, 1980년 이후 반도체 산업이 어떻게 바뀌었는지. 셋째, 지금 AI 시대의 반도체는 어디에 서 있는지. 결론에서 다시 린니어의 질문으로 돌아오겠습니다.", "transition": "먼저 케이스 이후의 린니어입니다."}, "coreTransition": "먼저 케이스 이후의 린니어입니다."}, {"id": "p1-div", "part": "p1", "title": "케이스 이후의 린니어", "type": "divider", "core": true, "lead": "2003년 4월, 현금이 15억 달러 넘게 쌓인 회사가 배당을 올릴지 고민했다. 13년 뒤 그 회사는 사라졌다. 사업이 망해서가 아니다.", "sources": ["CASE", "linear_close"], "study": {"paragraphs": []}}, {"id": "p1-recap", "part": "p1", "title": "2003년 4월, 케이스가 남긴 질문", "subtitle": "현금은 쌓이고 투자처는 없다 · 배당을 올릴 것인가, 자사주를 살 것인가, 쌓아둘 것인가", "type": "cards", "core": true, "takeaway": "케이스의 질문은 ‘돈을 어떻게 나눌까’였다. 우리는 그 회사에 그 뒤 무슨 일이 있었는지를 본다", "sources": ["CASE", "linear_q3fy03"], "cards": [{"label": "2003년 3월 말", "title": "현금과 단기투자", "stat": ">$1.5bn", "text": "불황이던 FY2002 매출<br>$512M의 약 3배", "detail": "케이스 Exhibit. FY2001 순이익 $427M → FY2002 $198M으로 줄어도 현금은 계속 쌓였다", "accent": true}, {"label": "배당", "title": "분기 $0.05 → $0.06", "stat": "2003.04.15 인상", "text": "1992년 개시, 기술기업으로는 드물게<br>배당을 주고 매년 올렸다", "detail": "케이스 직후인 2003년 4월 15일 분기 배당을 $0.06으로 올렸다(확인). 배당은 ‘앞으로도 계속 준다’는 약속. 한 번 올리면 내리기 어렵다"}, {"label": "사업", "title": "고성능 아날로그", "stat": "OPM 40%+", "text": "전력관리·신호처리 칩<br>제품 수명 길고 팹은 싸다", "detail": "당시 아날로그 팹 약 $0.2bn vs 디지털 팹 약 $2bn(케이스). 재투자 부담이 작아 현금이 남는 구조"}, {"label": "케이스의 질문", "title": "현금을 어디에?", "stat": "", "text": "배당 인상 · 자사주 매입<br>· 현금 보유 · 인수", "detail": "경영진에게 적극적 인수 계획은 없었다. 이 질문의 답이 아니라 ‘그 다음’을 본다"}], "study": {"paragraphs": ["케이스의 시점은 2003년 4월입니다. Linear Technology는 전력관리·신호처리용 고성능 아날로그 반도체를 설계·제조·판매하는 회사였고, 2001년 IT 불황으로 순이익이 FY2001 약 4억 2,700만 달러에서 FY2002 약 1억 9,800만 달러로 줄었는데도 현금과 단기투자자산이 15억 달러를 넘게 쌓여 있었습니다. 케이스에서 특정 고객 비중은 5% 이하였고, 당시 아날로그 신규 팹은 약 2억 달러로 인텔의 디지털 팹(약 20억 달러)보다 훨씬 쌌으며 10년 이상 쓸 수 있었습니다. 재투자 부담이 작으니 이익이 그대로 현금으로 남는 구조였습니다.", "린니어는 1992년부터 배당을 시작해 매년 올려 온, 기술기업으로는 드문 회사였습니다. 케이스의 질문은 분기 $0.05 배당을 올릴 것인가, 자사주를 살 것인가, 현금을 쌓아둘 것인가였습니다. 배당은 지속성을 약속하는 성격이 강해 한 번 올리면 내리기 어렵고, 자사주 매입은 조정이 쉽다는 점이 토론의 축입니다. 우리 조는 이 질문의 정답을 반복하지 않습니다. 대신 ‘그 뒤 이 회사의 현금과 사업이 어떻게 됐는가’를 보겠다고 선언하는 장표입니다.", "발표에서는 네 카드를 빠르게 읽습니다. 현금이 매출의 3배라는 점, 배당을 매년 올려 왔다는 점, 아날로그 사업의 경제성(긴 제품 수명, 싼 팹, 높은 영업이익률), 그리고 케이스의 질문. 숫자는 모두 케이스 본문과 Exhibit에서 가져온 것이므로 질문이 나오면 ‘케이스 2003년 시점 기준’이라고 답하면 됩니다."], "script": "케이스로 돌아가 보면, 2003년의 린니어는 불황에도 현금이 15억 달러 넘게 쌓여 있었습니다. 매출의 3배입니다. 아날로그 공장은 싸고 오래 쓰니 벌어들인 이익이 그대로 남았습니다. 질문은 이 돈을 배당으로 줄지, 자사주를 살지, 쌓아둘지였습니다. 우리는 그 답이 아니라 그 다음 13년을 보겠습니다.", "transition": "케이스 이후 13년 동안 린니어의 매출과 배당은 이렇게 움직였습니다.", "question": "린니어는 왜 기술기업인데 배당을 주었나?", "answer": "아날로그 사업은 제품 수명이 길고 공정 미세화 경쟁이 덜해 재투자 부담이 작았습니다. 투자 기회보다 현금이 많이 남는 회사는 현금을 쌓아두는 기회비용이 커지므로 주주에게 돌려주는 것이 합리적일 수 있습니다. 케이스는 그 방법(배당 vs 자사주)을 묻습니다.", "extraQA": [{"q": "당시 아날로그 팹이 싸다는 설명을 지금도 쓸 수 있나?", "a": "아닙니다. 케이스의 2003년 비교(아날로그 약 $0.2bn, 디지털 약 $2bn)는 당시 예시입니다. 지금은 TI 같은 아날로그 기업도 300mm 팹에 수십억 달러를 투자합니다. ‘당시 기준’이라고 한정해서 말해야 합니다."}], "sourceIds": ["CASE", "analog_technology", "linear_q3fy03"]}, "coreTransition": "케이스 이후 13년 동안 린니어의 매출과 배당은 이렇게 움직였습니다."}, {"id": "p1-chart", "part": "p1", "title": "케이스 이후 13년: 매출은 2배, 배당은 6배", "subtitle": "회계연도(6월 말) 기준 매출($M)과 연간 주당배당($) · 13년 연속 배당 인상 · 2007년 $3bn 자사주 매입 · 2014년 전환사채 상환", "type": "linear_chart", "core": true, "takeaway": "린니어는 사라지기 직전까지 업계 최고 수준의 이익률로 돈을 벌고 있었다. 실패한 회사의 그래프가 아니다", "sources": ["linear_10k_2007", "linear_10k_2016", "linear_q3fy03", "linear_10q_fy17q2", "linear_tsr_calc"], "note": "모든 값은 Linear 10-K·SEC XBRL(FY2006~09 배당은 연간 합계). 주황 막대는 큰 자본배분 결정이 있던 해(2007 ASR, 2016 매각 발표). 영업이익률은 14년 내내 42~56%.", "side": {"stat": "$0.05 → $0.33", "title": "분기 배당의 변화", "text": "2003년 분기 $0.05였던 배당은 2016년 $0.32, 마지막 배당(2017년 3월)은 $0.33이었다. 매출은 $607M에서 FY2011 $1,484M까지 커진 뒤 $1.3~1.5bn에서 정체했고, 영업이익률은 매년 42~56%였다.", "small": "FY2003~16 누적 환원 $7.76bn(배당 $2.71bn + 자사주 $5.05bn)은 누적 순이익 $5.74bn의 135%. 2007년 $3.0bn ASR은 현금 $1.3bn + 전환사채 $1.7bn으로 집행했다. 현금을 쌓던 회사가 빚을 내 주식을 산 것이다."}, "study": {"paragraphs": ["그래프는 두 가지를 동시에 보여줍니다. 막대는 회계연도 매출(백만 달러), 선은 연간 주당배당(달러)입니다. 매출은 FY2003 약 6억 달러에서 FY2011 약 14.8억 달러까지 커졌다가 이후 13~15억 달러에서 정체됐습니다. 배당은 한 번도 줄지 않고 매년 올라 분기 $0.05에서 $0.32가 됐습니다. 2003년 케이스의 질문(‘배당을 올릴까’)에 린니어 경영진은 그 뒤 13년 내내 ‘올린다’로 답한 셈입니다.", "그래프에서 가장 중요한 해는 2007년입니다. 린니어는 2007년 4월 30억 달러 규모의 자사주 매입(accelerated share repurchase)을 실행했고, 그 재원은 자기 현금 13억 달러와 전환사채 17억 달러였습니다(3.00%·3.125% 전환사채, 만기 2027년). 현금만 쌓던 회사가 빚을 내서 주식을 산 것입니다. 기업재무에서 말하는 레버리지 리캡(차입을 통한 자본구조 재편)에 가깝습니다. 저금리로 싸게 빌릴 수 있고, 현금을 쌓아두는 기회비용이 크고, 성장 투자처가 없을 때 선택하는 수단입니다. 케이스의 토론이 ‘배당 vs 자사주’였다면, 현실의 답은 ‘둘 다, 그리고 차입까지’였습니다.", "그래프가 전하는 메시지는 분명합니다. 린니어는 인수되기 직전까지 잘 벌고 있었습니다. FY2016 매출은 약 14.2억 달러였고 영업이익률은 40%대 중반으로, 대형 아날로그 기업 중 최고 수준이었습니다. 그러니 ‘사라졌다’는 사실을 ‘망했다’로 읽으면 안 됩니다. 다만 2011년 이후 매출이 더 자라지 않았다는 점이 다음 장표(왜 팔렸나)의 복선입니다. 잘 벌지만 더 커지지 않는 회사, 그것이 2015년의 린니어였습니다.", "숫자의 확인 상태. 매출·영업이익·순이익·현금·부채는 FY2003~2016 10-K와 SEC XBRL에서 직접 확인했습니다. 연간 배당은 10-K의 합계이며(FY2003 $0.21 → FY2016 $1.24), 분기 내역은 FY2003~05와 FY2010~17은 확인, FY2006~09는 연간 합계에서 추정입니다. 인상은 FY2004부터 매년 1월 분기(Q3)에 이루어졌고 마지막 배당은 인수 완료 3일 전인 2017년 3월 7일에 지급된 $0.33입니다. 누적 환원 $7.76bn은 현금흐름표를 합산한 조사 계산이며 이를 요약한 2차 출처는 없습니다. 2007년 ASR의 금액과 재원은 FY2007 10-K 주석에, 전환사채의 조기 상환(2009~10 일부 재매입, 2010년 11월 3.125%물 전액, 2014년 5월 3.00%물 $845M 전액)은 FY2010·FY2012 10-K와 2014년 3분기 10-Q에 있습니다. FY2014 이후 린니어는 무차입이었고 FY2015 이자비용은 $41.2M 줄었습니다."], "tables": [{"title": "자본배분의 다섯 장면 (확인된 사실)", "headers": ["시점", "결정", "재원·조건", "의미"], "rows": [["2003.04", "분기 배당 $0.05 → $0.06 인상(4/15 발표, 5/14 지급)", "현금·단기투자 $1,565M(2003-03-30)", "케이스의 질문에 ‘올린다’로 답함"], ["2007.04", "$3.0bn 자사주 매입(ASR), 주식 27% 소각", "현금 $1.3bn + 전환사채 $1.7bn(3.00%·3.125%, 만기 2027)", "차입을 통한 자본구조 재편, 자기자본 −$708M"], ["2010.11 · 2014.05", "전환사채 전액 상환(3.125%물 $396M, 3.00%물 $845M)", "영업현금", "7년 만의 무차입 복귀, FY2015 이자비용 −$41M"], ["2016.07", "ADI에 매각 합의, 주당 약 $60", "현금 $46 + ADI 주식 0.2321주", "독립 기업으로서의 역사 종료"], ["2017.03", "마지막 배당 $0.33 지급(3/7), 3/10 인수 완료", "—", "13년간 배당 합계 $11.75/주"]], "note": "Linear 10-K FY2003·FY2007·FY2010·FY2012·FY2016, 2014년 3분기 10-Q, 2017년 2분기 10-Q, DEFM14A, ADI FY2017 10-K."}, {"title": "FY2003–2016 주요 재무 (10-K · SEC XBRL, $M)", "headers": ["회계연도", "매출", "영업이익률", "순이익", "연간 DPS", "현금·투자", "부채(액면)"], "rows": [["FY2003", "606.6", "48.5%", "236.6", "$0.21", "1,593.6", "0"], ["FY2005", "1,049.7", "56.2%", "434.0", "$0.36", "1,790.9", "0"], ["FY2007", "1,083.1", "48.4%", "411.7", "$0.66", "633.3", "1,700.0"], ["FY2009", "968.5", "42.5%", "289.2", "$0.86", "868.7", "1,405.6"], ["FY2011", "1,484.0", "51.7%", "580.8", "$0.94", "922.5", "845.1"], ["FY2014", "1,388.4", "46.1%", "460.0", "$1.06", "1,012.8", "0"], ["FY2016", "1,423.9", "44.5%", "494.3", "$1.24", "1,448.3", "0"]], "note": "FY2008 순이익은 최초 보고치 기준. 희석주식수 321.4M(FY2003) → 245.0M(FY2016), −24%. 누적 배당 $2,711M + 자사주 $5,046M = $7,757M vs 누적 순이익 약 $5,738M."}], "script": "케이스 이후 13년입니다. 매출은 두 배가 됐고, 배당은 한 번도 줄지 않고 매년 올라 여섯 배가 됐습니다. 특히 2007년에는 30억 달러 자사주 매입을 했는데, 그중 17억 달러는 전환사채, 즉 빚이었습니다. 현금을 쌓던 회사가 빚을 내서 주식을 산 겁니다. 그리고 매출은 2011년 이후 더 자라지 않았습니다. 잘 벌지만 더 커지지 않는 회사, 이것이 매각 직전의 린니어입니다.", "transition": "그런 회사에 2015년 여름, 경쟁사가 찾아옵니다.", "question": "현금이 많은데 왜 빚을 내서 자사주를 샀나?", "answer": "2007년의 금리는 낮았고(전환사채 쿠폰 3.00%·3.125%), 보유 현금 $1.8bn 중 $1.3bn만 쓰고 나머지 $1.7bn은 빌려 한 번에 주식의 27%를 소각했습니다. 부채 이자는 세금 공제가 되므로 자본비용이 낮아지고, 주식 수가 줄어 주당이익이 올라갑니다. 투자처가 없는 회사가 자본구조를 바꿔 주주가치를 높이는 전형적 수단입니다. 다만 빚이 생기면 불황에 버틸 여력이 줄어드는 비용이 있고, 실제로 FY2009 매출이 18% 줄었을 때 린니어는 전환사채를 할인 재매입하며 부채를 줄였습니다.", "extraQA": [{"q": "전환사채를 쓴 이유는?", "a": "일반 회사채보다 쿠폰이 낮고(주식 전환권을 주는 대가), 당시 린니어 주가 수준에서 희석 위험을 감수할 만했기 때문입니다. 만기 2027년의 장기 자금을 3%대에 조달한 셈입니다."}], "sourceIds": ["CASE", "linear_10k_2007", "linear_10k_2016", "linear_q3fy03", "linear_10q_fy17q2", "linear_tsr_calc", "ihs_linear_margin"]}, "coreTransition": "그런 회사에 2015년 여름, 경쟁사가 찾아옵니다."}, {"id": "p1-deal", "part": "p1", "title": "2015년 7월부터 2017년 3월까지: 접근, 거절, 재협상, 매각", "subtitle": "합병 위임장(DEFM14A) ‘Background of the Merger’에 기록된 과정", "type": "timeline", "core": true, "takeaway": "이사회는 첫 제안을 ‘심각한 저평가’라며 거절했고, 10개월 뒤 17% 높은 가격에 팔았다. 거절이 협상의 일부였다", "sources": ["linear_defm14a", "linear_deal", "linear_close", "linear_close_value", "adi_10k_2017", "linear_tsr_calc"], "events": [{"year": "2015.07–08", "title": "ADI의 접근", "text": "CEO 간 접촉 후 8월 14일<br>비공식 제안 약 $51.50<br>주식 75% · 현금 25%"}, {"year": "2015.09", "title": "거절", "text": "이사회: ‘substantially<br>undervalued’ · 독자 경영의<br>장기 가치가 더 크다"}, {"year": "2016.04", "title": "재접근 $58", "text": "현금 75% · 주식 25%<br>이사회는 ‘의미 있는 인상’<br>을 요구"}, {"year": "2016.05", "title": "A사 $54 현금", "text": "이사회 지시로 접촉한<br>제3의 회사. 추가 인상<br>불가 통보(6월)"}, {"year": "2016.06–07", "title": "합의 $60", "text": "현금 $46 + ADI 0.2321주<br>7월 26일 서명<br>발표 가치 $14.8bn", "accent": true}, {"year": "2017.03.10", "title": "완료·상장폐지", "text": "ADI 회계상 대가 $15.76bn<br>(현금 $11.1bn + 주식 $4.6bn)<br>Linear 독립 역사 종료", "accent": true}], "note": "주당 가치 $60은 서명 시점 기준. 완료일 ADI 주가($82.20)를 적용하면 약 $65이며, 케이스 시점 주가 $30.87의 약 2.1배.", "study": {"paragraphs": ["합병 위임장(DEFM14A)의 ‘Background of the Merger’는 거래 과정을 날짜별로 기록합니다. 2015년 7월 ADI CEO Vincent Roche가 린니어 창업자 겸 회장 Robert Swanson에게 전화를 걸었고, 8월 14일 주당 약 $51.50(약 25% 프리미엄, 주식 75%·현금 25%)의 비공식 제안이 왔습니다. 린니어 이사회는 9월 4일 이 제안이 회사를 ‘substantially undervalued’한다고 판단했고, 9월 14일 만장일치로 거절을 통보했습니다. 독립 회사로서의 장기 가치가 더 크다는 것이 이유였습니다.", "2016년 4월 ADI는 주당 $58(현금 75%·주식 25%)로 다시 접근했습니다. 이사회는 여전히 저평가라며 ‘의미 있는 인상’을 요구했고, 동시에 자문사 Qatalyst를 통해 제3의 회사(위임장에서 ‘Company A’)에 접촉했습니다. A사는 5월 18일 주당 $54 전액 현금을 제안했으나 6월 추가 인상이 어렵다고 알려 왔습니다. 결국 6월 ADI가 $60(현금 $46 + ADI 주식 0.2321주)에 합의했고 7월 26일 계약이 서명됐습니다. 발표 가치는 약 148억 달러, 서명 전 주가 대비 프리미엄은 약 24%였습니다.", "거래는 2017년 3월 10일 완료됐고 린니어 주식은 나스닥에서 상장폐지됐습니다. ADI의 10-K에는 회계상 인수 대가가 약 157.6억 달러(현금 약 110.9억 달러, 주식 약 45.9억 달러)로 기재됐습니다. 발표 가치(148억)와 회계상 대가(157.6억)가 다른 이유는 주식 대가의 평가 시점이 다르기 때문입니다. 완료일 ADI 주가 $82.20을 적용하면 린니어 주주는 주당 약 $65를 받은 셈이고, 이는 케이스 시점(2003년 3월) 주가 $30.87의 약 2.1배입니다. 여기에 13년간의 배당 $11.75를 더하면 +149%, 연 6.8%(배당 재투자 미가정)로, 같은 기간 S&P500의 가격 상승(+180%, 연 7.7%)과 필라델피아 반도체지수(+235%)에 못 미쳤습니다. 잘 번 회사의 주주 수익이 시장 평균을 밑돈 이유는 케이스 시점의 높은 밸류에이션(FY2003 EPS 기준 PER 약 42배)과 2011년 이후의 성장 정체입니다.", "기업재무 관점에서 읽을 포인트는 세 가지입니다. 첫째, 첫 제안 거절은 협상 전술이었습니다. 10개월 뒤 17% 높은 가격을 받았고, 제3자 접촉으로 경쟁 입찰 구도를 만들었습니다. 둘째, 대가 구성이 주식 75%에서 현금 77%로 바뀌었습니다. 린니어 주주는 현금을 더 받았고 ADI는 그만큼 차입이 늘었습니다. 셋째, 이사회의 판단 근거는 ‘독자 경영 시 장기 가치 vs 지금 받을 수 있는 확실한 프리미엄’이었습니다. 성장이 정체된 회사에서는 후자가 이기기 쉽습니다."], "script": "2015년 여름 ADI가 찾아옵니다. 주당 51달러 50센트, 주식 위주 제안이었고 린니어 이사회는 심각한 저평가라며 거절했습니다. 이듬해 4월 58달러로 다시 왔고, 린니어는 제3의 회사까지 접촉해 경쟁 구도를 만든 뒤 6월에 60달러, 현금 46달러에 ADI 주식 0.2321주로 합의했습니다. 거래 가치 148억 달러, 프리미엄 약 24%. 2017년 3월 10일 완료와 함께 린니어는 상장폐지됐습니다.", "transition": "잘 벌던 회사가 왜 팔렸을까요. 세 가지 시대 배경이 있습니다.", "question": "린니어 주주는 결국 좋은 거래를 한 것인가?", "answer": "케이스 시점 주가 $30.87 대비 완료일 가치 약 $65(+111%), 13년 배당 $11.75를 합치면 +149%, 연 6.8%의 총수익입니다(재투자 미가정). 같은 기간 S&P500은 가격만으로 +180%(연 7.7%), 반도체지수는 +235%였으므로 시장을 밑돌았습니다. ‘잘 번 회사’와 ‘주가가 크게 오른 회사’는 다르며, 2003년의 높은 밸류에이션(PER 약 42배)과 2011년 이후의 성장 정체가 멀티플을 눌렀습니다. 다만 2016년 매각 프리미엄이 없었다면 더 낮았을 것입니다.", "extraQA": [{"q": "왜 ADI는 주식에서 현금 위주로 바꿨나?", "a": "린니어 이사회가 ADI 주가 변동 위험을 떠안기 싫어했고, 2016년의 초저금리에서 ADI는 싸게 빌릴 수 있었습니다. 현금 비중이 높을수록 린니어 주주에게는 확실한 가치, ADI에는 레버리지 상승(순부채/EBITDA 약 3.8배 전망)을 의미했습니다."}, {"q": "위임장의 ‘Reasons for the Merger’(합병 이유)는 확인했나?", "a": "이번 조사에서는 ‘Background of the Merger’(과정)까지 확인했고 ‘Reasons’ 절은 직접 읽지 못했습니다. 발표에서 이사회의 이유를 인용할 때는 과정에 기록된 표현(저평가 판단, 독자 경영 가치)을 쓰고, 공식 ‘이유’ 절은 추후 확인이 필요하다고 말하는 것이 정확합니다."}], "sourceIds": ["linear_defm14a", "linear_deal", "linear_close_value", "adi_10k_2017", "linear_tsr_calc", "fred_dgs10"]}, "coreTransition": "잘 벌던 회사가 왜 팔렸을까요. 세 가지 시대 배경이 있습니다."}, {"id": "p1-why", "part": "p1", "title": "왜 팔렸나: 세 가지 시대 배경", "subtitle": "회사 안의 문제가 아니라 회사 밖의 조건이 바뀌었다", "type": "cards", "core": true, "takeaway": "성장 정체 × 초저금리 × 규모의 경쟁. 이 셋이 겹치면 잘 버는 회사도 ‘지금 파는 것’이 최적이 된다", "sources": ["linear_defm14a", "linear_finance", "fed_history", "fred_dgs10", "adi_10k_2017", "icinsights_mna", "mckinsey_mna", "nxp_freescale", "broadcom"], "cards": [{"label": "① 성장의 무게중심 이동", "title": "잘 벌지만 더 크지 않았다", "stat": "FY2011→16 매출 −4%", "text": "산업의 성장은 모바일·클라우드·<br>AI 연산과 메모리로 이동", "detail": "아날로그는 안정적이지만 PC·스마트폰 사이클에 묶여 매출 정체. 독자 성장 전략의 기대가치가 작아지면 ‘확실한 프리미엄’이 이긴다", "accent": true}, {"label": "② 초저금리와 M&A 붐", "title": "빌리는 돈이 거의 공짜였다", "stat": "10년물 1.37%", "text": "2016년 7월 미 국채 사상 최저<br>2015년 반도체 M&A $107bn 사상 최대", "detail": "ADI는 2.5~4.5% 선순위채 $2.1bn + 텀론 $5bn + 브리지론으로 현금 $11.1bn을 마련. 거래 후 순부채/EBITDA 약 3.8배 전망. 싼 부채가 인수자의 지불 능력을 키웠다"}, {"label": "③ 규모와 통합의 경쟁", "title": "고객은 ‘한 공급자’를 원했다", "stat": "시너지 $150M/년", "text": "ADI 신호처리 + Linear 전력관리<br>자동차·산업 고객에 통합 제안", "detail": "TI–National(2011), NXP–Freescale(2015), ADI–Maxim(2021)로 이어진 아날로그 통합. 혼자 남으면 영업망·제품폭에서 밀린다"}], "study": {"paragraphs": ["첫째는 성장의 무게중심 이동입니다. 린니어의 매출은 FY2011 약 14.8억 달러를 정점으로 FY2016 약 14.2억 달러까지 5년간 오히려 줄었습니다. 영업이익률은 최고 수준이었지만 성장은 멈췄습니다. 같은 기간 반도체 산업 전체의 성장은 스마트폰·클라우드 서버·그리고 막 시작된 AI 연산으로 이동했고, 수혜는 퀄컴·TSMC·메모리·NVIDIA 쪽으로 갔습니다. 아날로그는 모든 전자기기에 들어가지만 그만큼 PC·휴대폰 같은 성숙 시장의 사이클에 묶여 있었습니다. 독자 경영으로 얻을 장기 성장의 기대가치가 작아질수록, 지금 받을 수 있는 확실한 프리미엄이 상대적으로 커집니다. 2015년 거절했던 이사회가 2016년 받아들인 배경입니다.", "둘째는 초저금리와 M&A 붐입니다. 미국 연준은 2008년 말부터 2015년 12월까지 정책금리를 사실상 0%로 유지했고 2016년 내내 0.25~0.50%였습니다. 싼 부채는 인수자의 지불 능력을 키웁니다. 2015년은 반도체 M&A가 사상 최대였던 해로, Avago의 Broadcom 인수(약 370억 달러), NXP의 Freescale 인수(약 118억 달러), Intel의 Altera 인수(약 167억 달러), Western Digital의 SanDisk 인수(약 190억 달러)가 잇달아 발표됐습니다. 미 10년물 국채는 2016년 7월 5일 1.37%로 사상 최저였고 Baa 회사채도 4.2%였습니다. ADI는 2016년 12월 쿠폰 2.5~4.5%의 선순위채 21억 달러를 발행하고 2017년 3월 완료일에 50억 달러 텀론과 41억 달러 브리지론을 받아 현금 대가 111억 달러를 치렀습니다. 거래 설명회에서는 순부채/EBITDA 약 3.8배를 예상했고 실제 FY2017 말 차입금은 78.5억 달러였습니다. IC Insights 집계로 2015년 반도체 M&A 발표 총액은 1,073억 달러, 2016년 998억 달러로 2010~14년 연평균(약 126억)의 8배였습니다. 금리가 높았다면 같은 가격을 제시하기 어려웠을 것입니다.", "셋째는 규모와 통합의 경쟁입니다. 자동차·산업용 고객은 센서 신호를 읽는 칩(ADI의 강점)과 전력을 관리하는 칩(린니어의 강점)을 한 공급자에게서 받고 싶어 합니다. ADI는 연 1.5억 달러의 비용 절감과 교차 판매를 내세웠고, 합병 후 매출 약 50억 달러의 아날로그 선도 기업이 된다고 설명했습니다. 이미 TI가 National Semiconductor를(2011), NXP가 Freescale을(2015) 인수했고, 뒤이어 ADI는 Maxim을(2021) 인수합니다. 통합의 물결 속에서 혼자 남는 회사는 영업망과 제품 폭에서 밀립니다. 맥킨지는 2016년 2월 보고서에서 이 물결의 이유를 ‘매출이 둔화되어 다른 성장원을 찾아야 하고, 고객은 한 회사에서 통합 솔루션을 사길 원하며, 각 거래가 다른 회사의 M&A를 부추긴다’고 요약했습니다. 린니어의 매각은 그 물결의 일부였습니다.", "정리하면, 린니어가 팔린 이유는 회사 안에 있지 않았습니다. 회사 밖의 세 조건, 즉 성장이 다른 곳으로 이동했고, 돈이 싸졌고, 산업이 통합됐다는 사실이 ‘지금 파는 것’을 최적의 선택으로 만들었습니다. 이것이 우리 발표의 핵심 전제입니다. 개별 기업의 재무 결정(배당, 자사주, 차입, 매각)은 산업의 흐름 위에서 내려집니다. 그래서 Part 2에서 그 흐름 전체를 봅니다."], "script": "왜 팔렸을까요. 첫째, 성장이 멈췄습니다. 2011년 이후 매출이 줄었고, 산업의 성장은 모바일·클라우드·AI로 이동했습니다. 둘째, 금리가 거의 0이었습니다. ADI는 110억 달러 현금을 빚으로 마련했고 2015년은 반도체 M&A 사상 최대의 해였습니다. 셋째, 고객이 통합을 원했습니다. 신호처리와 전력관리를 한 회사에서 사고 싶어 했고, TI·NXP·ADI가 차례로 경쟁사를 샀습니다. 회사 안이 아니라 회사 밖의 조건이 바뀐 겁니다.", "transition": "2015~2016년의 M&A 물결을 표로 보면 린니어가 예외가 아니었다는 점이 보입니다.", "question": "린니어가 독자 생존을 택했다면 어땠을까?", "answer": "가능했을 것입니다. 이익률이 높고 부채가 적어 망할 이유는 없었습니다. 다만 성장이 정체된 회사는 주가 멀티플이 낮아지고, 경쟁사들이 통합으로 규모를 키우면 고객 확보에서 불리해집니다. 이사회는 ‘혼자 가는 장기 가치’와 ‘지금의 24% 프리미엄’을 저울질해 후자를 택했습니다. 정답이라기보다 당시 조건에서의 합리적 선택입니다.", "extraQA": [{"q": "금리가 낮으면 왜 인수가 늘어나나?", "a": "인수자의 차입 비용이 낮아져 같은 현금흐름에 더 높은 가격을 지불할 수 있고, 할인율이 낮아 미래 시너지의 현재가치가 커집니다. 또 투자자들이 수익률을 찾아 회사채를 많이 사주므로 대규모 조달이 쉽습니다. 2015~2016년은 이 조건이 모두 갖춰진 시기였습니다."}, {"q": "교수님 영상에서 ADI가 망했다고 들었는데?", "a": "사실과 다릅니다. ADI는 2017년 린니어, 2021년 Maxim을 인수해 더 커졌고 2026년 8월에도 사상 최대 분기 실적을 발표했습니다. 아마 ‘린니어가 사라졌다’가 ‘인수자가 망했다’로 와전된 것으로 보입니다. 다음 장표에서 확인합니다."}], "sourceIds": ["linear_defm14a", "linear_finance", "fed_history", "fred_dgs10", "adi_10k_2017", "icinsights_mna", "mckinsey_mna", "nxp_freescale", "broadcom", "NATIONAL", "MAXIM"]}, "coreTransition": "린니어를 인수한 ADI는 어떻게 됐을까요."}, {"id": "p1-mna", "part": "p1", "title": "2011–2021년, 반도체 M&A의 시대", "subtitle": "발표 기준 거래 가치(개략) · 2015~16년이 정점 · 린니어는 이 물결의 한 조각이었다", "type": "table", "core": false, "takeaway": "성장이 둔화되고 돈이 싸지면 산업은 통합으로 답한다. 반도체도 예외가 아니었다", "sources": ["nxp_freescale", "broadcom", "linear_deal", "NATIONAL", "MAXIM", "icinsights_mna", "mckinsey_mna", "fed_history"], "headers": ["발표", "인수자 → 대상", "거래 가치", "분야", "결과"], "rows": [["2011.04", "TI → National Semiconductor", "약 $6.5bn", "아날로그", "2011.09 완료, 아날로그 통합의 시작"], ["2015.03", "NXP → Freescale", "약 $11.8bn", "자동차·MCU", "2015.12 완료"], ["2015.05", "Avago → Broadcom", "약 $37bn", "통신·네트워크", "2016.02 완료, Broadcom 사명 유지"], ["2015.06", "Intel → Altera", "약 $16.7bn", "FPGA", "2015.12 완료"], ["2015.10", "Western Digital → SanDisk", "약 $19bn", "NAND", "2016.05 완료"], ["2016.07", "ADI → Linear", "약 $14.8bn", "아날로그·전력", "2017.03 완료"], ["2016.07", "SoftBank → ARM", "약 $32bn", "설계 IP", "2016.09 완료"], ["2016.10", "Qualcomm → NXP", "약 $47bn(EV)", "모바일+자동차", "2018.07 중국 승인 불발로 무산"], ["2020.07", "ADI → Maxim", "약 $21bn(전액 주식)", "아날로그·전력", "2021.08 완료, 완료 시 주식 가치 약 $28bn"]], "note": "거래 가치는 발표 당시 보도 기준 개략치이며 부채 포함 여부가 거래마다 다름. IC Insights 집계 연간 발표 총액: 2015 $107.3bn(당시 사상 최대), 2016 $99.8bn, 2017 $27.7bn, 2020 $118bn(기록 경신: NVIDIA–ARM $40bn 무산, AMD–Xilinx $35bn).", "study": {"paragraphs": ["2015년은 반도체 산업 역사상 M&A가 가장 많이 발표된 해였습니다. 업계 집계로 발표 총액이 1,000억 달러를 넘어 그 전 몇 년치를 합친 것보다 컸습니다. 표의 거래들은 분야가 모두 다르지만 공통점이 있습니다. PC·스마트폰 성장이 둔화되면서 유기적 성장이 어려워졌고, 초저금리로 차입이 쉬웠으며, 고객(자동차·데이터센터)이 통합된 솔루션을 원했다는 점입니다.", "이 표의 쓰임새는 ‘린니어의 매각이 특별한 사건이 아니었다’는 것을 보여주는 데 있습니다. 같은 시기 ARM(설계 IP), Altera(FPGA), SanDisk(NAND), Freescale(자동차 MCU)이 모두 더 큰 회사에 편입됐습니다. 통합의 동기는 거래마다 다릅니다. Intel–Altera는 데이터센터용 이종 연산 확보, WD–SanDisk는 HDD 기업의 NAND 진출, Avago–Broadcom은 규모의 경제와 비용 절감이었습니다. ADI–Linear는 제품 보완(신호처리+전력)과 고객 통합이었습니다.", "Qualcomm–NXP 거래가 2018년 중국 당국의 승인 지연으로 무산된 것은 다음 시대(미중 갈등)의 복선입니다. 2016년까지의 M&A는 금융 조건이 결정했지만, 2018년 이후에는 정치가 거래의 성사를 좌우하기 시작했습니다. Part 2의 7번째 시기에서 다시 다룹니다.", "발표 시간이 부족하면 이 장표는 건너뛰고, 앞 장표의 둘째 카드(초저금리와 M&A 붐)에서 Avago–Broadcom 370억 달러 한 건만 언급해도 충분합니다."], "script": "같은 시기의 거래들을 보면 린니어는 예외가 아닙니다. 2015년 한 해에만 반도체 M&A가 1,000억 달러를 넘었습니다. Avago가 Broadcom을, Intel이 Altera를, WD가 SanDisk를 샀고, 이듬해 소프트뱅크가 ARM을 샀습니다. 성장이 둔화되고 돈이 싸지면 산업은 통합으로 답합니다.", "transition": "그렇다면 린니어를 산 ADI는 어떻게 됐을까요.", "question": "왜 하필 2015년에 몰렸나?", "answer": "세 조건이 동시에 성립했습니다. 스마트폰 성장률이 한 자릿수로 떨어져 유기적 성장이 어려웠고, 금리가 0%대라 회사채로 수백억 달러를 조달할 수 있었으며, 주가가 높아 주식 교환도 쉬웠습니다. 2016년 말 금리 인상이 시작되고 2018년 미중 갈등으로 승인이 어려워지자 대형 거래는 급감했습니다.", "sourceIds": ["nxp_freescale", "broadcom", "linear_deal", "NATIONAL", "MAXIM", "icinsights_mna", "mckinsey_mna", "fed_history"]}, "coreTransition": "린니어를 산 ADI는 어떻게 됐을까요."}, {"id": "p1-adi", "part": "p1", "title": "인수한 ADI는 건재하다 — 다만 ‘인수 성공’은 별개의 질문", "subtitle": "ADI는 린니어(2017)와 Maxim(2021)을 차례로 편입해 대형 아날로그 기업이 됐다", "type": "cards", "core": true, "takeaway": "‘사라졌다’와 ‘망했다’는 다르다. 린니어의 기술·공장·고객은 ADI 안에서 계속 돈을 벌고 있다", "sources": ["linear_close", "linear_finance", "MAXIM", "adi_current", "adi_10k_2017", "adi_q3fy26", "adi_dividend_2026", "adi_stock_2026"], "cards": [{"label": "2017–2020", "title": "통합과 부채 상환", "stat": "$7.85bn → $5.15bn", "text": "FY2017 말 차입금이 FY2020 $5.15bn으로<br>린니어의 현금흐름이 상환 재원이 됐다", "detail": "텀론 $5bn 중 $3.3bn을 1년 안에 상환. 배당을 고민하던 회사의 현금이 인수자의 빚을 갚는 데 쓰였다. 같은 현금, 다른 용도"}, {"label": "2021", "title": "Maxim 인수", "stat": "약 $21bn · 전액 주식", "text": "아날로그 3위권 Maxim까지<br>편입해 포트폴리오 확대", "detail": "2020.07 발표(Maxim 1주당 ADI 0.63주), 2021.08.26 완료, 완료 시 주식 가치 약 $28bn. 금리가 다시 낮아진 팬데믹기의 거래. 현금 대신 주식 교환"}, {"label": "2026", "title": "FY2016 $3.4bn → FY2025 $11.0bn", "stat": "Q3 FY26 +40%", "text": "분기 매출 $4.02bn, 영업이익률 40%(조정 50%)<br>TTM FCF $4.9bn · 22년 연속 배당 인상", "detail": "주가 $60.53(2016.07.25) → $406(2026.11.04), 약 6.7배. ‘인수자가 망했다’는 서술은 사실과 다름. 다만 인수 가격 대비 투자수익률은 별도 평가", "accent": true}], "study": {"paragraphs": ["먼저 사실관계입니다. Analog Devices는 린니어 인수 후 망하지 않았습니다. 매출은 FY2016 34억 달러에서 FY2025 110억 달러(FY2026 연환산 약 150억 달러)로, 순이익은 8.6억에서 22.7억 달러로 늘었습니다. 2021년 8월에는 아날로그 업계 3위권이던 Maxim Integrated를 약 210억 달러(완료 시 주식 가치 약 280억) 전액 주식 교환으로 인수했고, 2026년 회계연도 3분기에는 매출 40.2억 달러(+40%), GAAP 영업이익률 40%, TTM 잉여현금흐름 49억 달러를 기록했으며 2026년 2월 22년 연속 배당 인상을 발표했습니다. 주가는 2016년 7월 25일 60.53달러에서 2026년 11월 4일 406달러로 약 6.7배입니다. 린니어의 전력관리 제품군은 ADI 안에서 ‘Power by Linear’ 브랜드로 이어졌습니다(2022년 확인, 2026년 현재 사용 여부는 미확인). 혹시 수업이나 영상에서 ‘인수한 회사도 결국 망했다’는 말을 들었다면 그것은 ‘린니어가 사라졌다’가 와전된 것입니다.", "흥미로운 재무적 반전이 있습니다. 2003년 케이스에서 린니어의 문제는 ‘쌓이는 현금을 주주에게 얼마나 돌려줄까’였습니다. 2017년 이후 그 현금흐름은 ADI가 인수를 위해 빌린 차입금의 상환 재원이 됐습니다. ADI의 차입금은 FY2017 말 78.5억 달러에서 FY2018 63.3억(텀론 50억 중 33억 상환), FY2020 51.5억 달러로 줄었고, 대출 약정(covenant)은 총부채/EBITDA 4.5배에서 3.0배로 낮아지도록 설계됐습니다. 린니어의 연 5억 달러 안팎 순이익이 그 상환 재원이었습니다. 같은 현금이 배당의 재원이 되기도 하고, 전략적 인수의 상환 재원이 되기도 합니다. 자본배분에 고정된 정답이 없다는 뜻입니다.", "그러나 ‘ADI가 살아 있다’와 ‘인수가 성공했다’는 다른 질문입니다. 인수가 가치를 만들었는지는 지불한 가격(약 158억 달러)과 조달 비용에 비해 실제 추가 현금흐름과 시너지(약속한 연 1.5억 달러 비용 절감)가 충분했는지로 판단해야 합니다. 통합 비용, 핵심 인력 이탈, 영업권 상각도 고려 대상입니다. 이번 조사에서 ADI의 사업부별 린니어 기여분은 공개 자료로 분리되지 않으므로 ‘성공’을 단정하지 않고 ‘생존과 성장은 확인, 투자수익률은 별도 평가 필요’로 말하는 것이 정확합니다.", "Maxim 인수가 전액 주식이었다는 점도 시대를 반영합니다. 2016년 린니어 거래는 현금 77%(차입)였고, 2021년 Maxim 거래는 현금 0%였습니다. 팬데믹기에 ADI 주가가 높아 주식이 더 싼 화폐가 됐기 때문입니다. 인수 대가의 구성은 금리와 주가 수준, 즉 시대의 금융 조건이 결정합니다."], "script": "린니어를 산 ADI는 건재합니다. 2021년에는 Maxim까지 인수했고, 올해 8월에도 사상 최대 분기 실적을 발표했습니다. 재미있는 점은, 2003년에 배당을 고민하던 린니어의 현금흐름이 2017년 이후에는 ADI의 인수 차입금을 갚는 데 쓰였다는 겁니다. 같은 현금, 다른 용도. 다만 인수가 성공했는지는 지불한 가격 대비 수익으로 따로 평가해야 할 문제입니다.", "transition": "Part 1을 정리하겠습니다.", "question": "린니어 인수는 ADI 주주에게 이익이었나?", "answer": "확정적으로 말하기 어렵습니다. ADI는 규모와 제품 폭을 얻어 자동차·산업 시장에서 입지를 키웠고 이후 실적도 성장했습니다. 그러나 158억 달러의 대가와 조달 비용, 영업권 상각을 감안한 투자수익률은 공개 자료로 분리 계산되지 않습니다. ‘전략적 논리는 실현됐고 재무적 수익률은 별도 평가 필요’가 정확한 답입니다.", "extraQA": [{"q": "린니어의 공장과 경영진은 어떻게 됐나?", "a": "밀피타스(캘리포니아) Hillview 팹은 ADI가 2018년 ‘2~4년 내 폐쇄’를 밝혔고 FY2021에 생산을 종료해 매각 대상이 됐습니다. 워싱턴주 Camas 팹은 ADI의 내부 팹으로 유지되고 있습니다. 창업자 Robert Swanson은 인수 직후 ADI 이사회에 들어갔으나 2018년 주주총회까지 약 1년만 재임했고, CEO Lothar Maier의 이후 역할은 확인되지 않았습니다(변경통제 보상: Maier 약 $7.9M, Swanson 약 $10.6M, 위임장 기준). 세부 인력 변화는 이번 조사 범위 밖입니다."}], "sourceIds": ["linear_close", "linear_finance", "MAXIM", "adi_current", "adi_10k_2017", "adi_q3fy26", "adi_dividend_2026", "adi_stock_2026", "linear_defm14a"]}, "coreTransition": "Part 1을 정리하겠습니다."}, {"id": "p1-lesson", "part": "p1", "title": "Part 1 결론: 린니어는 실패하지 않았다, 시대가 바뀌었다", "subtitle": "개별 기업의 재무 결정은 산업의 흐름 위에서 내려진다", "type": "flow", "core": true, "takeaway": "그래서 다음 질문은 ‘린니어가 무엇을 잘못했나’가 아니라 ‘반도체 산업의 무게중심은 어떻게 움직여 왔나’다", "sources": ["CASE", "linear_defm14a", "VIDEO"], "nodes": [{"title": "2003 · 현금의 질문", "text": "투자처보다 현금이 많다<br>배당·자사주·보유"}, {"title": "2007 · 레버리지 환원", "text": "$3bn 자사주 매입<br>현금 + 전환사채"}, {"title": "2011– · 성장 정체", "text": "이익률 최고, 매출 제자리<br>성장은 모바일·AI로 이동"}, {"title": "2016 · 매각", "text": "초저금리 · 통합 경쟁<br>24% 프리미엄에 ADI로"}, {"title": "교훈", "text": "잘 버는 것 ≠ 계속 커지는 것<br>흐름이 결정을 만든다"}], "note": "이 흐름은 린니어만의 이야기가 아니다. 1980년 이후 반도체 산업에서 1위는 NEC → Intel → 삼성 → Intel → 삼성 → Intel → NVIDIA로 바뀌었고, 사라진 이름은 수십 개다.", "study": {"paragraphs": ["Part 1의 결론을 한 줄로 요약하면 ‘린니어는 실패하지 않았다, 시대가 바뀌었다’입니다. 2003년의 질문(현금을 어디에 쓸까)에 린니어는 배당 인상과 2007년의 차입 자사주 매입으로 답했고, 그 뒤에도 업계 최고 이익률을 유지했습니다. 그러나 2011년 이후 매출이 멈췄고, 성장의 무게중심은 모바일·클라우드·AI로 이동했으며, 초저금리와 통합 경쟁이 겹치면서 2016년 매각이 최적의 선택이 됐습니다.", "여기서 발표의 관점을 분명히 합니다. 기업재무 수업에서는 배당·자사주·차입·M&A 같은 개별 결정을 배웁니다. 그런데 린니어의 결말은 그 결정들의 잘잘못으로 설명되지 않습니다. 결정이 내려진 ‘무대’, 즉 산업의 흐름이 결과를 만들었습니다. 그래서 다음 질문은 ‘린니어가 무엇을 잘못했나’가 아니라 ‘반도체 산업의 무게중심은 어떻게 움직여 왔나’입니다. 이것이 Part 2로 넘어가는 다리입니다.", "청중에게 미리 줄 힌트: 1980년 이후 반도체 매출 1위는 NEC → Intel → 삼성 → Intel → 삼성 → Intel → NVIDIA로 바뀌었습니다. 1990년 Top10에 있던 일본 기업 6곳 중 지금 같은 이름으로 남은 곳은 없습니다. 린니어처럼 ‘사라진 이름’은 수십 개이고, 대부분 망한 것이 아니라 통합되거나 분리됐습니다. 순위가 바뀐 이유를 시대별로 보면, 지금 AI 시대를 읽는 틀이 생깁니다."], "script": "정리하면, 린니어는 실패하지 않았습니다. 2003년의 현금 질문에 배당 인상과 2007년 차입 자사주 매입으로 답했고, 끝까지 잘 벌었습니다. 다만 성장이 멈췄고, 돈이 싸졌고, 산업이 통합됐습니다. 개별 기업의 재무 결정은 산업의 흐름 위에서 내려집니다. 그래서 다음 질문은 ‘린니어가 뭘 잘못했나’가 아니라 ‘반도체 산업의 무게중심은 어떻게 움직여 왔나’입니다.", "transition": "Part 2, 1980년 이후 반도체 45년입니다.", "question": "케이스의 정답(배당 인상)과 이 결론은 모순되지 않나?", "answer": "모순되지 않습니다. 2003년 시점에서 배당 인상은 합리적이었고 실제로 린니어는 그렇게 했습니다. 우리 결론은 ‘그 결정이 틀렸다’가 아니라 ‘옳은 결정을 해도 산업의 흐름이 바뀌면 독립 기업으로 남지 못할 수 있다’는 것입니다. 재무 결정의 평가는 당시 조건에서, 기업의 운명은 산업의 흐름에서 읽어야 합니다.", "sourceIds": ["CASE", "linear_defm14a", "ranking_history"]}, "coreTransition": "Part 2, 1980년 이후 반도체 45년입니다."}, {"id": "p2-div", "part": "p2", "title": "1980년 이후 글로벌 반도체 산업의 변화", "type": "divider", "core": true, "lead": "린니어의 소멸은 사업 실패가 아니라 산업의 무게중심이 움직인 결과다. 반도체의 시작을 비유로 이해하고, 1980년 이후를 9개 시기로 나눠 거시 배경·기술·주도 기업·재무 특징을 같은 틀로 본다.", "sources": ["VIDEO", "WSTS", "ranking_history"], "study": {"paragraphs": []}}, {"id": "p2-analogy", "part": "p2", "title": "반도체를 비유로: 스위치의 도시", "subtitle": "전기 스위치 하나에서 시작해, 스위치 수백억 개를 손톱만 한 땅에 짓는 산업이 됐다", "type": "analogy", "core": true, "takeaway": "반도체 산업의 경쟁은 ‘같은 땅에 더 많은 스위치를 더 싸게 짓는’ 도시 건설 경쟁이다. 그래서 돈(자본)이 결정적이다", "sources": ["transistor", "kilby", "noyce", "moore1965", "micron_memory", "hbm_definition"], "items": [{"icon": "⏻", "term": "트랜지스터 (1947)", "as": "= 전기 스위치", "text": "전기를 켜고 끄는 아주 작은 스위치. 켜짐=1, 꺼짐=0. 모든 디지털 계산은 이 스위치의 조합이다."}, {"icon": "🏙", "term": "집적회로 (1958–59)", "as": "= 스위치를 모아 지은 도시", "text": "스위치를 하나씩 납땜하는 대신, 실리콘 한 조각 위에 수천·수억 개를 한꺼번에 ‘인쇄’한다. 이것이 ‘칩’이다."}, {"icon": "📐", "term": "무어의 법칙 (1965)", "as": "= 같은 땅에 2년마다 집을 2배", "text": "같은 면적에 스위치를 2배씩 더 넣으면 성능은 오르고 단가는 떨어진다. 이 규칙이 45년간 투자 경쟁의 룰이었다."}, {"icon": "🏗", "term": "팹 (공장)", "as": "= 수십억 달러짜리 도시 건설", "text": "집을 더 작게 지으려면 더 정밀한 장비가 필요하다. 최신 팹 한 곳이 $20bn을 넘는다. 먼저 짓는 쪽이 원가에서 이긴다."}, {"icon": "🧠📦", "term": "로직 / 메모리", "as": "= 공장·두뇌 / 창고", "text": "CPU·GPU는 계산하는 공장, DRAM·NAND는 데이터를 쌓는 창고. 창고는 규격이 같아 가격 경쟁이 심하고, 공장은 설계로 차별화한다."}, {"icon": "🎚", "term": "아날로그 (린니어)", "as": "= 통역사와 수도꼭지", "text": "빛·소리·온도 같은 현실 신호를 숫자로 바꾸고, 전기를 알맞게 흘려보낸다. 제품 수명이 길고 땅(공정) 경쟁이 덜하다."}], "note": "비유는 이해를 돕기 위한 것이며 기술적 정의가 아니다. HBM은 ‘GPU 공장 바로 옆에 창고를 고층으로 쌓고 도로를 넓힌 것’으로 Part 3에서 다시 설명한다.", "study": {"paragraphs": ["반도체의 출발점은 1947년 벨연구소의 트랜지스터입니다. 전기를 켜고 끄는 아주 작은 스위치이고, 켜짐과 꺼짐을 1과 0으로 쓰면 모든 계산을 스위치의 조합으로 만들 수 있습니다. 1958년 TI의 잭 킬비가 여러 소자를 한 조각에 집적한 회로를 시연했고, 1959년 페어차일드의 로버트 노이스가 양산에 적합한 평면 구조를 특허로 냈습니다. 스위치를 하나씩 납땜하는 대신 실리콘 한 조각 위에 수천, 수억 개를 한꺼번에 인쇄하는 것, 이것이 집적회로이자 우리가 ‘칩’이라 부르는 것입니다. 비유하면 스위치를 모아 지은 도시입니다.", "1965년 고든 무어는 같은 면적에 들어가는 소자 수가 매년(뒤에 2년마다) 두 배가 된다고 관찰했습니다. 같은 땅에 집을 2배씩 더 지으면 집값(단가)은 떨어지고 도시(성능)는 커집니다. 이 규칙이 45년간 산업의 룰이 됐습니다. 문제는 집을 더 작게 지으려면 더 정밀한 장비와 더 깨끗한 공장이 필요하고, 그 공장(팹)이 지금은 200억 달러를 넘는다는 점입니다. 먼저 짓는 쪽이 원가에서 이기고, 늦게 짓는 쪽은 비싼 공장을 놀리게 됩니다. 그래서 반도체 산업에서는 기술만큼 자본, 즉 누가 얼마를 어떤 조건으로 조달해 언제 투자하느냐가 결정적입니다. 기업재무 수업에서 이 산업을 보는 이유입니다.", "칩은 역할에 따라 나뉩니다. CPU·GPU 같은 로직 칩은 계산하는 공장(두뇌)이고, DRAM·NAND 같은 메모리는 데이터를 쌓아두는 창고입니다. 창고는 규격이 표준화되어 있어 누가 만들어도 비슷하므로 가격 경쟁이 극심하고 가격 사이클이 큽니다. 삼성·SK하이닉스·Micron의 이익이 해마다 크게 출렁이는 이유입니다. 공장(로직)은 설계와 소프트웨어 생태계로 차별화할 수 있어 Intel이 25년, NVIDIA가 지금 높은 이익률을 누립니다. 린니어가 만들던 아날로그 칩은 현실의 신호(빛·소리·온도·전압)를 숫자로 바꾸고 전기를 알맞게 흘려보내는 통역사이자 수도꼭지입니다. 제품 수명이 길고 공정 미세화 경쟁이 덜해 재투자 부담이 작았습니다. 케이스의 린니어에 현금이 쌓인 이유가 여기에 있습니다.", "발표에서는 여섯 카드를 30초 안에 읽습니다. 핵심 문장은 ‘반도체 산업의 경쟁은 같은 땅에 더 많은 스위치를 더 싸게 짓는 도시 건설 경쟁이고, 그래서 돈이 결정적이다’입니다. 청중이 반도체를 몰라도 이 한 문장으로 Part 2 전체를 따라올 수 있습니다."], "script": "반도체를 비유로 말씀드리면, 1947년에 발명된 트랜지스터는 전기 스위치입니다. 이 스위치를 실리콘 한 조각에 수억 개 한꺼번에 인쇄한 것이 칩, 스위치의 도시입니다. 무어의 법칙은 같은 땅에 2년마다 집을 두 배로 짓는 규칙이고, 그러려면 수백억 달러짜리 공장이 필요합니다. 그래서 이 산업은 기술 경쟁이면서 동시에 자본 경쟁입니다. 창고인 메모리는 가격 경쟁이 심하고, 두뇌인 로직은 설계로 차별화하며, 린니어의 아날로그는 현실과 디지털을 잇는 통역사입니다.", "transition": "이 스위치의 도시가 1980년 이전에 어떻게 산업이 됐는지 짧게 보고, 1980년 이후를 9개 시기로 나누겠습니다.", "question": "왜 반도체는 다른 제조업보다 자본이 더 중요한가?", "answer": "무어의 법칙을 따라가려면 세대마다 더 비싼 공장과 장비가 필요하고, 공장은 매출이 생기기 전에 먼저 지어야 하며, 늦게 지으면 원가에서 집니다. 투자 시점과 자본 조달 조건이 곧 경쟁력이고, 불황에 투자를 이어갈 재무 여력이 다음 호황의 점유율을 결정합니다.", "extraQA": [{"q": "메모리와 로직 중 어느 쪽이 더 좋은 사업인가?", "a": "좋고 나쁨이 아니라 다른 사업입니다. 메모리는 규격이 같아 가격이 순위와 이익을 흔들고(호황에 70% 이익률, 불황에 적자), 로직은 설계·생태계로 차별화해 이익률이 안정적이지만 플랫폼을 잃으면 급격히 무너집니다(Intel). 어느 쪽이든 다음 세대 투자를 감당할 자본이 필요합니다."}], "sourceIds": ["transistor", "kilby", "noyce", "moore1965", "micron_memory", "analog_technology"]}, "coreTransition": "이제 1980년 이후 45년을 한 장의 지도로 보겠습니다."}, {"id": "p2-origins", "part": "p2", "title": "1947–1980: 스위치에서 산업으로", "subtitle": "군수·우주 수요로 태어나 계산기·메인프레임·PC로 자랐다", "type": "timeline", "core": false, "takeaway": "초기 반도체의 고객은 정부(국방·우주)였고, 1970년대에 메모리와 마이크로프로세서가 민간 시장을 열었다", "sources": ["transistor", "kilby", "noyce", "intel_4004", "CHM", "samsung_history"], "events": [{"year": "1947", "title": "트랜지스터", "text": "벨연구소. 진공관을 대체할<br>작은 전자 스위치"}, {"year": "1958–59", "title": "집적회로", "text": "TI 킬비 · 페어차일드 노이스<br>여러 소자를 한 칩에"}, {"year": "1960s", "title": "국방·우주 수요", "text": "미니트맨 미사일·아폴로 유도컴퓨터가<br>초기 IC의 최대 고객"}, {"year": "1968–71", "title": "Intel · DRAM · CPU", "text": "1968 Intel 창업 · 1970 1103 DRAM<br>1971 4004 마이크로프로세서"}, {"year": "1974–83", "title": "한국의 진입", "text": "1974 한국반도체 인수(삼성)<br>1983 삼성 64K DRAM 개발"}, {"year": "1981", "title": "IBM PC", "text": "Intel 8088 + MS-DOS<br>개인용 컴퓨터 시장의 폭발", "accent": true}], "note": "연도는 발표·출시 기준. 1980년 세계 반도체 시장은 100억 달러대였고(SIA), 2025년 7,956억 달러(WSTS)가 됐다.", "study": {"paragraphs": ["반도체의 첫 고객은 정부였습니다. 1960년대 미국 국방부의 미니트맨 미사일과 NASA의 아폴로 유도컴퓨터가 초기 집적회로를 대량으로 샀고, 정부 수요 덕분에 단가가 떨어지면서 민간 시장이 열렸습니다. 산업의 출발부터 ‘국가의 돈’이 중요했다는 점은 2022년 CHIPS Act나 중국의 빅펀드를 이해할 때 다시 등장합니다.", "1968년 노이스와 무어가 Intel을 세웠고, 1970년 1103 DRAM, 1971년 4004 마이크로프로세서를 내놓았습니다. 메모리(창고)와 프로세서(두뇌)라는 두 시장이 이때 열렸습니다. Intel은 원래 메모리 회사였고 1985년에야 DRAM을 포기합니다. 한국은 1974년 삼성이 한국반도체를 인수하며 들어왔고, 1983년 이병철 회장의 ‘도쿄 선언’ 뒤 그해 64K DRAM을 개발해 미국·일본에 이어 세 번째 DRAM 생산국이 됐습니다.", "1981년 IBM PC는 Intel 8088과 마이크로소프트 DOS를 채택했습니다. 이 조합이 이후 30년 PC 산업의 표준이 됐고, 1992년부터 25년간 Intel이 1위를 지킨 출발점입니다. 1980년 세계 반도체 매출은 100억 달러대였는데 2025년에는 7,956억 달러가 됐습니다. 약 75배입니다. 이 장표는 시간이 없으면 건너뛰고, 비유 장표에서 ‘1947년 스위치, 1971년 CPU, 1981년 PC’ 세 연도만 말해도 됩니다."], "script": "반도체의 첫 고객은 미사일과 아폴로 우주선이었습니다. 1971년 Intel이 첫 마이크로프로세서를 내놓고, 1981년 IBM PC가 Intel 칩을 채택하면서 민간 시장이 폭발합니다. 한국은 1983년 삼성의 64K DRAM으로 세 번째 DRAM 생산국이 됐습니다.", "transition": "이제 1980년 이후를 지도로 보겠습니다.", "question": "왜 1980년을 기준으로 끊었나?", "answer": "1981년 IBM PC로 민간 대중 시장이 열렸고, 같은 시기 일본이 DRAM으로 미국을 추월하기 시작했으며, 교수님이 공유한 순위 영상도 1987년부터 시작합니다. 1980년 이전은 정부·메인프레임 수요의 시대, 이후는 PC·모바일·AI로 수요의 중심이 이동하는 시대입니다.", "sourceIds": ["transistor", "kilby", "noyce", "intel_4004", "intel_dram", "samsung_history"]}, "coreTransition": "이제 1980년 이후를 지도로 보겠습니다."}, {"id": "p2-map", "part": "p2", "title": "시대 지도: 40년 동안 매출은 30배, 1위는 7번 바뀌었다", "subtitle": "WSTS 세계 반도체 매출(1986–2025, 십억 달러)과 9개 시기 · 띠를 누르면 해당 시기로 이동", "type": "era_map", "core": true, "takeaway": "장기 추세는 성장이지만 빨간 막대(감소)가 8번 있다. 성장과 사이클이 함께 있는 산업이다", "sources": ["WSTS", "ranking_history", "gartner2017", "gartner2024", "gartner2025"], "study": {"paragraphs": ["지도의 막대는 WSTS가 집계한 세계 반도체 연간 매출입니다. 1986년 264억 달러에서 2025년 7,956억 달러로 약 30배가 됐습니다. 연평균 9% 성장입니다. 그러나 빨간 막대, 즉 전년보다 줄어든 해가 1996, 1998, 2001, 2008, 2009, 2012, 2019, 2023년으로 8번 있습니다. 특히 2001년은 −32%, 2009년 −9%, 2019년 −12%, 2023년 −8%였습니다. ‘장기 성장 산업’과 ‘매년 이익이 늘어나는 산업’은 다른 말입니다. 이 간격이 반도체 기업의 재무 위험이고, Part 3의 ‘사이클 vs 구조’ 논쟁의 뿌리입니다.", "위의 띠는 우리가 나눈 9개 시기입니다. 구분 기준은 두 가지입니다. 첫째, Gartner 기준 연간 반도체 매출 1위의 교체(NEC 1985~91 → Intel 1992~2016 → 삼성 2017~18 → Intel 2019~20 → 삼성 2021~22 → Intel 2023 → NVIDIA 2024~). 둘째, 수요의 중심 이동(PC → 인터넷 → 디지털 기기 → 모바일·클라우드 → AI)과 거시 충격(닷컴 붕괴, 금융위기, 팬데믹, 금리 급등). 교수님이 공유한 영상(1987~2026 순위)의 흐름과도 맞췄습니다. 시기 구분은 해석이므로 다른 구분도 가능합니다.", "발표에서는 이 장표에서 두 가지만 말합니다. ‘30배 성장했지만 8번 줄었다’와 ‘1위가 7번 바뀌었다’. 그리고 다음 장표(순위 레이스)로 넘어갑니다. 띠를 누르면 해당 시기 장표로 바로 이동하므로, 질의응답 때 특정 시기를 설명하라는 요청이 오면 여기로 돌아와 띠를 누르면 됩니다."], "script": "1986년부터 2025년까지 세계 반도체 매출입니다. 264억 달러에서 7,956억 달러, 30배가 됐습니다. 하지만 빨간 막대, 즉 매출이 줄어든 해가 여덟 번 있습니다. 2001년에는 3분의 1이 사라졌습니다. 그리고 이 기간 동안 매출 1위는 일곱 번 바뀌었습니다. 위의 아홉 개 띠가 오늘 이야기할 시기입니다.", "transition": "1위가 어떻게 바뀌었는지 순위 레이스로 먼저 보겠습니다.", "question": "매출이 30배 늘었다는 것은 물량이 30배라는 뜻인가?", "answer": "아닙니다. 달러 매출이므로 물량·가격·제품 구성이 모두 반영됩니다. 칩 개수와 트랜지스터 수는 그보다 훨씬 더 늘었고(단가 하락), 2017년이나 2025~26년처럼 메모리 가격이 급등한 해에는 물량보다 매출이 더 빨리 늘었습니다. 2026년 1~8월 누적은 이미 1조 달러를 넘어 연간 1.5조 달러 전망의 근거가 됐습니다.", "extraQA": [{"q": "왜 1986년부터인가?", "a": "WSTS 공개 월별 통계가 1986년부터 제공되기 때문입니다. 1980~85년은 SIA 연간 집계와 기업사 기록으로 보완했고, 시기 1 장표에서 별도로 설명합니다."}], "sourceIds": ["WSTS", "WSTS_FORECAST", "ranking_history", "gartner2025"]}, "coreTransition": "1위가 어떻게 바뀌었는지 순위 레이스로 먼저 보겠습니다."}, {"id": "p2-ranking", "part": "p2", "title": "순위 레이스: NEC → Intel → 삼성 → NVIDIA", "subtitle": "Gartner 반도체 공급업체 매출 Top10 · 대표 연도 스냅샷(1990·2000·2010·2017·2020·2024·2025)", "type": "ranking", "core": true, "takeaway": "수요의 중심이 이동하면 1위가 바뀐다. 1990년 Top10 중 지금 같은 이름으로 남은 일본 기업은 없다", "sources": ["ranking_history", "ranking_2017", "ranking_2020", "ranking_2024", "ranking_2025", "VIDEO"], "study": {"paragraphs": ["순위 차트는 Gartner 기준 반도체 공급업체의 연간 반도체 매출입니다. 회사 전체 매출이나 시가총액이 아니고, TSMC 같은 파운드리와 ASML 같은 장비사는 집계에 들어가지 않습니다. 교수님이 공유한 영상은 1987~2026년을 연속으로 보여주지만, 우리 차트는 출처를 확인한 대표 연도 7개의 스냅샷만 씁니다. 연도 사이의 움직임은 화면 전환이지 실제 데이터가 아닙니다. 2024년은 최종치, 2025년은 2026년 1월 발표 잠정치입니다.", "재생 버튼을 누르면 1990년부터 차례로 바뀝니다. 1990년에는 NEC·Toshiba·Hitachi·Fujitsu·Mitsubishi·Matsushita, 일본 기업 여섯 곳이 Top10에 있었고 Intel은 5위였습니다. 2000년에는 Intel이 295억 달러로 2위의 2.6배였고 삼성이 4위, 현대전자가 9위였습니다. 2010년에는 일본이 Renesas로 통합됐고 Qualcomm이 진입했습니다. 2017년에는 메모리 호황으로 삼성이 25년 만에 Intel을 제쳤고, 2020년 팬데믹 PC 수요로 Intel이 복귀했으며, 2024년 NVIDIA가 처음 1위, 2025년에는 1,257억 달러로 2위 삼성의 1.7배가 됐습니다. SK하이닉스는 HBM으로 3위입니다.", "순위가 바뀌는 원인은 네 가지로 나눌 수 있습니다. 판매 물량, 평균 판매가격, 고부가 제품 비중, 인수·분할에 따른 사업 범위 변화입니다. 메모리 가격이 오르면 물량 변화보다 매출 변화가 훨씬 커서 2017·2021년처럼 삼성이 1위가 되고, 내리면 2019·2023년처럼 Intel이 ‘덜 줄어서’ 1위가 됩니다. 그래서 1위를 ‘가장 좋은 회사’로 읽으면 안 됩니다. Intel은 2019년과 2023년 1위였지만 자기 매출은 줄었습니다.", "발표에서는 재생을 눌러 놓고 40초 동안 ‘일본 → Intel → 삼성 → NVIDIA’만 말합니다. 각 시대의 배경은 다음 장표들에서 설명합니다. 질문이 나오면 ‘순위에서 사라진 회사가 망한 것은 아니다, 대부분 통합되거나 이름이 바뀌었다’는 점을 강조하세요. 린니어처럼요."], "script": "재생을 눌러 보겠습니다. 1990년, 상위 10개 중 여섯 개가 일본 회사입니다. 2000년, PC·인터넷의 Intel이 2위의 2.6배입니다. 2010년, 일본은 통합되고 Qualcomm이 들어옵니다. 2017년, 메모리 가격이 오르자 삼성이 25년 만에 1위가 됩니다. 2020년 Intel이 돌아오고, 2024년 NVIDIA가 처음 1위, 2025년에는 2위의 1.7배가 됩니다. 수요의 중심이 PC에서 모바일로, AI로 이동할 때마다 1위가 바뀌었습니다.", "transition": "이제 각 시기를 같은 네 칸, 거시 배경·기술·주도 기업·재무 특징으로 읽겠습니다.", "question": "TSMC는 왜 순위에 없나?", "answer": "이 차트는 칩을 설계·판매하는 공급업체의 매출이고, TSMC는 그 칩을 위탁 제조하는 파운드리라 별도 집계입니다. 둘을 더하면 같은 칩의 매출이 두 번 잡힙니다. TSMC 2025년 매출은 1,224억 달러로 포함했다면 2위입니다. 순위에 없다고 중요하지 않은 것이 아니라, 범위가 다른 것입니다.", "extraQA": [{"q": "영상의 2026년 순위와 왜 다른가?", "a": "영상의 2026년은 추정치이고, 우리 자료는 2025년 잠정치까지만 씁니다. 2026년 연간 순위는 2027년 1월에 잠정 발표됩니다. 2026년 3분기 실적(삼성 DS 147조원, SK하이닉스 105조원)을 보면 메모리 기업의 순위가 더 오를 가능성이 큽니다."}], "sourceIds": ["ranking_history", "gartner2017", "gartner2019", "gartner2021", "gartner2023", "gartner2024", "gartner2025"]}, "coreTransition": "이제 각 시기를 같은 네 칸으로 읽겠습니다. 첫 시기는 일본의 시대입니다."}, {"id": "era1", "part": "p2", "title": "시기 1 · 1980–1985: 미국의 시대와 일본의 추격", "subtitle": "PC가 태어나고, 일본 DRAM이 미국을 추월했다", "type": "era", "core": false, "period": "1980–1985", "keyStat": {"value": "1985", "label": "NEC가 세계 반도체 매출 1위에 오른 해 · Intel은 DRAM 철수 선언"}, "highlight": [1980, 1985], "sideNote": "WSTS 연간 통계는 1986년부터 집계되어 막대가 비어 있다. 이 시기의 수치는 SIA·기업사 기록을 사용.", "takeaway": "고금리·강달러의 미국은 메모리에서 밀렸고, 은행 자본을 등에 업은 일본이 규모의 게임에서 이겼다", "sources": ["intel_dram", "nec", "japan", "ranking_history", "volcker", "plaza", "samsung_history"], "quad": {"macro": ["1979–82 볼커의 고금리(연 20%)·강달러 → 미국 제조업 압박", "일본: 통산성 주도 VLSI 프로젝트(1976–80)로 기술 추격", "1985 플라자합의: 엔화 절상 합의, 그러나 일본은 이미 1위", "1985 반도체 불황: 미국 메모리 업체 대거 철수"], "tech": ["IBM PC(1981)·매킨토시(1984): 개인용 컴퓨터 시장 탄생", "DRAM 64K → 256K, 일본 기업이 수율·품질로 우위", "Intel 8086·80286: 마이크로프로세서가 PC의 표준이 되다", "무어의 법칙이 투자 경쟁의 규칙으로 자리 잡음"], "leaders": ["TI·Motorola·Intel·National: 1980년 초 미국 상위권", "NEC·Hitachi·Toshiba·Fujitsu: DRAM으로 급부상, 1985 NEC 1위", "Intel 1985년 10월 DRAM 철수 → CPU 집중", "삼성 1983년 64K DRAM 개발로 진입(도쿄 선언)"], "finance": ["일본: 메인뱅크 차입·그룹 교차보조로 불황에도 증설", "미국: 고금리·주주 압박 속 메모리 투자 축소·철수", "메모리는 먼저 투자한 쪽이 원가를 낮추는 규모의 게임", "고금리는 자본집약 산업의 자본비용을 직격"]}, "study": {"paragraphs": ["1980년대 초 미국은 인플레이션을 잡기 위한 볼커 연준의 고금리(1981년 정책금리 연 20% 근접)와 강달러를 겪었습니다. 자본집약 산업인 반도체, 특히 공장을 계속 지어야 하는 메모리에는 치명적이었습니다. 반면 일본은 통산성이 주도한 VLSI 공동연구 프로젝트(1976~80)로 제조 기술을 축적했고, 메인뱅크 체제 아래 은행 차입과 그룹 내 교차보조로 불황에도 증설을 이어갔습니다. 64K·256K DRAM에서 일본 기업의 수율과 품질이 미국을 앞섰고, 1985년 NEC가 세계 반도체 매출 1위에 올랐습니다.", "같은 해 Intel은 DRAM 철수를 선언했습니다. 자기들이 만든 시장을 포기하고 마이크로프로세서에 집중한 것입니다. 1981년 IBM PC가 Intel 8088을 채택한 뒤 PC 시장이 폭발하고 있었고, 수익성이 낮은 메모리보다 설계로 차별화할 수 있는 CPU가 유리했습니다. 이 결정은 기업재무의 자본배분 결정 그 자체입니다. 매몰비용과 자부심이 아니라 앞으로의 수익률을 보고 사업의 무게중심을 옮긴 것입니다. 1985년의 반도체 불황으로 미국 메모리 업체 대부분이 철수했고, Micron만 살아남았습니다.", "한국은 이 시기에 들어왔습니다. 1983년 삼성 이병철 회장의 ‘도쿄 선언’ 뒤 그해 12월 64K DRAM을 개발해 미국·일본에 이어 세 번째 DRAM 생산국이 됐습니다. 1980년대 후반 내내 적자를 보면서도 재벌 자본으로 투자를 이어간 것이 1990년대 역전의 밑천이 됩니다. 재무적 교훈은 분명합니다. 메모리는 먼저 투자한 쪽이 원가를 낮추는 규모의 게임이고, 고금리 환경에서 주주 압박을 받는 미국 기업보다 은행과 그룹 자본을 쓸 수 있는 일본·한국 기업이 이 게임에 유리했습니다.", "1985년 9월 플라자합의로 엔화 절상이 시작됐지만, 반도체에서 일본은 이미 1위였습니다. 환율은 다음 시기의 배경이 됩니다. 발표 시간이 부족하면 이 장표는 건너뛰고 시기 2에서 ‘1985년 NEC 1위, Intel DRAM 철수, 삼성 진입’ 세 사실만 언급하세요."], "script": "1980년대 초 미국은 볼커의 고금리와 강달러로 제조업이 눌렸고, 일본은 정부 주도 연구와 은행 자본으로 DRAM을 키워 1985년 NEC가 세계 1위에 올랐습니다. 같은 해 Intel은 DRAM을 포기하고 CPU에 집중합니다. 그리고 1983년, 삼성이 64K DRAM으로 세 번째 DRAM 생산국이 됩니다. 메모리는 먼저 투자하는 쪽이 이기는 게임이었고, 자본의 조건이 승부를 갈랐습니다.", "transition": "그렇게 시작된 일본의 시대입니다.", "question": "일본이 이긴 것은 기술 때문인가, 자본 때문인가?", "answer": "둘 다입니다. VLSI 프로젝트로 제조 기술과 수율을 따라잡았고, 메인뱅크·교차보조라는 자본 구조가 불황기 증설을 가능하게 했습니다. 미국은 기술이 없어서가 아니라 고금리·주주 압박 아래 저수익 메모리 투자를 지속할 자본 조건이 없었습니다. Intel의 DRAM 철수가 그 증거입니다.", "sourceIds": ["intel_dram", "nec", "japan", "volcker", "plaza", "samsung_history"]}, "coreTransition": "그렇게 시작된 일본의 시대입니다."}, {"id": "era2", "part": "p2", "title": "시기 2 · 1986–1991: 일본의 시대", "subtitle": "버블 자금으로 DRAM을 지배했지만, 미국은 설계로, 대만은 파운드리로 다음 판을 준비했다", "type": "era", "core": true, "period": "1986–1991", "keyStat": {"value": "6 / 10", "label": "1990년 반도체 매출 Top10 중 일본 기업 수 (NEC·Toshiba·Hitachi·Fujitsu·Mitsubishi·Matsushita)"}, "rankYear": 1990, "highlight": [1986, 1991], "sideNote": "1990년 Top10은 Kamakura(2022)가 인용한 Gartner 표. Intel은 5위.", "takeaway": "1위의 조건(저리 자금·수율)은 버블과 함께 사라졌고, 1987년 TSMC의 파운드리 모델이 30년 뒤의 판을 바꿨다", "sources": ["nec", "japan", "ranking_history", "tsmc_foundry", "plaza", "intel_dram"], "quad": {"macro": ["플라자합의 이후 엔고·초저금리 → 일본 자산 버블(1989 정점)", "1986 미일 반도체협정: 덤핑 금지·미국산 점유 20% 목표", "1989 베를린 장벽, 1991 소련 해체: 냉전 종식과 세계화", "1990~ 일본 주가·부동산 버블 붕괴 시작"], "tech": ["DRAM 1M → 4M, 일본이 품질·수율 주도", "1987 TSMC 설립: 설계와 제조의 분리(파운드리) 시작", "미국은 CPU·설계로 선회: Intel 386(1985)·486(1989)", "1989 월드와이드웹 제안: 다음 수요의 씨앗"], "leaders": ["NEC 1985–91 연속 1위, 1990 Top10 중 일본 6곳", "Toshiba·Hitachi·Fujitsu·Mitsubishi·Matsushita 상위권", "Intel 5위(1990), TI·Motorola는 순위 하락", "삼성·현대·금성: 재벌 자본으로 DRAM 추격, 적자 감수"], "finance": ["반도체협정으로 DRAM 가격 상승 → 일본 기업 이익 급증", "버블 자금으로 공격적 증설, 1990년 이후 투자 여력 소진", "미국: 저수익 DRAM을 버리고 설계 이익률(CPU)로 전환", "한국: 차입 기반 투자, 1980년대 후반 누적 적자"]}, "study": {"paragraphs": ["플라자합의 이후 엔화가 급등했는데도 일본 반도체는 흔들리지 않았습니다. 일본은행이 엔고 불황을 막으려 금리를 낮추면서 주식·부동산 버블이 생겼고, 그 자금이 반도체 증설로 흘렀습니다. 1986년 미일 반도체협정은 일본의 덤핑을 금지하고 미국산 점유율 20%를 목표로 했지만, 역설적으로 DRAM 가격을 올려 일본 기업의 이익을 키웠습니다. 1990년 Top10에는 NEC·Toshiba·Hitachi·Fujitsu·Mitsubishi·Matsushita 여섯 곳이 있었고 NEC는 1985년부터 1991년까지 7년 연속 1위였습니다.", "그 사이 다음 판이 준비되고 있었습니다. 1987년 모리스 창이 대만에 TSMC를 세우고 ‘고객과 경쟁하지 않는 전업 파운드리’ 모델을 시작했습니다. 공장이 없어도 칩을 설계·판매할 수 있게 되면서 팹리스가 태어났고, 30년 뒤 NVIDIA·Qualcomm·AMD의 성장 조건이 됐습니다. 미국은 DRAM을 포기한 대신 CPU 설계에서 이익률을 찾았습니다. Intel 386·486이 PC의 표준이 됐고 1989년에는 웹이 제안됐습니다. 수요의 다음 중심(PC·인터넷)이 일본이 지배하던 메모리가 아니라 미국이 쥔 CPU 쪽에서 오고 있었습니다.", "재무적으로 일본의 강점은 곧 약점이 됐습니다. 버블이 꺼지자 메인뱅크의 대출 여력이 줄었고, 종합전자 기업 안에서 반도체는 여러 사업부 중 하나라 과감한 투자 결정이 늦었습니다. 1990년대 내내 일본 기업은 투자를 줄였고, 그 자리를 ‘적자를 감수하고 증설한’ 한국이 채웁니다. 1위의 조건이던 싼 자금과 수율 우위는 버블과 함께 사라졌습니다. 1위 기업은 당시 수요와 자본 조건에 가장 잘 맞았던 기업이지, 영원한 기업이 아닙니다.", "발표에서는 오른쪽의 1990년 Top5(NEC·Toshiba·Motorola·Hitachi·Intel)를 가리키며 ‘여섯 곳이 일본, 지금 같은 이름으로 남은 곳은 없다’고 말하고, 재무 칸의 첫 줄(협정이 오히려 일본 이익을 키웠다)과 셋째 줄(미국은 설계로 전환)을 읽습니다."], "script": "일본의 시대입니다. 플라자합의 뒤 저금리와 버블 자금이 반도체로 흘렀고, 미일 반도체협정은 오히려 DRAM 가격을 올려 일본의 이익을 키웠습니다. 1990년 상위 10개 중 6개가 일본 회사였습니다. 그런데 같은 시기 미국은 CPU 설계로, 대만은 1987년 TSMC의 파운드리로 다음 판을 준비했습니다. 그리고 1990년 버블이 꺼지면서 일본의 투자 여력은 사라집니다.", "transition": "다음 수요의 중심은 PC와 인터넷이었고, 그 수혜는 Intel과 한국 메모리에 돌아갑니다.", "question": "미일 반도체협정은 미국에 도움이 됐나?", "answer": "단기적으로는 일본 DRAM 가격을 올려 일본 기업 이익을 키웠고, 미국 PC 업체의 원가 부담을 늘렸습니다. 장기적으로는 일본의 증설을 억제하고 미국이 CPU·설계로 전환할 시간을 벌어줬다는 평가와, 한국 메모리의 진입 공간을 만들었다는 평가가 있습니다. 정부 개입의 효과는 의도와 다르게 나타날 수 있다는 사례입니다.", "extraQA": [{"q": "일본 반도체는 완전히 사라졌나?", "a": "아닙니다. NEC·Hitachi·Mitsubishi의 반도체는 Renesas로, Toshiba 메모리는 Kioxia로 이어졌고, 장비(도쿄일렉트론)·소재(신에츠·JSR)에서는 여전히 세계 상위입니다. 완성 칩 매출 순위에서 빠졌을 뿐 공급망의 다른 단계에 남아 있습니다. 2022년에는 정부 주도로 라피더스를 세워 2nm에 재도전하고 있습니다."}], "sourceIds": ["nec", "japan", "ranking_history", "tsmc_foundry", "renesas", "kioxia"]}, "coreTransition": "다음 수요의 중심은 PC와 인터넷이었고, 그 수혜는 Intel과 한국 메모리에 돌아갑니다."}, {"id": "era3", "part": "p2", "title": "시기 3 · 1992–1999: PC·인터넷과 한국 메모리", "subtitle": "Intel이 1위에 올라 25년을 지켰고, 삼성이 DRAM 1위가 됐으며, 한국은 외환위기를 겪었다", "type": "era", "core": true, "period": "1992–1999", "keyStat": {"value": "25년", "label": "Intel이 반도체 매출 1위를 지킨 기간(1992–2016, Gartner)"}, "rankYear": 2000, "highlight": [1992, 1999], "sideNote": "2000년 Top5: 닷컴 정점의 순위. Intel 295.7억 달러는 2위 Toshiba의 2.6배.", "takeaway": "수요의 중심이 PC로 오자 CPU를 쥔 Intel이 이겼고, 적자를 견디며 증설한 한국이 일본의 DRAM 자리를 차지했다", "sources": ["intel1992", "intel_pc", "hynix_lineage", "samsung_history", "NVIDIA_HISTORY", "japan"], "quad": {"macro": ["미국 장기 호황: IT 생산성·저물가·그린스펀, 1995 WTO 출범", "일본 ‘잃어버린 10년’, 엔고 지속(1995년 달러당 79엔)", "1997 아시아 외환위기: 한국 IMF 구제금융 → 빅딜 구조조정", "1999 닷컴 버블 정점: 나스닥 기술주 PER 100배"], "tech": ["Windows 95·웹 브라우저(1993–95): PC가 가정으로", "Pentium(1993)·‘Intel Inside’: CPU가 PC 가치의 중심", "DRAM 16M→64M→128M, 1996 DRAM 가격 폭락(공급 과잉)", "1993 NVIDIA 창업: 팹리스+파운드리 모델 확산"], "leaders": ["Intel 1992년 1위 등극, 2016년까지 25년 유지", "삼성 1992 DRAM 세계 1위(64M 최초 개발), 1993 메모리 1위", "현대·LG반도체 추격 → 1999 빅딜 통합(하이닉스의 모태)", "일본 후퇴: NEC·Toshiba 2–3위로, TI는 DRAM 매각(1998)"], "finance": ["Intel: CPU 독점 이익으로 자체 팹에 재투자(‘Copy Exactly’)", "한국: 차입 기반 투자 → 외환위기로 구조조정·빅딜", "1996 DRAM 폭락 → 메모리 업체 적자, 그래도 증설 지속", "기술주 멀티플 급등: 1999년 반도체 IPO·M&A 러시"]}, "study": {"paragraphs": ["1992년 Intel이 세계 반도체 매출 1위에 올랐습니다. 인터넷 붐보다 앞선 시점입니다. PC가 기업 업무 도구에서 가정용 기기로 보급되고, 1993년 Pentium과 ‘Intel Inside’ 마케팅으로 CPU가 PC 가치의 중심이 되면서입니다. 1995년 Windows 95와 웹 브라우저가 더해지자 PC를 사거나 바꿀 이유가 늘었고, 인터넷 서버와 통신 장비도 칩을 필요로 했습니다. Intel은 CPU 독점 이익을 자체 팹에 재투자하는 선순환(공정 선도 → 성능 우위 → 가격 결정력)을 만들었고 이것이 25년 1위의 구조였습니다.", "한국 메모리는 이 시기에 일본을 제쳤습니다. 삼성은 1992년 64M DRAM을 세계 최초로 개발하고 그해 DRAM 세계 1위, 1993년 메모리 전체 1위가 됐습니다. 1980년대 후반의 적자를 견디며 증설을 멈추지 않은 결과였습니다. 일본은 버블 붕괴로 투자를 줄였고 PC용 범용 DRAM에서 밀렸습니다. 그러나 메모리의 재무 위험은 그대로였습니다. 1996년 공급 과잉으로 DRAM 가격이 폭락해 16M DRAM 가격이 1년 새 5분의 1 토막이 났고 메모리 업체들은 적자를 냈습니다. 1997년 아시아 외환위기로 차입 기반으로 투자해 온 한국 재벌의 약점이 드러났고, 1999년 정부 주도 빅딜로 현대전자가 LG반도체를 흡수했습니다. 이것이 2001년 하이닉스의 모태입니다.", "같은 시기 미국에서는 팹리스가 자랐습니다. 1993년 NVIDIA가 창업했고, 공장 없이 설계만 하는 회사들이 TSMC·UMC에 제조를 맡기며 성장했습니다. TI는 1998년 DRAM 사업을 Micron에 넘기고 DSP·아날로그로 전환했습니다. 1999년 닷컴 정점에서 기술주 멀티플이 급등했고 반도체 IPO·M&A가 쏟아졌습니다. 2000년 순위(오른쪽)는 이 열기의 정점입니다. Intel 295.7억 달러, 삼성 4위, 현대전자 9위. 그리고 이듬해 산업 매출은 32% 줄어듭니다.", "재무 칸의 교훈은 두 가지입니다. 첫째, 독점에 가까운 이익률을 다음 세대 공장에 재투자하는 회사(Intel)는 오래 1위를 지킵니다. 둘째, 메모리는 ‘적자를 감수한 증설’이 점유율을 가져오지만, 그 자금이 단기 차입이면 외환위기 같은 충격에 무너집니다. 한국이 빅딜을 겪고도 살아남은 것은 삼성의 그룹 자본과 하이닉스의 채권단 지원이라는 ‘버티는 돈’ 덕분이었습니다."], "script": "1992년 Intel이 1위가 됩니다. PC가 가정으로 들어오고 CPU가 PC 가치의 중심이 됐기 때문이고, 이 자리를 25년 지킵니다. 같은 해 삼성이 DRAM 세계 1위가 됩니다. 80년대 적자를 견디며 증설한 결과입니다. 하지만 1996년 DRAM 가격이 폭락하고 1997년 외환위기가 오면서 차입으로 투자해 온 한국의 약점이 드러났고, 1999년 빅딜로 현대와 LG반도체가 합쳐집니다. 오른쪽 2000년 순위가 닷컴 열기의 정점이고, 이듬해 매출은 3분의 1이 사라집니다.", "transition": "닷컴 붕괴, 그리고 린니어 케이스의 시점인 2003년이 속한 시기입니다.", "question": "Intel은 인터넷 덕에 1위가 됐나?", "answer": "아닙니다. Intel은 인터넷 붐 이전인 1992년에 이미 1위였습니다. PC 보급으로 확보한 지위를 1995년 이후 인터넷 수요가 강화했다고 말하는 것이 정확합니다. 새 서비스가 유행하면 ‘그 서비스가 쓰이는 기기에 어떤 칩이 필요한가’를 따라가면 수혜 기업이 보입니다.", "extraQA": [{"q": "삼성은 어떻게 일본을 이겼나?", "a": "세 가지입니다. 그룹 자본으로 1980년대 후반 적자를 견디며 증설했고(일본은 버블 붕괴로 투자 축소), PC용 범용 DRAM에 집중해 양산 속도를 높였으며, 원화 약세와 미일 협정으로 가격 여건이 유리했습니다. 기술 추격과 자본 조건, 환율이 함께 작용했습니다."}], "sourceIds": ["intel1992", "intel_pc", "hynix_lineage", "samsung_history", "japan", "NVIDIA_HISTORY"]}, "coreTransition": "닷컴 붕괴, 그리고 린니어 케이스의 시점인 2003년이 속한 시기입니다."}, {"id": "era4", "part": "p2", "title": "시기 4 · 2000–2007: 닷컴 붕괴와 디지털 기기", "subtitle": "사상 최악의 불황 뒤, 휴대폰·MP3·디카가 수요를 넓혔고 현금이 쌓인 기업은 환원을 택했다", "type": "era", "core": false, "period": "2000–2007", "keyStat": {"value": "−32%", "label": "2001년 세계 반도체 매출 증감률(WSTS) · 2,044억 → 1,390억 달러"}, "highlight": [2000, 2007], "sideNote": "2003년 4월 린니어 케이스의 시점. Fed 금리 1%, 현금 $1.5bn, 배당 인상 논의.", "takeaway": "불황 뒤 현금이 쌓인 성숙 기업(린니어·TI·Intel)은 환원과 차입 자사주를 택했고, 저금리는 LBO와 치킨게임의 씨앗을 뿌렸다", "sources": ["wsts", "intel2001", "sia2007", "samsung2006", "CASE", "linear_10k_2007", "cuda", "fed_history"], "quad": {"macro": ["2000 닷컴 붕괴·2001 9·11 → Fed 금리 1%(2003) 초저금리", "2001 중국 WTO 가입: 세계의 공장, 전자제품 생산 이전", "저금리 → 미국 주택 붐, 2007 서브프라임 균열", "2003년 4월: 린니어 케이스의 시점"], "tech": ["2001 산업 매출 −32%: 사상 최악의 반도체 불황", "MP3·디지털카메라·LCD TV·휴대폰 → NAND 수요 폭발", "2007 iPhone: 모바일 시대의 문을 열다", "300mm 웨이퍼·듀얼코어(2006)·CUDA(2006) 등장"], "leaders": ["Intel 1위 지속, 삼성 2위 정착(2002~), NAND 1위", "TI: DSP·아날로그 전환, 린니어·Maxim·ADI 고수익 아날로그", "TSMC 파운드리 확대, Qualcomm 모바일 모뎀 성장", "Elpida(NEC+Hitachi DRAM)·Qimonda(2006 분사)·하이닉스 채권단 관리"], "finance": ["불황 뒤 현금 축적 → 배당·자사주(린니어 2007 ASR $3bn, 전환사채)", "저금리 LBO 붐: Freescale $17.6bn(2006), Avago(2005)", "메모리: 2007 비트 출하 2배인데 매출 −7% → 치킨게임 전조", "SOX 지수는 2000년 고점을 회복 못함: 성장산업 ≠ 주가"]}, "study": {"paragraphs": ["2000년 닷컴 붕괴는 주가만의 문제가 아니었습니다. 고객 기업의 IT 투자 축소와 전자제품 수요 둔화가 주문 감소로 이어졌고, 이미 늘려 놓은 생산능력과 재고를 줄이는 데 시간이 걸리면서 2001년 세계 반도체 매출은 2,044억 달러에서 1,390억 달러로 32% 줄었습니다. 역사상 최악의 해입니다. Intel의 2001년 매출도 21% 감소했지만 Intel은 그 와중에 300mm 웨이퍼와 미세공정에 투자를 계속했습니다. 불황에 투자하는 회사가 다음 호황을 가져간다는 규칙의 사례입니다.", "Fed는 2003년 정책금리를 1%까지 내렸고, 이 저금리는 미국 주택 붐과 함께 반도체 기업의 자본배분도 바꿨습니다. 2003년 4월이 바로 린니어 케이스의 시점입니다. 불황에도 현금이 15억 달러 넘게 쌓인 린니어는 배당 인상을 논의했고, 2007년에는 30억 달러 자사주 매입을 현금 13억과 전환사채 17억으로 집행했습니다. TI·Intel도 대규모 자사주 매입에 나섰습니다. 성숙 기업의 ‘환원의 시대’였습니다. 같은 저금리는 사모펀드의 LBO 붐을 낳아 2006년 Freescale이 176억 달러에, 2005년 Agilent 반도체 사업(뒤의 Avago, 지금의 Broadcom)이 KKR·실버레이크에 팔렸습니다. 2015년 M&A 붐의 주역 Avago가 이때 태어났습니다.", "수요 쪽에서는 PC 밖의 디지털 기기가 자랐습니다. SIA에 따르면 2007년까지 반도체 매출은 6년 연속 증가해 2,556억 달러에 이르렀고, 휴대폰·MP3 플레이어·디지털카메라·LCD TV가 성장을 이끌었습니다. 이 기기들은 전원을 꺼도 데이터를 보관하는 NAND 플래시를 필요로 했고 삼성이 2002년부터 NAND 1위가 됐습니다. 2007년 iPhone이 나오면서 다음 시대의 문이 열렸고, 2006년 NVIDIA의 CUDA는 15년 뒤 AI의 토대가 됩니다. 그러나 메모리의 재무 위험은 여전했습니다. 2007년 DRAM 비트 출하는 거의 두 배였지만 가격 하락으로 매출은 7.4% 줄었습니다. 모두가 증설하는 치킨게임의 전조였습니다.", "일본의 재편도 이 시기입니다. NEC와 Hitachi의 DRAM이 1999년 Elpida로 합쳐졌고, Infineon은 2006년 메모리 사업을 Qimonda로 분사했으며, 하이닉스는 2001~02년 채권단 관리에 들어갔습니다. 세 회사 모두 다음 시기의 치킨게임에서 운명이 갈립니다. 발표에서는 ‘2001년 −32%, 2003년 케이스, 2007년 린니어의 차입 자사주, 그리고 치킨게임의 전조’ 네 가지를 말하면 됩니다."], "script": "2001년 반도체 매출은 32% 줄었습니다. 사상 최악의 불황입니다. Fed는 금리를 1%까지 내렸고, 이 시점이 바로 우리 케이스, 2003년 4월입니다. 불황에도 현금이 쌓인 린니어는 배당을 올렸고, 2007년에는 빚을 내 30억 달러 자사주를 샀습니다. 같은 저금리가 사모펀드의 LBO 붐을 낳았고, 수요 쪽에서는 휴대폰·MP3·디카가 NAND를 키웠습니다. 그러나 2007년 DRAM은 물량이 두 배인데 매출이 줄었습니다. 치킨게임의 전조입니다.", "transition": "그 치킨게임이 금융위기와 겹친 시기입니다.", "question": "2000년대 중반 반도체는 부동산에 밀려 소외됐나?", "answer": "주식시장에서는 그랬습니다. SOX 지수는 2000년 고점을 2017년까지 회복하지 못했습니다. 그러나 산업 매출은 2007년까지 6년 연속 증가했습니다. ‘주가가 부진했다’와 ‘산업이 성장하지 않았다’는 다른 말입니다. 이 시기의 핵심은 성숙 기업의 현금 환원과 저금리 LBO, 그리고 디지털 기기로의 수요 확산입니다.", "sourceIds": ["wsts", "intel2001", "sia2007", "samsung2006", "CASE", "linear_10k_2007", "fed_history"]}, "coreTransition": "그 치킨게임이 금융위기와 겹친 시기입니다."}, {"id": "era5", "part": "p2", "title": "시기 5 · 2008–2012: 금융위기와 치킨게임", "subtitle": "모두가 증설하자 가격이 무너졌고, 현금과 만기가 생사를 갈랐다", "type": "era", "core": true, "period": "2008–2012", "keyStat": {"value": "−9% → +32%", "label": "세계 반도체 매출 2009년 급락 → 2010년 반등(WSTS) · 2009 Qimonda 파산, 2012 Elpida 회생신청"}, "rankYear": 2010, "highlight": [2008, 2012], "sideNote": "2010년 Top5: 반등의 해. 일본은 Renesas로 통합, Hynix 6위, Qualcomm 9위 진입.", "takeaway": "기술이 있어도 장기 투자와 단기 상환의 시간을 맞추지 못하면 무너진다. 삼성은 불황에 투자해 점유율을 가져갔다", "sources": ["fed_crisis", "sia2010", "elpida_failure", "elpida_causes", "elpida_bonds", "qimonda", "renesas", "NATIONAL", "hynix_lineage"], "quad": {"macro": ["2008 리먼 파산 → 2009 세계 경기침체, 반도체 매출 −9%", "Fed 제로금리(2008.12)·양적완화: 이후 7년간 0% 시대", "2010 매출 +31.8% 급반등, 2011 동일본 대지진·태국 홍수", "엔고(2011년 달러당 75엔)·유럽 재정위기"], "tech": ["스마트폰 본격화: 2008 앱스토어, 2010 갤럭시S·iPad", "DRAM 치킨게임(2007–09): 모두 증설, 가격 폭락", "TSMC 28nm 독주(2011~), Apple A4 자체 설계(2010)", "클라우드 태동: AWS 성장, 서버 메모리 수요 시작"], "leaders": ["Intel 1위·삼성 2위 고착, Qualcomm Top10 진입(2010)", "2009 Qimonda 파산, 2012 Elpida 회생신청 → 2013 Micron 인수", "2010 Renesas(NEC+Renesas) 통합, 2011 TI–National 인수", "2012 하이닉스 SK그룹 편입(3.4조원): 메모리 3강 체제로"], "finance": ["승부처는 현금과 만기: Elpida는 엔고·가격 폭락·사채 만기에 무너짐", "삼성: 2008–09 적자에도 투자 지속 → 위기 후 점유율 확대", "하이닉스: 채권단 관리 끝에 전략적 인수자(SK)로", "제로금리가 2010년대 M&A와 성장주 멀티플의 토대가 됨"]}, "study": {"paragraphs": ["2007년부터 DRAM 업체들은 서로 증설을 멈추지 않았습니다. 생산을 늘려 단가를 낮추려는 각 기업의 합리적 행동이 산업 전체로는 공급 과잉과 가격 폭락을 만들었습니다. 여기에 2008년 리먼 파산과 2009년 세계 경기침체가 겹쳤습니다. 반도체 매출은 2009년 9% 줄었고(2001년보다는 덜했지만), 자본력이 약한 쪽부터 무너졌습니다. Infineon에서 분사된 Qimonda는 2009년 1월 지급불능을 신청했고, 일본 유일의 DRAM 업체 Elpida는 2012년 2월 27일 도쿄지방법원에 회사정리를 신청했습니다. Elpida의 공시는 엔화 강세, DRAM 가격 하락, 태국 홍수에 따른 수요 부진을 사유로 들었고 같은 날 사채와 전환사채의 기한이익 상실(즉시 상환 의무)도 공시했습니다.", "Elpida의 사례가 기업재무에서 중요한 이유는 ‘기술이 있어도 망할 수 있다’는 점 때문입니다. Elpida는 모바일 DRAM 기술이 있었습니다. 문제는 시간이었습니다. 공장 투자는 장기이고 회수는 수년 뒤인데, 차입의 만기는 짧았습니다. 가격 하락기에 영업현금이 줄고 만기가 닥치면 금융계약이 즉각적인 상환 압박으로 바뀝니다. 반면 삼성은 2008~09년 반도체 적자에도 투자를 줄이지 않았고, 위기가 끝난 뒤 경쟁사가 빠진 자리를 차지했습니다. 하이닉스는 2001년부터 채권단 관리를 받다가 2012년 SK그룹에 3.4조원에 인수되면서 ‘버티는 돈’을 얻었습니다. 메모리 3강(삼성·SK하이닉스·Micron) 체제는 이 시기의 결과입니다.", "거시적으로는 Fed가 2008년 12월 정책금리를 사실상 0%로 내리고 양적완화를 시작했습니다. 이 제로금리가 2015년 말까지 7년간 이어지면서 다음 시기(2013~16)의 M&A 붐과 성장주 멀티플의 토대가 됩니다. 2010년 매출은 31.8% 반등했는데, 낮아진 전년 기저와 스마트폰(2008 앱스토어, 2010 갤럭시S·iPad)이라는 새 수요가 겹친 결과였습니다. 2010년에는 Apple이 A4로 자체 칩 설계를 시작했고, TSMC는 28nm로 파운드리 독주를 시작했습니다. 일본은 2010년 NEC 일렉트로닉스와 Renesas를 합쳐 Renesas Electronics를 만들었고, 미국에서는 2011년 TI가 National Semiconductor를 인수해 아날로그 통합의 첫 장을 열었습니다.", "이 시기의 재무 교훈은 Part 3과 직결됩니다. 경기 저점에서 봐야 할 것은 장부상 이익이 아니라 현금성 자산, 차입 만기, 이자 부담, 약정(covenant)입니다. 그리고 모두가 증설하는 치킨게임은 자본력이 강한 쪽에 유리합니다. 2026년 빅테크의 AI 투자 경쟁이 ‘치킨게임’이라 불리는 이유와, 그 승부를 가를 지표가 무엇인지는 Part 3에서 다룹니다."], "script": "2007년부터 DRAM 업체들은 모두 증설했고 가격이 무너졌습니다. 거기에 금융위기가 겹쳤습니다. 2009년 Qimonda가, 2012년 Elpida가 쓰러집니다. Elpida는 기술이 있었습니다. 문제는 엔고와 가격 폭락 속에 사채 만기가 닥쳤다는 것입니다. 반면 삼성은 적자에도 투자를 계속해 점유율을 가져갔고, 하이닉스는 SK라는 버티는 돈을 만났습니다. 이렇게 메모리 3강이 완성됩니다. 그리고 2008년 12월 시작된 제로금리가 다음 시대의 M&A 붐을 준비합니다.", "transition": "제로금리 아래 모바일·클라우드가 자라고, 린니어가 팔린 시기입니다.", "question": "치킨게임에서 이긴 쪽은 무엇이 달랐나?", "answer": "현금과 자본 조달력입니다. 삼성은 그룹의 현금으로, 하이닉스는 채권단과 SK의 자본으로 불황기 투자를 이어갔고, Micron은 Elpida를 싸게 인수해 규모를 키웠습니다. Qimonda·Elpida는 기술이 아니라 만기를 버틸 유동성이 없었습니다. 치킨게임의 승자는 가장 기술이 좋은 회사가 아니라 가장 오래 버틸 수 있는 회사입니다.", "extraQA": [{"q": "2010년 31.8% 성장은 정상 성장률인가?", "a": "아닙니다. 2009년 급락의 기저효과와 스마트폰 신수요가 겹친 반등입니다. 위기 직후의 높은 성장률을 매년의 정상 성장률로 가정하면 과잉 투자로 이어집니다. 2010년 이후 2012년까지 매출은 다시 정체됐습니다."}], "sourceIds": ["fed_crisis", "sia2010", "elpida_failure", "elpida_causes", "elpida_bonds", "elpida_acquisition", "qimonda", "hynix_lineage", "NATIONAL"]}, "coreTransition": "제로금리 아래 모바일·클라우드가 자라고, 린니어가 팔린 시기입니다."}, {"id": "era6", "part": "p2", "title": "시기 6 · 2013–2016: 모바일·클라우드·저금리 M&A", "subtitle": "스마트폰과 클라우드가 실제 주문을 만들었고, 공짜 돈이 산업을 통합했다", "type": "era", "core": true, "period": "2013–2016", "keyStat": {"value": "$100bn+", "label": "2015년 발표된 반도체 M&A 총액(업계 집계) · 사상 최대 · 린니어 매각은 2016년"}, "highlight": [2013, 2016], "sideNote": "Intel 1위 유지. 2015년 11월 Fed 첫 인상 직전까지 7년간 정책금리 0%.", "takeaway": "성장은 모바일·클라우드로 이동했고, 성장이 멈춘 성숙 기업은 싼 부채를 쓴 인수자에게 팔렸다. 린니어가 그 전형이다", "sources": ["fed_history", "qualcomm2013", "tsmc2013", "nxp_freescale", "broadcom", "linear_deal", "bigfund3", "hbm_definition", "cuda"], "quad": {"macro": ["제로금리 지속, 2015.12 첫 인상(0.25–0.50%)", "아베노믹스 엔저(2013~), 유가 폭락(2014–16)", "중국 ‘반도체 굴기’: 2014 빅펀드 1기 1,387억 위안, 2015 중국제조 2025", "2016 브렉시트·트럼프 당선: 세계화의 역풍 시작"], "tech": ["스마트폰 연 14억 대(2015): 모바일 AP·모뎀·메모리 수요", "클라우드 데이터센터 본격화(AWS·Azure): 서버 DRAM·SSD", "딥러닝 돌파: 2012 AlexNet(GPU), 2016 알파고 → AI 수요의 씨앗", "FinFET(14/16nm)·3D NAND(2013)·HBM 1세대(2013 SK하이닉스)"], "leaders": ["Intel 1위 유지, 삼성·SK하이닉스·Micron 메모리 3강", "Qualcomm·MediaTek 모바일, TSMC는 Apple 수주로 독주", "NVIDIA 데이터센터 GPU 시작(2016 P100)", "린니어 매출 정체 → 2016 ADI에 매각, Avago–Broadcom 합병"], "finance": ["2015 반도체 M&A 사상 최대: 싼 부채가 인수 가격을 올림", "자사주 매입 전성기(Apple·Qualcomm·TI): 성장 정체 기업의 환원", "메모리 3강 과점 → 치킨게임 완화, 이익 안정", "중국 국가자본 등장: 칭화유니의 Micron 인수 시도(2015, $23bn) 무산"]}, "study": {"paragraphs": ["이 시기를 ‘초저금리 덕에 성장주가 올랐다’로만 설명하면 절반입니다. 금리는 할인율과 자금조달을 설명하고, 매출은 실제 주문이 설명합니다. 실제 주문을 만든 것은 스마트폰과 클라우드였습니다. 2015년 스마트폰은 연 14억 대가 팔렸고, Qualcomm의 FY2013 모뎀 칩 출하는 7억 1,600만 개로 21% 늘었으며, TSMC는 2013년 보고서에서 모바일이 매출의 36% 이상이라고 밝혔습니다. AWS·Azure 같은 클라우드 데이터센터가 서버 CPU와 DRAM·SSD를 사들이기 시작했습니다. 2012년 AlexNet이 GPU로 딥러닝의 가능성을 보였고 2016년 알파고가 세상을 놀라게 했으며, 같은 해 NVIDIA는 데이터센터용 P100을 내놓았습니다. AI 수요의 씨앗이 이때 뿌려졌습니다. 2013년 SK하이닉스가 AMD와 함께 만든 1세대 HBM도 이 시기입니다.", "금융 쪽에서는 제로금리가 7년째 이어졌습니다. 싼 부채는 인수자의 지불 능력을 키웠고, 스마트폰 성장률이 한 자릿수로 떨어지며 유기적 성장이 어려워진 기업들은 통합으로 답했습니다. 2015년 반도체 M&A 발표 총액은 1,000억 달러를 넘어 사상 최대였습니다. Avago–Broadcom(370억), NXP–Freescale(118억), Intel–Altera(167억), WD–SanDisk(190억)가 이 해에 발표됐고, 2016년 ADI–Linear(148억), SoftBank–ARM(320억)이 뒤따랐습니다. Part 1에서 본 린니어의 매각은 이 물결의 전형입니다. 이익률은 최고였지만 성장이 멈췄고, 인수자는 싸게 빌릴 수 있었으며, 고객은 통합된 공급자를 원했습니다.", "중국이 이 시기에 등장합니다. 2014년 국가집적회로산업투자기금(빅펀드) 1기가 1,387억 위안으로 출범했고, 2015년 ‘중국제조 2025’는 반도체 자급률 목표를 내걸었습니다. 2015년 칭화유니가 Micron을 230억 달러에 인수하려 했으나 미국의 안보 심사 우려로 무산됐고, 2016년에는 YMTC(NAND)와 CXMT(DRAM)가 설립됐습니다. 국가자본이 산업에 다시 들어온 것입니다. 1960년대 미국 국방부, 1980년대 일본 통산성에 이어 세 번째입니다. 2016년 브렉시트와 트럼프 당선은 세계화의 역풍을 예고했고, 다음 시기의 미중 갈등으로 이어집니다.", "재무 칸의 핵심은 ‘성장이 멈춘 회사의 자본배분’입니다. 성장 기업은 재투자하고, 성장이 멈춘 기업은 환원하거나 팔립니다. Apple·Qualcomm·TI의 대규모 자사주 매입과 린니어·Altera·ARM의 매각은 같은 동전의 양면입니다. 메모리 3강 체제가 치킨게임을 완화해 이익이 안정된 것도 이 시기의 특징이며, 다음 시기 슈퍼사이클의 조건이 됩니다."], "script": "제로금리가 7년째 이어진 시기입니다. 하지만 매출을 만든 것은 금리가 아니라 스마트폰과 클라우드였습니다. 연 14억 대의 스마트폰, AWS와 Azure의 서버가 칩을 샀습니다. 2012년 AlexNet, 2016년 알파고로 AI의 씨앗도 뿌려집니다. 그리고 성장이 멈춘 회사들은 싼 부채를 쓴 인수자에게 팔렸습니다. 2015년 반도체 M&A는 1,000억 달러로 사상 최대였고, 린니어는 그 다음 해에 팔렸습니다. 이때 중국의 빅펀드도 등장합니다.", "transition": "다음은 메모리 가격이 폭등해 삼성이 25년 만에 1위가 되고, 미중 갈등이 시작된 시기입니다.", "question": "금리가 낮으면 반도체 매출도 늘어나나?", "answer": "자동으로는 아닙니다. 금리는 할인율(주가)과 자금조달(투자·M&A)에 영향을 주지만, 매출은 고객의 실제 주문이 만듭니다. 이 시기의 매출은 스마트폰·클라우드가 만들었고, 금리는 그 기업들의 가치평가와 인수 가격을 끌어올렸습니다. 둘을 구분해야 2022년(금리 급등에도 AI 수요 급증)을 설명할 수 있습니다.", "extraQA": [{"q": "린니어가 1위 Intel처럼 재투자하지 않은 이유는?", "a": "아날로그는 공정 미세화 경쟁이 아니라서 재투자할 곳이 적었습니다. 투자 기회가 없는데 현금이 쌓이면 환원(배당·자사주)이 합리적이고, 그마저 성장이 멈추면 매각이 다음 선택지가 됩니다. 사업의 경제성이 자본배분의 메뉴를 결정합니다."}], "sourceIds": ["fed_history", "qualcomm2013", "tsmc2013", "nxp_freescale", "broadcom", "linear_deal", "bigfund3", "hbm_definition"]}, "coreTransition": "다음은 메모리 가격이 폭등해 삼성이 25년 만에 1위가 되고, 미중 갈등이 시작된 시기입니다."}, {"id": "era7", "part": "p2", "title": "시기 7 · 2017–2019: 메모리 슈퍼사이클과 미중 갈등", "subtitle": "가격 상승이 삼성을 1위로, 가격 하락이 Intel을 다시 1위로 올렸고, 정치가 거래를 좌우하기 시작했다", "type": "era", "core": false, "period": "2017–2019", "keyStat": {"value": "+61.8% / −31.5%", "label": "메모리 시장 매출 증감 2017년 / 2019년(Gartner) · 삼성 1위 → Intel 복귀"}, "rankYear": 2017, "highlight": [2017, 2019], "sideNote": "2017년 Top5: 삼성 598.8억 달러로 Intel(587.3억)을 근소하게 추월. SK하이닉스 3위.", "takeaway": "매출 = 물량 × 가격. 메모리는 가격이 순위를 흔들고, 호황의 최고 이익으로 계산한 PER는 함정이다", "sources": ["gartner2017", "gartner2019", "samsung_ir", "hynix_ir", "japan", "fed_history"], "quad": {"macro": ["2018 트럼프 관세 전쟁, ZTE 제재, 2019.5 화웨이 Entity List", "Fed 2018년까지 2.25–2.50%로 인상 → 2019 인하 전환", "2019 일본의 대한국 소재 수출규제(불화수소·포토레지스트)", "2018 Qualcomm–NXP 무산(중국 불승인): 정치가 M&A를 좌우"], "tech": ["클라우드 서버 메모리 수요 폭발, 2017 메모리 매출 +61.8%", "2019 메모리 −31.5%, 산업 −11.9%: 재고 조정", "7nm EUV(TSMC 2019), 삼성 파운드리 사업부 분리(2017)", "AI 가속기 태동: Google TPU(2016), NVIDIA V100(2017), 5G(2019)"], "leaders": ["2017 삼성 1위(25년 만의 교체), 2019 Intel 복귀", "SK하이닉스 3위·Micron 4위: 메모리 3강의 황금기", "NVIDIA 데이터센터 매출 급증, Broadcom(Avago) 급부상", "중국 YMTC·CXMT 양산 준비, 화웨이 하이실리콘 성장"], "finance": ["2018 삼성 영업이익 58.9조·SK하이닉스 20.8조: 사상 최대", "호황기 대규모 CAPEX → 2019 가격 급락으로 이익 급감(PER 함정)", "주주환원 확대: 삼성 2018–20 환원 정책, 하이닉스 배당 증액", "2018 4분기 금리 인상기에 반도체 주가 급락(SOX −20%)"]}, "study": {"paragraphs": ["2017년 삼성전자가 25년 만에 Intel을 제치고 반도체 매출 1위가 됐습니다. 삼성이 갑자기 CPU를 만들어서가 아닙니다. 클라우드 데이터센터의 서버 메모리 수요가 폭발하면서 DRAM·NAND 공급이 부족해졌고, Gartner 집계로 메모리 시장 매출이 61.8% 늘었습니다. 매출은 물량 곱하기 가격입니다. 메모리 가격이 오르면 물량 변화보다 매출 변화가 훨씬 커서, 메모리 비중이 큰 삼성의 달러 매출이 CPU 중심 Intel을 넘어선 것입니다. 2018년 삼성의 영업이익은 58.9조원, SK하이닉스는 20.8조원으로 모두 사상 최대였습니다.", "2019년은 정반대였습니다. 데이터센터 고객의 재고 조정으로 메모리 매출이 31.5% 줄었고 산업 전체가 11.9% 줄었습니다. Intel은 자기 매출이 0.7% 줄었는데도 1위를 되찾았습니다. 경쟁사가 더 많이 줄었기 때문입니다. 여기에 기업재무의 중요한 함정이 있습니다. 2018년 최고 이익으로 계산한 메모리 주식의 PER는 매우 낮아 ‘저평가’처럼 보였지만, 이듬해 이익이 반토막 나자 그 낮은 배수는 사라졌습니다. 경기순환 기업은 사이클을 반영한 정상화 이익으로 평가해야 합니다. 호황기에 결정한 대규모 CAPEX가 불황에 가동되는 시차도 이익 변동을 키웠습니다.", "정치가 산업에 들어온 시기이기도 합니다. 2018년 트럼프의 관세 전쟁과 ZTE 제재, 2019년 5월 화웨이의 거래제한 명단(Entity List) 등재로 미중 기술 패권 경쟁이 본격화됐습니다. 2018년 Qualcomm의 NXP 인수(470억 달러)는 중국 당국의 승인 지연으로 무산됐습니다. 2016년까지 M&A는 금융 조건이 결정했지만 이제는 정부가 거래의 성사를 좌우했습니다. 2019년 일본의 대한국 소재 수출규제(불화수소·포토레지스트)는 공급망 자체가 외교 무기가 될 수 있음을 보여줬습니다. 중국은 2016년 세운 YMTC·CXMT의 양산을 준비했고, 화웨이의 자회사 하이실리콘이 자체 칩 설계로 성장했습니다.", "기술 쪽에서는 다음 시대의 부품들이 등장했습니다. 2016년 Google TPU, 2017년 NVIDIA V100은 AI 가속기의 출발이었고, TSMC는 2019년 7nm에 EUV를 도입해 독주를 굳혔으며, 2019년 한국에서 5G가 상용화됐습니다. 재무적으로는 주주환원이 확대된 시기입니다. 삼성은 2018~20년 환원 정책을 발표했고 SK하이닉스는 배당을 늘렸습니다. 그러나 2018년 4분기 Fed의 금리 인상기에 반도체 주가는 20% 급락했습니다. 실적과 주가, 금리와 할인율이 따로 움직인다는 것을 보여준 시기입니다."], "script": "2017년 삼성이 25년 만에 1위가 됩니다. CPU를 이겨서가 아니라 서버 메모리 가격이 폭등해 메모리 매출이 62% 늘었기 때문입니다. 2018년 삼성과 하이닉스는 사상 최대 이익을 냈습니다. 그런데 2019년 메모리 매출이 31% 줄자 Intel이 자기 매출이 줄었는데도 1위로 돌아옵니다. 매출은 물량 곱하기 가격이고, 메모리는 가격이 순위를 흔듭니다. 같은 시기 미중 갈등이 시작돼 화웨이 제재와 Qualcomm–NXP 무산처럼 정치가 거래를 좌우하기 시작했습니다.", "transition": "팬데믹과 공급난, 그리고 금리 급등이 겹친 시기입니다.", "question": "2018년 메모리 주식의 PER가 5~6배였는데 왜 쌌던 게 아닌가?", "answer": "분모(이익)가 사이클의 정점이었기 때문입니다. 2019년 이익이 반 이하로 줄자 같은 주가의 PER는 두 배 이상이 됐습니다. 경기순환 기업은 최고 이익이 아니라 사이클 평균(정상화 이익)이나 PBR·ROE로 봐야 합니다. 2026년 삼성·SK하이닉스의 70~80% 영업이익률을 볼 때도 같은 질문을 해야 합니다.", "extraQA": [{"q": "삼성이 1위가 된 것은 기술 우위의 증거인가?", "a": "부분적으로만 그렇습니다. 삼성의 원가·공정 경쟁력은 분명했지만, 2017년 1위의 직접 원인은 가격 사이클이었습니다. 2019년 가격이 내리자 순위가 바뀐 것이 그 증거입니다. 순위 상승과 경쟁력 상승을 같은 것으로 보면 안 됩니다."}], "sourceIds": ["gartner2017", "gartner2019", "samsung_ir", "hynix_ir", "japan"]}, "coreTransition": "팬데믹과 공급난, 그리고 금리 급등이 겹친 시기입니다."}, {"id": "era8", "part": "p2", "title": "시기 8 · 2020–2023: 팬데믹·공급난·재고 조정", "subtitle": "제로금리의 공급 부족에서 5.5% 금리의 재고 조정까지, 그리고 ChatGPT", "type": "era", "core": true, "period": "2020–2023", "keyStat": {"value": "0% → 5.5%", "label": "Fed 정책금리 2022년 3월 → 2023년 7월 · 2021 사상 최대 이익 → 2023 메모리 적자"}, "rankYear": 2020, "highlight": [2020, 2023], "sideNote": "2020년 Top5: 팬데믹 PC 수요로 Intel 복귀. NVIDIA는 9위로 첫 Top10 진입.", "takeaway": "2년 만에 사상 최대 이익에서 적자로. 정부 보조금과 수출통제가 돌아왔고, 2023년 불황 속에서 AI 호황이 시작됐다", "sources": ["intel2020", "gartner2021", "gartner2022", "gartner2023", "fed2023", "chips_nist", "bis_2022", "nvidia2024"], "quad": {"macro": ["2020 코로나: 제로금리·대규모 재정 → 2021 공급망 대란", "2022 인플레이션: Fed 0% → 5.25–5.50%(2023.7) 초고속 인상", "2022.8 미국 CHIPS Act($52.7bn), EU·일본·한국도 보조금 경쟁", "2022.10 미국의 대중 첨단 반도체·장비 수출통제, 2023 일본·네덜란드 동참"], "tech": ["재택근무 PC·서버 수요(2020), 자동차 칩 부족(2021)", "2021 매출 +26% → 2022 하반기 재고 조정 → 2023 −8.2%", "2022.11 ChatGPT → 2023 AI 서버·H100·HBM3 수요 폭발", "3nm 양산(2022), 인텔 파운드리 재진입(IDM 2.0)"], "leaders": ["Intel(2020) → 삼성(2021–22) → Intel(2023): 순위 요동", "NVIDIA 2020 Top10 첫 진입 → 2023 시가총액 $1조", "AMD·MediaTek 급성장(2021), TSMC 시총 세계 10위권", "2023 메모리 적자: SK하이닉스 영업손실 7.7조, 삼성 반도체 적자"], "finance": ["2021 사상 최대 이익 → 2023 적자: 2년 만의 반전", "정부 자본의 귀환: 보조금·세액공제가 팹 입지를 결정", "2022 금리 급등으로 성장주 급락(SOX −35%): 할인율의 힘", "인텔 배당 삭감(2023)·CAPEX 부담, NVIDIA FCF 급증"]}, "study": {"paragraphs": ["팬데믹은 반도체에 두 번의 반전을 줬습니다. 2020년 재택근무와 원격수업으로 PC·서버 수요가 늘어 Intel이 1위를 되찾았고, NVIDIA가 9위로 처음 Top10에 들어왔습니다. 2021년에는 강한 전자제품 수요, 5G 스마트폰, 자동차 칩 부족이 겹쳐 매출이 26% 늘었고 가격 상승으로 삼성이 다시 1위, AMD와 MediaTek이 60% 넘게 성장했습니다. 그러나 2022년 하반기 인플레이션과 금리 인상, PC·스마트폰 수요 둔화, 고객의 재고 부담이 문제가 됐습니다. 공급 부족 때 쌓아 둔 재고가 수요 둔화기에 새 주문을 줄였습니다. 2023년 산업 매출은 8.2% 줄었고 메모리는 적자였습니다. SK하이닉스는 2023년 영업손실 7.7조원, 삼성 반도체 부문도 적자였습니다. 2021년 사상 최대 이익에서 2년 만의 반전입니다.", "거시 환경이 극적으로 바뀌었습니다. Fed는 2022년 3월 0%에서 2023년 7월 5.25~5.50%까지 역대 가장 빠른 속도로 금리를 올렸습니다. 2022년 반도체 주가지수(SOX)는 35% 떨어졌습니다. 실적이 아직 좋을 때 주가가 먼저 떨어진 것은 할인율의 힘입니다. 같은 시기 정부 자본이 돌아왔습니다. 2022년 8월 미국 CHIPS Act는 527억 달러의 보조금과 세액공제로 팹을 미국에 유치했고, EU·일본(라피더스, TSMC 구마모토)·한국도 보조금 경쟁에 나섰습니다. 2022년 10월 미국은 첨단 AI 칩과 장비의 대중 수출을 통제했고 2023년 일본·네덜란드가 동참했습니다. 1980년대 미일 반도체협정 이후 가장 강한 정부 개입입니다.", "그리고 2022년 11월 ChatGPT가 나왔습니다. 2023년은 ‘반도체 불황’과 ‘AI 반도체 호황’이 동시에 성립한 해입니다. PC·스마트폰용 메모리는 재고 조정 중이었지만, 데이터센터는 NVIDIA H100과 HBM3를 사들이기 시작했습니다. NVIDIA의 FY2024(2024년 1월 결산) 데이터센터 매출은 475억 달러로 217% 늘었고 시가총액은 1조 달러를 넘었습니다. 2023년 1위는 Intel이었지만(메모리 업체가 더 많이 줄어서), 다음 해의 1위는 이미 정해지고 있었습니다. 제품과 고객이 다르면 같은 해에 불황과 호황이 공존합니다.", "재무 칸에서 볼 것은 세 가지입니다. 첫째, 메모리의 이익은 2년 만에 사상 최대에서 적자로 갈 수 있다(사이클). 둘째, 정부 보조금과 세액공제가 자본비용을 바꿔 팹 입지를 결정한다(정부 자본). 셋째, 금리 급등은 실적보다 먼저 주가를 때린다(할인율). 인텔은 2023년 배당을 삭감하고 파운드리 투자 부담에 시달렸고, NVIDIA는 공장 없이 FCF가 급증했습니다. 같은 산업 안에서 자본배분의 처지가 정반대였습니다."], "script": "팬데믹은 두 번의 반전을 줬습니다. 2020~21년 재택 수요와 공급 부족으로 사상 최대 이익, 그리고 2022~23년 금리 급등과 재고 조정으로 메모리 적자. 하이닉스는 2023년 7.7조원 영업손실을 냈습니다. 같은 시기 정부가 돌아왔습니다. 미국의 CHIPS Act 527억 달러, 대중 수출통제. 그리고 2022년 11월 ChatGPT가 나왔습니다. 2023년은 메모리 불황과 AI 호황이 동시에 있던 해입니다.", "transition": "그 AI 호황이 산업 전체를 바꾼 현재, 시기 9입니다.", "question": "2023년에 불황과 호황이 어떻게 동시에 있었나?", "answer": "고객과 제품이 달랐기 때문입니다. PC·스마트폰 고객은 2021년에 쌓은 재고를 소진하느라 메모리 주문을 줄였고, 데이터센터 고객은 ChatGPT 이후 GPU와 HBM을 사들였습니다. 반도체 전체를 한 업황으로 묶지 말고 제품·고객별로 나눠야 합니다. 2026년에도 범용 DRAM과 HBM, 소비자와 하이퍼스케일러를 나눠 봐야 합니다.", "extraQA": [{"q": "CHIPS Act 같은 보조금은 기업재무에서 어떻게 보나?", "a": "자본비용을 낮추는 효과입니다. 투자액의 25% 세액공제는 같은 공장의 ROIC를 높여 투자 결정을 바꿉니다. 다만 보조금 조건(이익 공유, 중국 투자 제한)과 정치 변화(2025년 이후 지분 요구)가 위험 요인이 되며, 보조금이 있는 곳에 공급 과잉이 생길 수도 있습니다."}], "sourceIds": ["intel2020", "gartner2021", "gartner2022", "gartner2023", "fed2023", "chips_nist", "bis_2022", "nvidia2024"]}, "coreTransition": "그 AI 호황이 산업 전체를 바꾼 현재, 시기 9입니다."}, {"id": "era9", "part": "p2", "title": "시기 9 · 2024–2026: AI 인프라와 HBM", "subtitle": "NVIDIA가 1위가 되고, 한국 메모리가 기록적 이익을 냈으며, 돈·전력·정치가 새 병목이 됐다", "type": "era", "core": true, "period": "2024–2026", "keyStat": {"value": "$125.7bn", "label": "2025년 NVIDIA 반도체 매출(Gartner 잠정) · 2위 삼성의 1.7배 · SK하이닉스 3위"}, "rankYear": 2025, "highlight": [2024, 2026], "sideNote": "2025 Top5는 2026.01.12 잠정치. 2026년 순위는 2027년 1월 발표.", "takeaway": "수요의 중심은 AI 데이터센터로 이동했고, 공급의 병목은 HBM·패키징에서 전력과 자본으로 옮겨가고 있다", "sources": ["gartner2024", "gartner2025", "C01", "C02", "C16", "C17", "fed_2026", "WSTS_FORECAST", "kcfed_ai", "cnbc_midterm"], "quad": {"macro": ["2024 Fed 인하 시작 → 2025 트럼프 2기 관세·수출통제 강화", "2026 이란 전쟁·유가 급등 → Fed 9월 인상(3.75–4.00%), 10월 동결", "2026.11 미국 중간선거 민주당 압승: 데이터센터 규제 논의", "한국 반도체특별법(2026.8)·용인 클러스터 14GW 전력 협약"], "tech": ["NVIDIA Blackwell→Rubin, HBM3E→HBM4(2026), CoWoS 병목", "하이퍼스케일러 CAPEX 2026 약 $720bn+, 2027 $1조 전망", "메모리 가격 급등: WSTS 2026 매출 $1.5조·메모리 $804bn 전망", "전력(GW)·가스터빈(백로그 122GW)·원전 재가동이 새 병목"], "leaders": ["NVIDIA 2024 첫 1위(766.9억) → 2025 1,257억 달러", "삼성 2위·SK하이닉스 3위(HBM 1위)·Micron 5위", "TSMC 2025 매출 $122bn, Broadcom 커스텀 ASIC 급성장", "중국 Huawei Ascend·CXMT·캄브리콘 부상, Intel 4위로 하락"], "finance": ["2026 Q3 메모리 영업이익률 72–80%, SK하이닉스 순현금 98.7조", "빅테크 FCF 압박: Amazon TTM FCF −$42bn, Alphabet 부채 $125bn", "AI 채권·SPV·네오클라우드 차입 급증(KC Fed: IG 발행의 10%)", "IMF·BoE 경고, ‘사이클 vs 구조’ 논쟁 → Part 3"]}, "study": {"paragraphs": ["Gartner 2024년 최종 집계에서 NVIDIA가 766.9억 달러로 처음 1위가 됐고, 2025년 잠정치에서는 1,257억 달러로 2위 삼성(725.4억)의 1.7배가 됐습니다. SK하이닉스는 HBM 덕에 606.4억 달러로 Intel을 제치고 3위에 올랐습니다. 생성형 AI 모델을 학습·서비스하려는 데이터센터 투자가 GPU뿐 아니라 HBM, 네트워크, 첨단 패키징(TSMC CoWoS)까지 함께 끌어올렸습니다. NVIDIA의 FY2026(2026년 1월 결산) 매출은 2,159억 달러, 2026년 7월 분기 매출은 962억 달러(데이터센터 890억, +117%)였습니다. TSMC의 2025년 매출은 1,224억 달러로 순위에 포함했다면 2위입니다.", "수요를 만드는 쪽은 하이퍼스케일러입니다. 2026년 설비투자 가이던스는 Amazon 약 2,200억 달러, Microsoft 약 1,700억(역년), Alphabet 1,950~2,050억, Meta 1,350~1,450억으로 합계 7,200억 달러를 넘고, 2027년에는 1조 달러를 넘을 것이라는 전망(골드만삭스)이 나옵니다. 그 결과 메모리 가격이 급등해 WSTS는 2026년 세계 반도체 매출을 1조 5,110억 달러(2025년 7,956억의 1.9배), 메모리를 8,040억 달러로 전망했습니다. 2026년 3분기 삼성 DS 부문은 매출 147.1조원에 영업이익 106.5조원, SK하이닉스는 104.6조원에 83.3조원(영업이익률 80%)을 기록했고, SK하이닉스의 순현금은 98.7조원입니다. 2023년 7.7조 적자에서 3년 만의 일입니다.", "거시 환경은 2026년에 급변했습니다. 2월 말 이란 전쟁으로 유가가 급등(브렌트 3월 120달러)했고, 9월 CPI는 3.7%였습니다. Fed는 9월 16일 2023년 이후 첫 인상으로 3.75~4.00%를 만들었고 10월 28일 동결했지만 2명이 추가 인상을 주장했습니다. 10년물 국채는 4.7~4.9%대입니다. 11월 3일 중간선거에서 민주당이 상·하원을 모두 장악했고, 같은 날 41건의 데이터센터 관련 주민투표 중 40건이 반대로 결론 났습니다. 텍사스·오하이오 주지사 당선자는 데이터센터 모라토리엄을 지지합니다. 11월 4일 NVIDIA −3%, Micron −7%, Vertiv −14%, 11월 5일 코스피 −5.3%, 삼성 −7.6%, SK하이닉스 −9.5%였습니다.", "재무 칸이 Part 3의 입구입니다. 공급자(메모리)는 사상 최대 이익과 순현금을 쌓고 있지만, 수요자(빅테크)는 Amazon TTM FCF −424억 달러, Alphabet 장기부채 1,251억 달러(연초 465억), Meta 신용등급 전망 하향, Oracle BBB− 등 자금 압박을 받고 있습니다. 캔자스시티 연은은 AI 기업의 투자등급 채권 발행 비중이 2023년 2%에서 2026년 10%로 늘었고 SPV가 90% 차입으로 조달된다고 지적했으며, IMF와 영란은행은 AI 자산 가격 조정 위험을 경고했습니다. 이번 사이클이 2017~19년의 반복인지, 수요 주체와 계약 구조가 달라진 구조 변화인지가 Part 3의 질문입니다."], "script": "현재입니다. 2024년 NVIDIA가 처음 1위가 됐고 2025년에는 2위의 1.7배가 됐습니다. 하이퍼스케일러의 올해 투자는 7,200억 달러를 넘고 내년에는 1조 달러 전망입니다. 메모리 가격이 급등해 2026년 3분기 삼성 DS는 영업이익 106조, SK하이닉스는 83조원을 냈습니다. 영업이익률 80%입니다. 그런데 올해 가을 환경이 바뀌었습니다. 이란 전쟁으로 유가가 오르고 Fed가 9월에 금리를 올렸고, 이번 주 중간선거에서 민주당이 압승하며 데이터센터 규제 논의가 시작됐습니다. 그제 뉴욕에서 반도체가, 어제 코스피가 5% 떨어졌습니다. 이것이 Part 3의 질문입니다.", "transition": "9개 시기를 한 표로 정리하고 Part 3으로 넘어가겠습니다.", "question": "NVIDIA의 1위는 2017년 삼성처럼 가격 효과인가?", "answer": "다릅니다. 삼성의 2017년 1위는 같은 제품의 가격 상승이었지만, NVIDIA의 1위는 새 제품군(AI 가속기)의 물량과 가격이 함께 늘어난 결과이고 2년 연속 격차를 벌렸습니다. 다만 2026년 메모리 기업의 이익 급증에는 2017년과 같은 가격 효과가 크게 작용하고 있어, 메모리 쪽은 사이클 위험을 더 경계해야 합니다.", "extraQA": [{"q": "2026년 순위는 어떻게 될 것 같나?", "a": "2026년 3분기 실적(삼성 DS 147조원, SK하이닉스 105조원)을 달러로 환산하면 분기 매출이 각각 1,000억·700억 달러 수준이라 메모리 기업의 연간 매출이 크게 늘어 NVIDIA와의 격차가 줄거나 역전될 가능성도 있습니다. 다만 Gartner 집계 범위와 환율, 4분기 가격에 따라 달라지므로 2027년 1월 잠정 발표를 봐야 합니다."}], "sourceIds": ["gartner2024", "gartner2025", "C01", "C02", "C10", "C16", "C17", "fed_2026", "WSTS_FORECAST", "kcfed_ai", "cnbc_midterm", "cnbc_ballot"]}, "coreTransition": "9개 시기를 한 표로 정리하고 Part 3으로 넘어가겠습니다."}, {"id": "p2-korea", "part": "p2", "title": "한국 메모리의 43년: 추격에서 HBM 1위까지", "subtitle": "1983년 64K DRAM에서 2026년 영업이익률 80%까지, 세 번의 위기를 ‘버티는 돈’으로 넘었다", "type": "timeline", "core": false, "takeaway": "한국이 이긴 비결은 기술만이 아니라 불황에 투자를 멈추지 않은 자본이었다. 그 자본이 이번 사이클에서도 시험대에 선다", "sources": ["samsung_history", "hynix_lineage", "hbm_definition", "hbm_history", "gartner2017", "gartner2025", "C01", "C02"], "events": [{"year": "1983", "title": "64K DRAM", "text": "삼성 도쿄 선언 · 세계 세 번째<br>DRAM 생산국, 80년대 적자 감수"}, {"year": "1992", "title": "DRAM 세계 1위", "text": "64M DRAM 세계 최초 개발<br>일본 버블 붕괴의 틈을 파고듦"}, {"year": "1999–2001", "title": "빅딜 · 하이닉스", "text": "외환위기 → 현대+LG반도체 통합<br>2001 하이닉스, 채권단 관리"}, {"year": "2008–2012", "title": "치킨게임 생존", "text": "삼성 적자에도 투자 지속<br>2012 SK하이닉스 출범(3.4조원)"}, {"year": "2013–2017", "title": "HBM 최초 · 삼성 1위", "text": "2013 SK하이닉스 HBM 1세대<br>2017 삼성 25년 만의 1위", "accent": true}, {"year": "2024–2026", "title": "HBM 시대", "text": "SK하이닉스 HBM 1위·Gartner 3위<br>2026 Q3 영업이익 106.5조+83.3조", "accent": true}], "note": "삼성 DS 부문과 SK하이닉스 연결 기준, 2026년 3분기 공시. 세 번의 위기(1997·2008·2023)마다 투자를 지속한 쪽이 다음 호황의 점유율을 가져갔다.", "study": {"paragraphs": ["한국 메모리의 역사는 Part 2의 9개 시기를 하나의 선으로 관통합니다. 1983년 삼성이 64K DRAM을 개발해 미국·일본에 이어 세 번째 생산국이 됐을 때 일본은 세계 1위였고 삼성은 1980년대 내내 적자를 냈습니다. 1992년 64M DRAM을 세계 최초로 개발하며 DRAM 1위가 된 것은 버블 붕괴로 투자를 줄인 일본의 틈을 적자를 감수한 증설로 파고든 결과였습니다.", "세 번의 위기가 있었습니다. 1997년 외환위기에는 차입 기반 투자의 약점이 드러나 정부 주도 빅딜로 현대전자가 LG반도체를 흡수했고 2001년 하이닉스가 채권단 관리에 들어갔습니다. 2008~12년 치킨게임과 금융위기에는 Qimonda·Elpida가 무너졌지만 삼성은 적자에도 투자를 이어갔고 하이닉스는 2012년 SK에 인수되며 버티는 돈을 얻었습니다. 2023년에는 금리 급등과 재고 조정으로 SK하이닉스가 7.7조원 영업손실을 냈지만, 2013년부터 10년을 투자한 HBM이 AI 수요를 만나 2024년부터 HBM 1위, 2025년 Gartner 3위가 됐습니다.", "2026년 3분기 삼성 DS 영업이익 106.5조원, SK하이닉스 83.3조원은 그 43년의 결과입니다. 그러나 같은 역사는 경고이기도 합니다. 1996년, 2008년, 2019년, 2023년에 메모리 이익은 급락했고, 지금의 80% 영업이익률은 가격 사이클의 정점일 수 있습니다. 삼성의 2026년 설비투자 84.4조원(DS 76.8조원)과 SK하이닉스의 순현금 98.7조원·주주환원 확대는 ‘이 현금을 어디에 쓸 것인가’라는 린니어의 질문을 다시 던집니다. 중국 CXMT(DRAM 점유율 8%)와 YMTC(NAND 3위)의 추격도 시작됐습니다. 이 장표는 시간이 없으면 건너뛰고, 시기 9에서 한 문장으로 언급해도 됩니다."], "script": "한국 메모리의 43년을 한 줄로 보면, 세 번의 위기를 버티는 돈으로 넘은 역사입니다. 1997년 외환위기에는 빅딜로, 2008년 치킨게임에는 삼성의 투자 지속과 SK의 하이닉스 인수로, 2023년 적자에는 10년을 투자한 HBM으로 넘었습니다. 그 결과가 2026년 3분기 영업이익 106조원과 83조원입니다. 하지만 같은 역사는 메모리 이익이 2년 만에 적자로 갈 수 있다는 경고이기도 합니다.", "transition": "9개 시기를 한 표로 정리하겠습니다.", "question": "한국이 메모리에서 이긴 비결은 무엇인가?", "answer": "기술 추격, 양산 속도, 그리고 불황에 투자를 멈추지 않은 자본(그룹 자본·정부 지원·채권단)의 결합입니다. 일본은 버블 붕괴로, 독일·일본의 Qimonda·Elpida는 만기로 투자를 멈췄을 때 한국은 멈추지 않았습니다. 다만 그 자본 구조(차입·재벌)는 1997년처럼 위기의 원인이 되기도 했습니다.", "sourceIds": ["samsung_history", "hynix_lineage", "hbm_definition", "hbm_history", "gartner2017", "gartner2025", "C01", "C02", "cxmt_ipo"]}, "coreTransition": "9개 시기를 한 표로 정리하겠습니다."}, {"id": "p2-wrap", "part": "p2", "title": "9개 시기를 한 표로: 무엇이 1위를 바꿨나", "subtitle": "수요의 중심 · 1위 · 금리와 정책 · 재무의 교훈", "type": "table", "core": false, "compact": true, "takeaway": "1위를 바꾼 것은 수요의 중심 이동이고, 승자를 가른 것은 불황을 버틸 자본이었다", "sources": ["ranking_history", "gartner2017", "gartner2024", "gartner2025", "WSTS", "fed_history"], "headers": ["시기", "수요의 중심", "1위(Gartner)", "금리·정책", "재무의 교훈"], "rows": [["① 1980–85", "메인프레임 → PC 탄생", "TI·Motorola → NEC", "볼커 고금리 · 플라자합의", "고금리는 자본집약 산업을 직격, 은행 자본의 일본이 승리"], ["② 1986–91", "PC · DRAM 대량생산", "NEC", "엔고·버블 · 미일 반도체협정", "버블 자금의 증설, 협정이 오히려 일본 이익을 키움"], ["③ 1992–99", "PC · 인터넷", "Intel", "미국 호황 · 아시아 외환위기", "독점 이익의 재투자(Intel), 차입 투자의 위기(한국 빅딜)"], ["④ 2000–07", "디지털 기기 · 휴대폰", "Intel", "닷컴 붕괴 · Fed 1% · LBO", "현금 환원의 시대(린니어 ASR), 치킨게임의 전조"], ["⑤ 2008–12", "스마트폰 · 클라우드 태동", "Intel", "금융위기 · 제로금리 시작", "현금과 만기가 생사를 가름(Elpida), 불황 투자의 승리(삼성)"], ["⑥ 2013–16", "모바일 · 클라우드", "Intel", "제로금리 · 중국 빅펀드", "싼 부채의 M&A 붐, 성장 정체 기업의 매각(린니어)"], ["⑦ 2017–19", "서버 메모리", "삼성 → Intel", "금리 인상 · 미중 갈등", "가격이 순위를 바꿈, PER 함정, 정치가 M&A를 좌우"], ["⑧ 2020–23", "재택 PC → 재고 조정 → AI", "Intel → 삼성 → Intel", "0% → 5.5% · CHIPS · 수출통제", "2년 만의 이익 반전, 정부 자본의 귀환, 할인율의 힘"], ["⑨ 2024–26", "AI 데이터센터 · HBM", "NVIDIA", "인하 → 2026 인상 · 선거", "공급자 기록 이익 vs 수요자 FCF 압박, 사이클 vs 구조"]], "note": "1위는 Gartner 반도체 공급업체 매출 기준(파운드리 제외). 시기 구분과 교훈은 우리 조의 해석.", "study": {"paragraphs": ["표의 세 번째 열(1위)을 세로로 읽으면 NEC → Intel(25년) → 삼성 → Intel → 삼성 → Intel → NVIDIA입니다. 두 번째 열(수요의 중심)을 함께 읽으면 왜 바뀌었는지 보입니다. 수요가 메인프레임에서 PC로 올 때 CPU의 Intel이, PC에서 서버 메모리로 올 때 삼성이, AI 데이터센터로 올 때 NVIDIA가 1위가 됐습니다. 메모리 가격 사이클은 그 사이에서 삼성과 Intel의 자리를 네 번 바꿨습니다.", "네 번째 열(금리·정책)은 자본비용의 역사입니다. 1980년대 초 고금리, 1990년대 호황, 2003년 1%, 2008~15년 0%, 2022~23년 5.5%, 2026년 재인상. 그리고 정부: 1986년 미일 협정, 2014년 중국 빅펀드, 2022년 CHIPS Act와 수출통제, 2026년 선거 후 데이터센터 규제. 다섯 번째 열(교훈)은 그 조건에서 누가 이기고 졌는지입니다. 공통점은 하나입니다. 불황을 버틸 자본을 가진 쪽이 다음 호황의 점유율을 가져갔습니다.", "이 표는 발표 시간이 부족할 때 시기 장표 여러 개를 대신할 수 있습니다. 표만 띄우고 ‘1위 열을 보시면 수요의 중심이 이동할 때마다 바뀌었고, 교훈 열을 보시면 승자를 가른 것은 자본이었다’고 말하면 Part 2의 메시지가 전달됩니다."], "script": "9개 시기를 한 표로 보겠습니다. 1위 열을 보시면 NEC, Intel 25년, 삼성, Intel, 삼성, Intel, NVIDIA입니다. 수요의 중심 열과 같이 보시면 PC가 올 때 Intel이, 서버 메모리가 올 때 삼성이, AI가 올 때 NVIDIA가 1위가 됐습니다. 교훈 열의 공통점은 하나입니다. 불황을 버틸 자본을 가진 쪽이 다음 호황을 가져갔습니다.", "transition": "이 흐름에서 세 가지 규칙을 뽑아 Part 3으로 가겠습니다.", "question": "시기 구분이 자의적이지 않나?", "answer": "구분은 해석이므로 다른 구분도 가능합니다. 우리는 Gartner 1위 교체와 수요의 중심 이동, 거시 충격(닷컴·금융위기·팬데믹·금리 급등)을 기준으로 삼았고, 교수님이 공유한 영상의 흐름과 맞췄습니다. 중요한 것은 구분 자체가 아니라 각 시기를 같은 네 칸(거시·기술·기업·재무)으로 읽을 때 반복되는 규칙입니다.", "sourceIds": ["ranking_history", "gartner2017", "gartner2019", "gartner2021", "gartner2023", "gartner2024", "gartner2025", "WSTS", "fed_history"]}, "coreTransition": "이 흐름에서 세 가지 규칙을 뽑아 Part 3으로 가겠습니다."}, {"id": "p2-lesson", "part": "p2", "title": "Part 2 결론: 흐름을 읽는 네 가지 규칙", "subtitle": "45년의 역사가 반복해서 보여준 것", "type": "cards", "core": true, "takeaway": "이 네 규칙으로 지금의 AI 사이클을 읽으면, ‘반복인가 구조 변화인가’라는 Part 3의 질문이 된다", "sources": ["ranking_history", "gartner2017", "gartner2025", "elpida_failure", "fed_history", "chips_nist"], "cards": [{"label": "규칙 ①", "title": "수요의 중심이 이동하면 1위가 바뀐다", "stat": "PC → 모바일 → AI", "text": "Intel 25년, 삼성, NVIDIA.<br>새 서비스가 쓰이는 기기에 어떤 칩이 필요한지 따라가라", "detail": "린니어의 아날로그는 모든 기기에 들어갔지만 성장의 중심은 아니었다", "accent": true}, {"label": "규칙 ②", "title": "메모리는 가격이 순위와 이익을 흔든다", "stat": "2017 · 2019 · 2021 · 2023", "text": "매출 = 물량 × 가격.<br>호황의 최고 이익으로 계산한 PER는 함정이다", "detail": "2018 사상 최대 → 2019 급감, 2021 최대 → 2023 적자. 2026년 80% 이익률도 같은 질문"}, {"label": "규칙 ③", "title": "불황을 버틴 자본이 다음 호황을 가져간다", "stat": "삼성 2008 · Elpida 2012", "text": "투자는 장기, 만기는 단기.<br>기술이 있어도 시간을 못 맞추면 무너진다", "detail": "치킨게임의 승자는 가장 기술이 좋은 회사가 아니라 가장 오래 버티는 회사"}, {"label": "규칙 ④", "title": "금리와 정부가 자본비용을 바꾼다", "stat": "0% → 5.5% · CHIPS", "text": "싼 돈은 M&A와 멀티플을, 보조금은 팹 입지를,<br>수출통제는 고객을 바꾼다", "detail": "2015 M&A 붐(린니어 매각), 2022 SOX −35%, 2026 선거 후 규제"}], "study": {"paragraphs": ["Part 2를 네 규칙으로 정리합니다. 첫째, 수요의 중심이 이동하면 1위가 바뀝니다. PC 시대의 Intel, 서버 메모리 시대의 삼성, AI 시대의 NVIDIA. 새 서비스가 유행하면 그 서비스가 쓰이는 기기에 어떤 칩이 필요한지 따라가면 수혜 기업이 보입니다. 린니어의 아날로그는 모든 기기에 들어갔지만 어느 시대에도 성장의 중심은 아니었고, 그래서 잘 벌면서도 커지지 못했습니다.", "둘째, 메모리는 가격이 순위와 이익을 흔듭니다. 매출은 물량 곱하기 가격이고, 2017·2021년의 1위와 2019·2023년의 급락은 모두 가격이 만들었습니다. 호황의 최고 이익으로 계산한 PER는 함정이며, 2026년 3분기의 80% 영업이익률을 볼 때도 같은 질문을 해야 합니다. 셋째, 불황을 버틴 자본이 다음 호황을 가져갑니다. 투자는 장기이고 만기는 단기입니다. 기술이 있던 Elpida는 만기에 무너졌고, 적자에도 투자한 삼성은 점유율을 가져갔습니다. 치킨게임의 승자는 가장 오래 버티는 회사입니다.", "넷째, 금리와 정부가 자본비용을 바꿉니다. 제로금리는 2015년 M&A 붐을 낳아 린니어를 팔리게 했고, 2022년 금리 급등은 실적보다 먼저 주가를 35% 떨어뜨렸으며, 보조금은 팹의 입지를, 수출통제는 고객을 바꿨습니다. 2026년 11월 선거 후 데이터센터 규제 논의는 이 규칙의 최신판입니다. 이 네 규칙으로 지금의 AI 사이클을 읽으면 Part 3의 질문이 됩니다. 이번은 규칙 ②의 반복인가, 아니면 수요 주체와 계약 구조가 달라진 구조 변화인가."], "script": "45년을 네 규칙으로 정리하면 이렇습니다. 수요의 중심이 이동하면 1위가 바뀐다. 메모리는 가격이 순위와 이익을 흔든다. 불황을 버틴 자본이 다음 호황을 가져간다. 그리고 금리와 정부가 자본비용을 바꾼다. 린니어는 규칙 ①과 ④에 걸렸습니다. 성장의 중심이 아니었고, 싼 돈의 시대에 팔렸습니다. 이 네 규칙으로 지금을 읽으면 Part 3의 질문이 됩니다. 이번 AI 사이클은 반복인가, 구조 변화인가.", "transition": "Part 3, 현재와 전망입니다.", "question": "네 규칙 중 지금 가장 중요한 것은?", "answer": "규칙 ②와 ③입니다. 메모리 이익이 가격 사이클의 정점일 가능성(②)과, 빅테크·네오클라우드가 투자 경쟁을 버틸 자본을 가졌는지(③)가 2027년 이후를 결정합니다. 규칙 ④(금리·선거)는 그 시점을 앞당기거나 늦추는 변수입니다.", "sourceIds": ["ranking_history", "gartner2017", "gartner2019", "gartner2025", "elpida_failure", "fed_history", "chips_nist"]}, "coreTransition": "Part 3, 현재와 전망입니다."}, {"id": "p3-div", "part": "p3", "title": "이후 반도체 산업의 변화: 현재와 전망", "type": "divider", "core": true, "lead": "AI 수요가 메모리 가격을 두 배로 올렸고 한국 기업은 영업이익률 80%를 기록했다. 그런데 이번 주, 금리와 선거와 ‘속도 조절론’이 시장을 5% 떨어뜨렸다. 반복되는 사이클인가, 이번에는 다른가.", "sources": ["C01", "C02", "WSTS_FORECAST", "fed_2026", "cnbc_midterm"], "study": {"paragraphs": []}}, {"id": "p3-boom", "part": "p3", "title": "2026년, 산업 매출이 1년 만에 두 배가 됐다", "subtitle": "세계 반도체 매출(WSTS, 십억 달러) · 2026·2027은 2026년 6월 전망 · 8월 중간 집계는 2026년 1조 6,550억 달러로 상향", "type": "chart", "kind": "svg", "core": true, "takeaway": "AI 데이터센터 수요가 GPU에서 HBM·범용 DRAM·NAND로 번졌다. 두 배의 대부분은 물량이 아니라 메모리 가격이다", "sources": ["WSTS", "WSTS_FORECAST", "wsts_q2_2026", "sia_sep2026", "gartner2025"], "items": [{"label": "2023", "value": 526.9, "text": "527", "sub": "−8.2%", "dim": true}, {"label": "2024", "value": 630.5, "text": "631", "sub": "+19.7%"}, {"label": "2025", "value": 795.6, "text": "796", "sub": "+26.2%", "highlight": true}, {"label": "2026F", "value": 1511.2, "text": "1,511", "sub": "+89.9% 전망", "color": "#ffb15e"}, {"label": "2027F", "value": 1913.7, "text": "1,914", "sub": "+26.6% 전망", "color": "#ffb15e", "dim": true}], "opts": {"width": 820, "height": 340, "max": 2150, "unit": "", "decimals": 0, "label": "세계 반도체 매출 202
